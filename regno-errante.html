/* ── Rumore di valore per la fertilità ───────────────────────── */
function makeFert(rnd){
  const A=9, B=19;
  const g1=[],g2=[];
  for(let i=0;i<A*A;i++)g1.push(rnd());
  for(let i=0;i<B*B;i++)g2.push(rnd());
  const smp=(g,S,u,v)=>{
    const x=u*(S-1), y=v*(S-1);
    const x0=Math.floor(x), y0=Math.floor(y);
    const x1=Math.min(S-1,x0+1), y1=Math.min(S-1,y0+1);
    const fx=x-x0, fy=y-y0;
    const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
    const a=g[y0*S+x0]*(1-sx)+g[y0*S+x1]*sx;
    const b=g[y1*S+x0]*(1-sx)+g[y1*S+x1]*sx;
    return a*(1-sy)+b*sy;
  };
  const f=new Float32Array(GW*GH);
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    const u=i/(GW-1), v=j/(GH-1);
    let n=smp(g1,A,u,v)*.72+smp(g2,B,u,v)*.28;
    // I bordi del mondo sono terra povera: spinge il popolo verso il centro
    const edge=Math.min(u,v,1-u,1-v);
    n*= .55+.45*Math.min(1,edge*5.5);
    f[j*GW+i]=clamp(n*1.28-.08,0,1);
  }
  return f;
}
const fertAt=(G,x,y)=>{
  const i=clamp(x/CELL|0,0,GW-1), j=clamp(y/CELL|0,0,GH-1);
  return G.fert[j*GW+i];
};

const NODE={
  campo:{n:'Campo',   ic:'🌾', res:'grano', rate:3.2, ic2:'🌾'},
  bosco:{n:'Bosco',   ic:'🌲', res:'legna', rate:2.6, ic2:'🪵'},
  ferro:{n:'Vena di ferro',ic:'⛰️',res:'ferro',rate:1.7,ic2:'⛏️'},
  rovina:{n:'Rovina', ic:'🏛️', res:null,    rate:0,   ic2:'📜'}
};

function genWorld(seed,mode){
  const rnd=mulberry32(seed);
  const G={
    seed, mode, rnd,
    fert:null, seen:new Uint8Array(GW*GH),
    nodes:[], camps:[], bands:[], fx:[],
    day:1, t:0, speedV:1, over:false, settled:false,
    sapere:0, era:1, conq:0, migr:0, ruins:0,
    stock:{grano:95,legna:45,ferro:12},
    arms:{lancia:0,arco:0,spada:0,cavallo:0,balestra:0},
    blds:{capanne:1,granaio:1,fucina:1,caserma:1,torre:0,carri:1,tenda:1},
    free:12, forgeSel:'lancia', forgeP:0, birthAcc:0, starve:0, morale:1,
    nextRaid:14, log:[], peak:0, lost:0, born:0,
    camp:{x:0,y:0,state:'fermo',tx:0,ty:0,prog:0},
    days:MODES[mode].days
  };
  G.fert=makeFert(rnd);

  const far=(x,y,arr,d)=>!arr.some(o=>dist(x,y,o.x,o.y)<d);

  // Punto di partenza: terra grassa con almeno due campi e un bosco vicini
  let best=null;
  for(let k=0;k<400;k++){
    const x=180+rnd()*(W-360), y=180+rnd()*(H-360);
    const f=fertAt(G,x,y);
    let s=f*3;
    for(let a=0;a<10;a++){
      const ax=x+(rnd()-.5)*260, ay=y+(rnd()-.5)*260;
      s+=fertAt(G,ax,ay);
    }
    if(!best||s>best.s)best={x,y,s};
  }
  G.camp.x=best.x; G.camp.y=best.y;

  // Risorse, con quote fisse: la mappa è diversa, l'abbondanza no
  const quota=[['campo',36],['bosco',28],['ferro',18],['rovina',7]];
  for(const [type,q] of quota){
    let placed=0, tries=0;
    while(placed<q&&tries<4000){
      tries++;
      const x=40+rnd()*(W-80), y=40+rnd()*(H-80);
      const f=fertAt(G,x,y);
      if(type==='campo'&&f<.5)continue;
      if(type==='bosco'&&(f<.3||f>.85))continue;
      if(type==='ferro'&&f>.42)continue;
      if(!far(x,y,G.nodes,58))continue;
      if(type!=='campo'&&dist(x,y,G.camp.x,G.camp.y)<70)continue;
      const cap=type==='campo'?Math.round(150+260*f)
              :type==='bosco'?Math.round(220+180*rnd())
              :type==='ferro'?Math.round(140+130*rnd()):0;
      G.nodes.push({id:'n'+G.nodes.length,type,x,y,r:type==='rovina'?15:17,
        cap,left:cap,fert:f,used:false,workers:0});
      placed++;
    }
  }

  // Covi di banditi e clan rivali
  const eraGar=(pw,r)=>{
    const u={};
    let left=pw;
    const pool=['lanciere','arciere','guerriero'];
    while(left>0){
      const t=pool[Math.floor(r()*pool.length)];
      u[t]=(u[t]||0)+1; left--;
    }
    return u;
  };
  for(let i=0;i<9;i++){
    let x,y,tries=0;
    do{ x=70+rnd()*(W-140); y=70+rnd()*(H-140); tries++ }
    while(tries<900&&(dist(x,y,G.camp.x,G.camp.y)<230||!far(x,y,G.camps,175)));
    const pw=4+Math.round(rnd()*6);
    G.camps.push({id:'c'+i,kind:'covo',x,y,r:20,u:eraGar(pw,rnd),razed:false,
      loot:{grano:Math.round(40+rnd()*90),legna:Math.round(30+rnd()*70),ferro:Math.round(20+rnd()*45)},
      regrow:0,aggr:.55+rnd()*.5});
  }
  for(let i=0;i<3;i++){
    let x,y,tries=0;
    do{ x=100+rnd()*(W-200); y=100+rnd()*(H-200); tries++ }
    while(tries<900&&(dist(x,y,G.camp.x,G.camp.y)<400||!far(x,y,G.camps,240)));
    const pw=12+Math.round(rnd()*8);
    G.camps.push({id:'k'+i,kind:'clan',x,y,r:26,u:eraGar(pw,rnd),razed:false,
      loot:{grano:Math.round(120+rnd()*140),legna:Math.round(90+rnd()*110),ferro:Math.round(70+rnd()*80)},
      regrow:0,aggr:.8+rnd()*.6,name:['Corvi Grigi','Figli del Guado','Orda di Vhar'][i]});
  }

  reveal(G,G.camp.x,G.camp.y,4.2);
  return G;
}

/** Nebbia di guerra: si scopre solo ciò che qualcuno ha visto davvero. */
function reveal(G,x,y,cells){
  const ci=x/CELL|0, cj=y/CELL|0, r=Math.ceil(cells);
  for(let j=cj-r;j<=cj+r;j++)for(let i=ci-r;i<=ci+r;i++){
    if(i<0||j<0||i>=GW||j>=GH)continue;
    if(Math.hypot(i-ci,j-cj)<=cells)G.seen[j*GW+i]=1;
  }
}
const isSeen=(G,x,y)=>{
  const i=clamp(x/CELL|0,0,GW-1), j=clamp(y/CELL|0,0,GH-1);
  return G.seen[j*GW+i]===1;
};

/* ═══════════════════════════════════════════════════════════════
   12 · SIMULAZIONE
   Un giorno di gioco = 1,4 s reali a velocità 1×. Tutto è
   continuo: produzione, fame, nascite, marce, battaglie.
   ═══════════════════════════════════════════════════════════════ */
const DAYMS=1400;
const COMBAT_K=.85;
const HARV_D=230;             // distanza a cui il trasporto rende la metà
const EAT=.35;                // grano al giorno per anima

const bandN=b=>{let s=0;for(const t in b.u)s+=b.u[t];return s};
const isPeasant=b=>{for(const t in b.u)if(b.u[t]>0&&t!=='contadino')return false;return true};
const bandSpd=(b,m)=>{
  let s=99;
  for(const t in b.u) if(b.u[t]>0) s=Math.min(s,UNIT[t].spd);
  return s*(m?m.march:1);
};
const RAID_ATK=.75;           // i banditi sono ciurmaglia, non soldati
function bandPow(u,foeU,m,scale){
  let p=0;
  for(const t in u){
    const n=u[t]; if(!n)continue;
    const U=UNIT[t];
    const mul=m?(U.cls==='arc'?m.atkArc:U.cls==='cav'?m.atkCav:m.atkMel):1;
    // Il bonus di contrasto pesa quanto la quota del bersaglio nell'esercito nemico
    let cm=1;
    if(U.vs&&foeU){
      let tot=0,hit=0;
      for(const k in foeU){tot+=foeU[k];if(U.vs[k])hit+=foeU[k]*U.vs[k]}
      if(tot>0)cm=(tot-Object.keys(U.vs).reduce((a,k)=>a+(foeU[k]||0),0)+hit)/tot;
    }
    p+=n*U.atk*mul*cm;
  }
  return p*(scale===undefined?1:scale);
}
function bandHpPool(u,m){
  let h=0;
  for(const t in u) h+=(u[t]||0)*UNIT[t].hp*(m?m.hp:1);
  return h;
}
/** Toglie `pts` punti di vita a una composizione: muore prima la prima linea. */
function applyLoss(u,pts,m){
  let dead=0;
  for(const t of UORD){
    if(pts<=0)break;
    let n=u[t]||0; if(!n)continue;
    const per=UNIT[t].hp*(m?m.hp:1);
    const kill=Math.min(n,pts/per);
    u[t]=n-kill; pts-=kill*per;
    dead+=kill;
    if(u[t]<1e-4)u[t]=0;
  }
  return dead;
}
/** Le perdite sono continue: dentro la simulazione un reparto può valere
    3,4 uomini. Arrotondare a ogni tick cancellerebbe l'attrito — si
    arrotonda solo quando si mostra il numero. Qui si toglie solo la polvere. */
const cleanU=u=>{const o={};for(const t in u)if(u[t]>.02)o[t]=u[t];return o};

function newBand(G,side,u,x,y,extra){
  const b={id:uid('b'),side,u,x,y,tx:null,ty:null,job:null,fight:0,...extra};
  G.bands.push(b); return b;
}
const myBands=G=>G.bands.filter(b=>b.side==='me'&&bandN(b)>=.4);
const foeBands=G=>G.bands.filter(b=>b.side==='foe'&&bandN(b)>=.4);

function popCount(G){
  let p=G.free;
  for(const b of myBands(G))p+=bandN(b);
  return p;
}
function popCap(G){return 18+G.blds.capanne*20}
function granaryCap(G){return 300+G.blds.granaio*260}
function armyPow(G){
  let p=0;
  for(const b of myBands(G))for(const t in b.u)
    if(t!=='contadino')p+=b.u[t]*(UNIT[t].atk*2+UNIT[t].hp);
  return p;
}
function campSpeed(G,m){return (34+G.blds.carri*4)*m.camp}
function cartCap(G,m){return Math.round((160+G.blds.carri*55)*m.cart)}

function feed(G,txt,cls){
  G.log.unshift({t:txt,c:cls||'',d:G.day});
  if(G.log.length>7)G.log.pop();
  renderFeed();
}

/* ── Costruzione ─────────────────────────────────────────────── */
/** L'addestramento della caserma è vigore in più su TUTTE le truppe. */
function syncTrain(G){G.mods.hp=G.baseHp*(1+.07*G.blds.caserma)}

function canPay(G,c){for(const r in c)if(G.stock[r]<c[r])return false;return true}
function pay(G,c){for(const r in c)G.stock[r]-=c[r]}
function build(k){
  const G=RUN; if(!G||G.over)return;
  if(G.camp.state!=='fermo'){toast('Il campo è in viaggio');return}
  const c=bldCost(k,G.blds[k]);
  if(!canPay(G,c)){toast('Materiali insufficienti');return}
  pay(G,c); G.blds[k]++; syncTrain(G);
  feed(G,BLD[k].ic+' <b>'+BLD[k].n+'</b> al livello '+G.blds[k],'good');
  renderSheet(); renderHud();
}

/* ── Fucina e caserma ────────────────────────────────────────── */
function recruit(type,qty){
  const G=RUN; if(!G||G.over)return;
  const rec=RECIPE[type];
  let max=Math.floor(G.free);
  for(const a in rec) max=Math.min(max,Math.floor(G.arms[a]/rec[a]));
  const n=Math.min(qty,max);
  if(n<1){toast('Servono contadini liberi e armi');return}
  for(const a in rec)G.arms[a]-=rec[a]*n;
  G.free-=n;
  const h=homeBand(G,false);
  h.u[type]=(h.u[type]||0)+n;
  feed(G,'⚔️ Arruolati <b>'+n+' '+(n>1?UNIT[type].pl:UNIT[type].n)+'</b>');
  renderSheet(); renderHud();
}
/** Banda "di casa": quella ferma all'accampamento. La crea se non c'è. */
function homeBand(G,peasant){
  const c=G.camp;
  let b=myBands(G).find(b=>!b.job&&b.tx===null&&dist(b.x,b.y,c.x,c.y)<26&&isPeasant(b)===!!peasant);
  if(!b)b=newBand(G,'me',peasant?{contadino:0}:{},c.x+(Math.random()-.5)*18,c.y+(Math.random()-.5)*18);
  return b;
}
function detach(n){
  const G=RUN; if(!G||G.over)return;
  n=Math.min(n,Math.floor(G.free));
  if(n<1){toast('Nessun contadino libero');return}
  G.free-=n;
  const b=homeBand(G,true);
  b.u.contadino=(b.u.contadino||0)+n;
  feed(G,'🧑‍🌾 <b>'+n+'</b> contadini pronti a partire');
  renderSheet(); renderHud(); select(b,true);
}
function recallAll(){
  const G=RUN; if(!G||G.over)return;
  for(const b of myBands(G))orderMove(b,G.camp.x,G.camp.y,null);
  feed(G,'📯 Richiamo generale');
  renderSheet();
}

/* ── Ordini ──────────────────────────────────────────────────── */
function orderMove(b,x,y,job){
  b.tx=clamp(x,10,W-10); b.ty=clamp(y,10,H-10); b.job=job||null;
  // Solo chi è stato mandato a casa rientra nel popolo: chi è appena
  // stato staccato resta una banda, in attesa di ordini.
  b.ret=!job&&RUN&&dist(b.tx,b.ty,RUN.camp.x,RUN.camp.y)<26;
}
function orderHarvest(b,node){
  if(!isPeasant(b)){toast('Solo i contadini raccolgono');return}
  if(node.type==='rovina'){orderMove(b,node.x,node.y,{k:'ruin',n:node.id});return}
  orderMove(b,node.x+(Math.random()-.5)*14,node.y+(Math.random()-.5)*14,{k:'harv',n:node.id});
}
function orderAttack(b,camp){
  orderMove(b,camp.x,camp.y,{k:'raid',c:camp.id});
}

/* ── Movimento del campo: il cuore del gioco ─────────────────── */
function startMigration(x,y){
  const G=RUN; if(!G||G.over)return;
  const c=G.camp;
  if(c.state!=='fermo'){toast('Il campo è già in movimento');return}
  const m=G.mods, cap=cartCap(G,m);
  let tot=G.stock.grano+G.stock.legna+G.stock.ferro;
  c.state='pack'; c.tx=clamp(x,30,W-30); c.ty=clamp(y,30,H-30); c.prog=0;
  const d=dist(c.x,c.y,c.tx,c.ty);
  feed(G,'🏕️ Si smonta il campo · '+Math.round(d)+' passi di marcia');
  if(tot>cap)feed(G,'⚠️ I carri portano solo '+nf(cap)+' di scorte: il resto va perduto','war');
  renderSheet(); renderHud();
}
function migrationStep(G,dt,m){
  const c=G.camp;
  if(c.state==='fermo')return;
  if(c.state==='pack'){
    c.prog+=dt;
    if(c.prog>=1){
      c.prog=0; c.state='move';
      // I carri hanno un limite: ciò che eccede resta a marcire sul posto
      const cap=cartCap(G,m);
      let tot=G.stock.grano+G.stock.legna+G.stock.ferro;
      if(tot>cap){
        const k=cap/tot;
        const lost=Math.round(tot-cap);
        for(const r in G.stock)G.stock[r]=Math.floor(G.stock[r]*k);
        feed(G,'📦 Abbandonati <b>'+nf(lost)+'</b> di scorte','war');
      }
      // Chi lavorava lontano molla il lavoro e segue il popolo
      for(const b of myBands(G))if(b.job&&b.job.k==='harv'){b.job=null;b.tx=c.tx;b.ty=c.ty}
    }
    return;
  }
  if(c.state==='move'){
    const sp=campSpeed(G,m)*dt;
    const d=dist(c.x,c.y,c.tx,c.ty);
    if(d<=sp){ c.x=c.tx; c.y=c.ty; c.state='unpack'; c.prog=0 }
    else { c.x+=(c.tx-c.x)/d*sp; c.y+=(c.ty-c.y)/d*sp }
    reveal(G,c.x,c.y,3.4*m.sight);
    return;
  }
  if(c.state==='unpack'){
    c.prog+=dt;
    if(c.prog>=1){
      c.state='fermo'; c.prog=0; G.migr++;
      reveal(G,c.x,c.y,4.2*m.sight);
      feed(G,'🏕️ <b>Nuovo accampamento</b> · terra al '+Math.round(fertAt(G,c.x,c.y)*100)+'% di fertilità','good');
    }
  }
}

/* ── Il tick: un frazione di giorno ──────────────────────────── */
function simTick(G,dt){
  const m=G.mods;
  migrationStep(G,dt,m);
  const moving=G.camp.state==='move'||G.camp.state==='pack';

  /* 1 · Marce e arrivi */
  for(const b of myBands(G)){
    if(b.tx===null)continue;
    const sp=bandSpd(b,m)*dt;
    const d=dist(b.x,b.y,b.tx,b.ty);
    if(d<=sp){
      b.x=b.tx; b.y=b.ty; b.tx=null; b.ty=null;
      if(b.job&&b.job.k==='ruin'){
        const nd=G.nodes.find(n=>n.id===b.job.n);
        if(nd&&!nd.used){
          nd.used=true; G.ruins++; G.sapere+=30;
          reveal(G,nd.x,nd.y,6);
          feed(G,'🏛️ <b>Rovina esplorata</b> · +30 sapere','good');
        }
        b.job=null;
      }
    } else { b.x+=(b.tx-b.x)/d*sp; b.y+=(b.ty-b.y)/d*sp }
    reveal(G,b.x,b.y,2.3*m.sight);
  }
  reveal(G,G.camp.x,G.camp.y,3.6*m.sight);

  /* 2 · Raccolta — la resa crolla con la distanza dal campo */
  for(const n of G.nodes)n.workers=0;
  for(const b of myBands(G)){
    if(!b.job||b.job.k!=='harv')continue;
    const nd=G.nodes.find(x=>x.id===b.job.n);
    if(!nd){b.job=null;continue}
    if(dist(b.x,b.y,nd.x,nd.y)>34)continue;
    if(nd.left<=.5){
      b.job=null;
      feed(G,NODE[nd.type].ic+' Risorsa <b>esaurita</b>','war');
      continue;
    }
    const w=b.u.contadino||0; if(!w)continue;
    nd.workers+=w;
    const eff=(1/(1+dist(nd.x,nd.y,G.camp.x,G.camp.y)/HARV_D))*(moving?.3:1);
    const km=nd.type==='campo'?m.farm*nd.fert*1.35:nd.type==='bosco'?m.wood:m.iron;
    let got=w*NODE[nd.type].rate*km*eff*dt;
    got=Math.min(got,nd.left);
    nd.left-=got;
    const r=NODE[nd.type].res;
    G.stock[r]+=got;
  }
  // I campi si riprendono, molto lentamente. Boschi e vene, mai.
  for(const n of G.nodes)
    if(n.type==='campo'&&n.left<n.cap)n.left=Math.min(n.cap,n.left+n.cap*.006*dt);
  if(G.stock.grano>granaryCap(G))G.stock.grano=granaryCap(G);

  /* 3 · Fucina */
  if(!moving){
    G.forgeP+=G.blds.fucina*.7*m.forge*dt;
    const A=ARMS[G.forgeSel];
    G.forgeStuck=false;
    while(G.forgeP>=1){
      if(A.era>G.era){G.forgeP=1;break}
      if(!canPay(G,A.c)){G.forgeP=1;G.forgeStuck=true;break}
      pay(G,A.c); G.arms[G.forgeSel]++; G.forgeP-=1;
    }
  }

  /* 4 · Sapere ed ere */
  if(!moving)G.sapere+=(.4+G.blds.tenda*1.2)*m.know*dt;
  while(G.era<5&&G.sapere>=ERAS[G.era].need){
    G.era++;
    feed(G,'📜 <b>'+ERAS[G.era-1].name+'</b> · '+ERAS[G.era-1].d,'good');
  }

  /* 5 · Fame e nascite */
  let eat=G.free*EAT;
  for(const b of myBands(G))for(const t in b.u)eat+=b.u[t]*EAT*UNIT[t].up;
  eat*=m.upkeep*dt;
  const pop=popCount(G);
  if(G.stock.grano>=eat){
    G.stock.grano-=eat;
    G.starve=Math.max(0,G.starve-dt*2);
    const cap=popCap(G);
    if(G.stock.grano>pop*1.4&&pop<cap){
      G.birthAcc+=pop*.09*m.birth*(1-pop/cap)*dt;
      while(G.birthAcc>=1){G.birthAcc-=1;G.free++;G.born++}
    }
  } else {
    G.stock.grano=0;
    G.starve+=dt;
    let deaths=pop*.07*dt;
    if(G.free>=deaths)G.free-=deaths;
    else{
      deaths-=G.free; G.free=0;
      for(const b of myBands(G)){
        if(deaths<=0)break;
        const n=bandN(b), k=Math.min(n,deaths);
        applyLoss(b.u,k*1.2,m); deaths-=k;
      }
    }
    G.lost+=1;
    if(G.starve>.6){G.starve=0;feed(G,'💀 <b>Carestia</b> · il popolo muore di fame','war')}
  }
  if(G.free<0)G.free=0;
  G.peak=Math.max(G.peak,popCount(G));

  /* 6 · Battaglie */
  battles(G,dt,m);

  /* 7 · Il mondo reagisce */
  worldAI(G,dt,m);

  /* 8 · Pulizia delle bande annientate */
  for(const b of G.bands){b.u=cleanU(b.u)}
  G.bands=G.bands.filter(b=>bandN(b)>=.4);

  /* 9 · Fusione automatica delle bande ferme sullo stesso punto */
  const mine=myBands(G);
  for(let i=0;i<mine.length;i++)for(let j=i+1;j<mine.length;j++){
    const a=mine[i],b=mine[j];
    if(!a.u||!b.u)continue;
    if(a.tx!==null||b.tx!==null)continue;
    if(a.job||b.job)continue;
    if(isPeasant(a)!==isPeasant(b))continue;
    if(dist(a.x,a.y,b.x,b.y)>16)continue;
    for(const t in b.u)a.u[t]=(a.u[t]||0)+b.u[t];
    b.u={};
    if(SEL===b.id)SEL=a.id;
  }
  G.bands=G.bands.filter(b=>bandN(b)>=.4);

  /* 10 · I contadini che tornano a casa rientrano nel popolo */
  for(const b of myBands(G)){
    if(isPeasant(b)&&b.ret&&!b.job&&b.tx===null&&dist(b.x,b.y,G.camp.x,G.camp.y)<20&&G.camp.state==='fermo'){
      G.free+=bandN(b); b.u={};
    }
  }
  G.bands=G.bands.filter(b=>bandN(b)>=.4);
}

/* ── Battaglie ───────────────────────────────────────────────── */
function battles(G,dt,m){
  for(const b of G.bands)b.fight=Math.max(0,(b.fight||0)-dt*3);

  /* a) Le mie bande contro i covi */
  for(const b of myBands(G)){
    if(!b.job||b.job.k!=='raid')continue;
    const C=G.camps.find(c=>c.id===b.job.c);
    if(!C||C.razed){b.job=null;continue}
    if(dist(b.x,b.y,C.x,C.y)>C.r+16)continue;
    b.fight=1; C.fight=1;
    const defBonus=C.kind==='clan'?1.25:1.12;      // combattono in casa
    const pMe=bandPow(b.u,C.u,m);
    const pFoe=bandPow(C.u,b.u,null)*defBonus;
    applyLoss(C.u,pMe*COMBAT_K*dt,null);
    applyLoss(b.u,pFoe*COMBAT_K*dt,m);
    C.u=cleanU(C.u);
    if(bandN({u:C.u})<.4){
      C.razed=true; G.conq++;
      const loot={};
      for(const r in C.loot){
        const q=Math.round(C.loot[r]*m.loot);
        G.stock[r]+=q; loot[r]=q;
      }
      G.sapere+=C.kind==='clan'?26:10;
      b.job=null;
      feed(G,'🔥 <b>'+(C.kind==='clan'?'Clan annientato':'Covo raso al suolo')+'</b> · +'+
        nf(loot.grano)+'🌾 +'+nf(loot.legna)+'🪵 +'+nf(loot.ferro)+'⛏️','good');
    }
    if(bandN(b)<.4)feed(G,'☠️ La spedizione è stata annientata','war');
  }

  /* b) Le incursioni contro di me */
  const camp=G.camp;
  for(const F of foeBands(G)){
    const near=myBands(G).filter(b=>dist(b.x,b.y,F.x,F.y)<34);
    const atCamp=dist(F.x,F.y,camp.x,camp.y)<36;
    if(!near.length&&!atCamp)continue;
    F.fight=1;
    let allU={};
    for(const b of near){for(const t in b.u)allU[t]=(allU[t]||0)+b.u[t]}
    if(atCamp)allU.contadino=(allU.contadino||0)+G.free;
    let pMe=0, pool=0;
    for(const b of near){pMe+=bandPow(b.u,F.u,m); pool+=bandHpPool(b.u,m); b.fight=1}
    let campPool=0;
    if(atCamp){
      // Chi resta al campo prende il forcone: poco, ma non zero.
      pMe+=G.blds.torre*11*m.hp+G.free*.34;
      campPool=G.free*1.0+G.blds.torre*5;
      pool+=campPool;
    }
    const pFoe=bandPow(F.u,allU,null,RAID_ATK);
    applyLoss(F.u,pMe*COMBAT_K*dt,null);
    let inc=pFoe*COMBAT_K*dt;
    if(pool>0){
      for(const b of near){
        const share=inc*(bandHpPool(b.u,m)/pool);
        applyLoss(b.u,share,m);
      }
      if(atCamp&&campPool>0){
        const share=inc*(campPool/pool);
        G.free=Math.max(0,G.free-share*.45);
      }
    }
    // Se non c'è più nessuno a difendere, saccheggiano
    if(atCamp&&pMe<bandN(F)*.25&&F.going!=='home'){
      let tot=0;
      for(const r in G.stock){
        const q=Math.min(G.stock[r],bandN(F)*2.2*dt);
        G.stock[r]-=q; tot+=q;
      }
      F.loot=(F.loot||0)+tot;
      F.stay=(F.stay||0)+dt;
      if(F.loot>45||F.stay>3){
        F.tx=F.hx; F.ty=F.hy; F.going='home';
        feed(G,'📦 I razziatori se ne vanno con <b>'+nf(F.loot)+'</b> di scorte','war');
      }
    }
    if(bandN(F)<.4)feed(G,'🛡️ <b>Incursione respinta</b>','good');
  }

  /* c) Movimento delle bande nemiche */
  for(const F of foeBands(G)){
    if(F.going!=='home'){F.tx=camp.x;F.ty=camp.y}
    if(F.tx===null)continue;
    const sp=bandSpd(F,null)*dt*.92;
    const d=dist(F.x,F.y,F.tx,F.ty);
    if(d<=sp){
      F.x=F.tx;F.y=F.ty;
      if(F.going==='home'){F.u={}}     // rientrano al covo e spariscono
    } else {F.x+=(F.tx-F.x)/d*sp; F.y+=(F.ty-F.y)/d*sp}
  }
}

/* ── Il mondo che vive ───────────────────────────────────────── */
function worldAI(G,dt,m){
  // Le guarnigioni dei covi si ricostituiscono
  for(const C of G.camps){
    if(C.razed)continue;
    C.regrow+=(C.kind==='clan'?.07:.035)*dt;
    while(C.regrow>=1){
      C.regrow-=1;
      const pool=G.day<20?['lanciere','arciere']:G.day<38?['lanciere','arciere','guerriero']
        :['lanciere','arciere','guerriero','cavaliere'];
      const t=pool[Math.floor(Math.random()*pool.length)];
      const tot=bandN({u:C.u});
      if(tot<(C.kind==='clan'?28:16))C.u[t]=(C.u[t]||0)+1;
    }
  }
  // Incursioni: cadenza che stringe, forza che cresce col tuo esercito
  if(G.day>=G.nextRaid){
    const live=G.camps.filter(c=>!c.razed);
    if(live.length){
      live.sort((a,b)=>dist(a.x,a.y,G.camp.x,G.camp.y)-dist(b.x,b.y,G.camp.x,G.camp.y));
      const C=live[Math.floor(Math.random()*Math.min(3,live.length))];
      let pw=2.5+G.day*.20+G.conq*1.4;
      pw=Math.max(pw,armyPow(G)*.16);
      pw=Math.min(pw,40)*C.aggr;
      const u={};
      const pool=G.day<16?['lanciere','arciere']:G.day<34?['lanciere','arciere','guerriero']
        :['lanciere','arciere','guerriero','cavaliere'];
      let left=Math.max(2,Math.round(pw));
      while(left>0){const t=pool[Math.floor(Math.random()*pool.length)];u[t]=(u[t]||0)+1;left--}
      const F=newBand(G,'foe',u,C.x,C.y,{hx:C.x,hy:C.y,going:'raid',loot:0});
      F.tx=G.camp.x; F.ty=G.camp.y;
      const d=dist(C.x,C.y,G.camp.x,G.camp.y);
      feed(G,'⚠️ <b>'+Math.round(bandN(F))+' razziatori</b> in marcia · '+
        Math.round(d/(bandSpd(F,null)*.92))+' giorni','war');
    }
    G.nextRaid=G.day+Math.max(5,11-G.day*.07);
  }
}

/* ── Punteggio ───────────────────────────────────────────────── */
function scoreOf(G){
  const pop=popCount(G);
  const st=G.stock.grano/12+G.stock.legna/10+G.stock.ferro/7;
  return Math.round(pop*12+armyPow(G)*7+st+G.conq*230+G.sapere*1.5+(G.era-1)*90);
}
function scoreParts(G){
  return [
    ['Popolo',            Math.round(popCount(G)*12)],
    ['Esercito',          Math.round(armyPow(G)*7)],
    ['Scorte',            Math.round(G.stock.grano/12+G.stock.legna/10+G.stock.ferro/7)],
    ['Covi rasi al suolo',Math.round(G.conq*230)],
    ['Sapere',            Math.round(G.sapere*1.5)],
    ['Era raggiunta',     Math.round((G.era-1)*90)]
  ];
}

/* ═══════════════════════════════════════════════════════════════
   13 · DISEGNO DELLA MAPPA
   ═══════════════════════════════════════════════════════════════ */
let RUN=null, SEL=null, PLACE=null, MODE='prova';
let cv,ctx,cw,ch,DPR=1;
const CAM={x:0,y:0,z:1.15};
let MM={x:0,y:0,s:0};        // rettangolo della minimappa

function fitCanvas(){
  cv=$('#cv'); ctx=cv.getContext('2d');
  DPR=Math.min(2,window.devicePixelRatio||1);
  cw=cv.clientWidth; ch=cv.clientHeight;
  cv.width=cw*DPR; cv.height=ch*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const mid=cw>=720, wide=cw>=1080;
  MM.s=Math.min(wide?168:mid?124:96, cw*.26, ch*.34);
  // Stessa formula di rientro dei chip dell'HUD: l'angolo si raccoglie
  // verso il centro invece di finire agli antipodi su un monitor.
  MM.x=cw-MM.s-Math.max(mid?16:10,(cw-1100)/2);
  MM.y=ch-MM.s-(mid?96:66);
}
const s2w=(sx,sy)=>({x:(sx-cw/2)/CAM.z+CAM.x, y:(sy-ch/2)/CAM.z+CAM.y});
const w2s=(wx,wy)=>({x:(wx-CAM.x)*CAM.z+cw/2, y:(wy-CAM.y)*CAM.z+ch/2});

function cellColor(f,seen){
  if(!seen)return '#0a0906';
  const h=38+f*60, l=10+f*11, s=16+f*16;
  return 'hsl('+h.toFixed(0)+','+s.toFixed(0)+'%,'+l.toFixed(0)+'%)';
}

function draw(){
  const G=RUN; if(!G)return;
  ctx.clearRect(0,0,cw,ch);
  ctx.fillStyle='#080705'; ctx.fillRect(0,0,cw,ch);

  const tl=s2w(0,0), br=s2w(cw,ch);
  const i0=clamp(tl.x/CELL-1|0,0,GW-1), i1=clamp(br.x/CELL+1|0,0,GW-1);
  const j0=clamp(tl.y/CELL-1|0,0,GH-1), j1=clamp(br.y/CELL+1|0,0,GH-1);
  const cs=CELL*CAM.z+1;

  /* Terreno */
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const p=w2s(i*CELL,j*CELL);
    ctx.fillStyle=cellColor(G.fert[j*GW+i],G.seen[j*GW+i]);
    ctx.fillRect(p.x,p.y,cs,cs);
  }

  const m=G.mods;
  const bn=skinCol(m);

  /* Risorse */
  for(const n of G.nodes){
    if(!isSeen(G,n.x,n.y))continue;
    const p=w2s(n.x,n.y), r=n.r*CAM.z;
    const frac=n.cap?n.left/n.cap:1;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7);
    ctx.fillStyle=n.type==='rovina'?(n.used?'#231d33':'#2e2544')
      :n.type==='campo'?'#3d4a1e':n.type==='bosco'?'#1f3a22':'#3a3630';
    ctx.fill();
    if(n.type!=='rovina'){
      ctx.beginPath(); ctx.arc(p.x,p.y,r+2.5,-1.57,-1.57+6.283*clamp(frac,0,1));
      ctx.strokeStyle=frac>.5?'#7cc45f':frac>.2?'#e0a44a':'#e0574a';
      ctx.lineWidth=2.2; ctx.stroke();
    }
    ctx.font=(r*1.15|0)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(NODE[n.type].ic,p.x,p.y+1);
    if(n.workers>0){
      ctx.fillStyle='#f2ece0'; ctx.font='bold '+(9*Math.min(1.4,CAM.z))+'px sans-serif';
      ctx.fillText('🧑‍🌾'+Math.round(n.workers),p.x,p.y-r-7);
    }
  }

  /* Covi e clan */
  for(const C of G.camps){
    if(!isSeen(G,C.x,C.y))continue;
    const p=w2s(C.x,C.y), r=C.r*CAM.z;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7);
    ctx.fillStyle=C.razed?'#231a17':C.kind==='clan'?'#4a1d2a':'#3a201a';
    ctx.fill();
    ctx.strokeStyle=C.razed?'#3a2f28':'#e0574a'; ctx.lineWidth=1.6; ctx.stroke();
    ctx.font=(r*1.1|0)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(C.razed?'🔥':C.kind==='clan'?'🏰':'⛺',p.x,p.y+1);
    if(!C.razed){
      const n=Math.round(bandN({u:C.u}));
      ctx.fillStyle='#ffb0a6'; ctx.font='bold '+(10*Math.min(1.4,CAM.z))+'px sans-serif';
      ctx.fillText('⚔'+n,p.x,p.y-r-7);
    }
  }

  /* Accampamento */
  const c=G.camp;
  if(c.state==='move'||c.state==='pack'){
    const a=w2s(c.x,c.y), b=w2s(c.tx,c.ty);
    ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(224,164,74,.55)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]);
  }
  {
    const p=w2s(c.x,c.y), r=26*CAM.z;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7);
    ctx.fillStyle=bn.col2; ctx.fill();
    ctx.strokeStyle=bn.col; ctx.lineWidth=2.4; ctx.stroke();
    // Raggio di trasporto conveniente
    ctx.beginPath(); ctx.arc(p.x,p.y,HARV_D*CAM.z,0,7);
    ctx.strokeStyle='rgba(224,164,74,.14)'; ctx.lineWidth=1.2; ctx.setLineDash([4,7]);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.font=(r*1.05|0)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.state==='fermo'?'🏕️':'🐎',p.x,p.y+1);
    ctx.fillStyle=bn.col; ctx.font='bold '+(10*Math.min(1.4,CAM.z))+'px sans-serif';
    ctx.fillText('🧑‍🌾'+Math.round(G.free),p.x,p.y-r-8);
  }

  /* Bande */
  for(const b of G.bands){
    const n=bandN(b); if(n<.5)continue;
    if(b.side==='foe'&&!isSeen(G,b.x,b.y))continue;
    const p=w2s(b.x,b.y);
    if(b.tx!==null&&b.side==='me'){
      const q=w2s(b.tx,b.ty);
      ctx.strokeStyle='rgba(242,236,224,.20)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
    }
    let top=null,tn=0;
    for(const t in b.u)if(b.u[t]>tn){tn=b.u[t];top=t}
    if(!top)continue;
    const r=(12+Math.min(9,Math.sqrt(n)*2.4))*CAM.z;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7);
    ctx.fillStyle=b.side==='me'?bn.col2:'#4a1a16';
    ctx.fill();
    ctx.strokeStyle=b.fight>.1?'#ff6a55':(b.side==='me'?bn.col:'#e0574a');
    ctx.lineWidth=b.id===SEL?3:1.7; ctx.stroke();
    ctx.font=(r*1.05|0)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(UNIT[top].ic,p.x,p.y+1);
    ctx.fillStyle=b.side==='me'?'#f2ece0':'#ffb0a6';
    ctx.font='bold '+(10*Math.min(1.4,CAM.z))+'px sans-serif';
    ctx.fillText(Math.round(n)+'',p.x,p.y-r-7);
    if(b.id===SEL){
      ctx.beginPath(); ctx.arc(p.x,p.y,r+6,0,7);
      ctx.strokeStyle='rgba(224,164,74,.75)'; ctx.lineWidth=2; ctx.stroke();
    }
    if(b.fight>.1){
      ctx.font=(13*CAM.z|0)+'px serif';
      ctx.fillText('💥',p.x+r*.8,p.y-r*.8);
    }
  }

  /* Cursore di spostamento del campo */
  if(PLACE==='camp'){
    ctx.fillStyle='rgba(224,164,74,.10)'; ctx.fillRect(0,0,cw,ch);
  }

  drawMinimap(G,bn);
}

function drawMinimap(G,bn){
  const {x,y,s}=MM, k=s/W;
  ctx.fillStyle='rgba(10,9,6,.9)'; ctx.fillRect(x-2,y-2,s+4,s+4);
  ctx.strokeStyle='#2b241b'; ctx.lineWidth=1; ctx.strokeRect(x-2,y-2,s+4,s+4);
  const cs=s/GW;
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    if(!G.seen[j*GW+i])continue;
    ctx.fillStyle=cellColor(G.fert[j*GW+i],1);
    ctx.fillRect(x+i*cs,y+j*cs,cs+.6,cs+.6);
  }
  for(const C of G.camps){
    if(C.razed||!isSeen(G,C.x,C.y))continue;
    ctx.fillStyle='#e0574a'; ctx.fillRect(x+C.x*k-1.5,y+C.y*k-1.5,3,3);
  }
  for(const b of G.bands){
    if(bandN(b)<.5)continue;
    if(b.side==='foe'&&!isSeen(G,b.x,b.y))continue;
    ctx.fillStyle=b.side==='me'?bn.col:'#ff6a55';
    ctx.fillRect(x+b.x*k-1,y+b.y*k-1,2,2);
  }
  ctx.fillStyle=bn.col; ctx.fillRect(x+G.camp.x*k-2.5,y+G.camp.y*k-2.5,5,5);
  // riquadro della vista
  const tl=s2w(0,0), br=s2w(cw,ch);
  ctx.strokeStyle='rgba(242,236,224,.45)'; ctx.lineWidth=1;
  ctx.strokeRect(x+clamp(tl.x,0,W)*k,y+clamp(tl.y,0,H)*k,
    (clamp(br.x,0,W)-clamp(tl.x,0,W))*k,(clamp(br.y,0,H)-clamp(tl.y,0,H))*k);
}

/* ═══════════════════════════════════════════════════════════════
   14 · CONTROLLI
   Un dito trascina la mappa, un tocco dà l'ordine. Due dita
   zoomano. Aprire un pannello mette in pausa: su mobile devi
   poter pensare senza che il mondo ti passi addosso.
   ═══════════════════════════════════════════════════════════════ */
let PTR=new Map(), DRAG=null, PINCH=null;

function bindInput(){
  const el=$('#cv');
  el.addEventListener('pointerdown',e=>{
    el.setPointerCapture(e.pointerId);
    el.classList.add('drag');
    PTR.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:now(),moved:0});
    if(PTR.size===2){
      const [a,b]=[...PTR.values()];
      PINCH={d:Math.hypot(a.x-b.x,a.y-b.y),z:CAM.z};
    }
  });
  el.addEventListener('pointermove',e=>{
    const p=PTR.get(e.pointerId); if(!p)return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    p.moved+=Math.hypot(dx,dy); p.x=e.clientX; p.y=e.clientY;
    if(PTR.size===2&&PINCH){
      const [a,b]=[...PTR.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      CAM.z=clamp(PINCH.z*(d/PINCH.d),.55,2.6);
      return;
    }
    if(PTR.size===1){
      CAM.x-=dx/CAM.z; CAM.y-=dy/CAM.z;
      clampCam();
    }
  });
  const up=e=>{
    const p=PTR.get(e.pointerId);
    PTR.delete(e.pointerId);
    if(PTR.size<2)PINCH=null;
    if(!PTR.size)el.classList.remove('drag');
    if(!p)return;
    if(p.moved<9&&now()-p.t<420)tap(p.x0,p.y0,e);
  };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',e=>{PTR.delete(e.pointerId);PINCH=null;if(!PTR.size)el.classList.remove('drag')});
  el.addEventListener('wheel',e=>{
    e.preventDefault();
    CAM.z=clamp(CAM.z*(e.deltaY>0?.9:1.11),.55,2.6);
  },{passive:false});

  /* Tastiera: l'equivalente da computer, senza togliere nulla al dito */
  window.addEventListener('keydown',e=>{
    const t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    // Le scorciatoie del browser (zoom, salva, cambio scheda) restano del browser
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const k=e.key, modal=$('#modal').classList.contains('on');
    const inGame=$('#game').classList.contains('on');
    if(k==='Escape'){
      if(modal)closeModal();
      else if(SHEET)closeSheet();
      else if(PLACE||SEL){SEL=null;PLACE=null;updateSel()}
      return;
    }
    if(modal)return;
    if($('#res').classList.contains('on'))return;
    if(!inGame){
      if(k>='1'&&k<='5'){const b=$$('.tab')[+k-1];if(b)b.click()}
      return;
    }
    const ae=document.activeElement;
    if(k===' '||k==='Spacebar'){
      if(ae&&ae.tagName==='BUTTON')return;
      e.preventDefault(); setSpeed(); return;
    }
    if(k>='1'&&k<='5'){const b=$$('.gb')[+k-1];if(b)b.click();return}
    if(k==='+'||k==='='){e.preventDefault();CAM.z=clamp(CAM.z*1.11,.55,2.6);return}
    if(k==='-'||k==='_'){e.preventDefault();CAM.z=clamp(CAM.z*.9,.55,2.6);return}
    const st=40/CAM.z; let dx=0,dy=0;
    if(k==='ArrowLeft'||k==='a'||k==='A')dx=-st;
    else if(k==='ArrowRight'||k==='d'||k==='D')dx=st;
    else if(k==='ArrowUp'||k==='w'||k==='W')dy=-st;
    else if(k==='ArrowDown'||k==='s'||k==='S')dy=st;
    if(dx||dy){e.preventDefault();CAM.x+=dx;CAM.y+=dy;clampCam()}
  });
}
function clampCam(){
  CAM.x=clamp(CAM.x,-200,W+200); CAM.y=clamp(CAM.y,-200,H+200);
}
function centerOn(x,y){CAM.x=x;CAM.y=y;clampCam()}

function tap(sx,sy,ev){
  const G=RUN; if(!G||G.over)return;
  const r=cv.getBoundingClientRect();
  sx-=r.left; sy-=r.top;

  // Minimappa: salto immediato di visuale
  if(sx>=MM.x-4&&sx<=MM.x+MM.s+4&&sy>=MM.y-4&&sy<=MM.y+MM.s+4){
    centerOn((sx-MM.x)/MM.s*W,(sy-MM.y)/MM.s*H);
    return;
  }
  const w=s2w(sx,sy);

  if(PLACE==='camp'){
    PLACE=null; $('#gsel').classList.remove('on');
    startMigration(w.x,w.y); updateSel();
    return;
  }

  // 1 · Una mia banda — toccarla la sceglie, non le dà mai un ordine
  let hit=null,hd=1e9;
  for(const b of myBands(G)){
    const d=dist(w.x,w.y,b.x,b.y);
    if(d<Math.max(26,34/CAM.z)&&d<hd){hd=d;hit=b}
  }
  if(hit){if(hit.id!==SEL)select(hit);return}

  const sel=SEL?G.bands.find(b=>b.id===SEL):null;

  // 2 · Un covo
  for(const C of G.camps){
    if(!isSeen(G,C.x,C.y))continue;
    if(dist(w.x,w.y,C.x,C.y)<Math.max(28,36/CAM.z)){
      if(C.razed){toast('Covo già raso al suolo');return}
      if(!sel){toast('Scegli prima una banda');return}
      if(isPeasant(sel)){toast('I contadini non assaltano i covi');return}
      orderAttack(sel,C);
      feed(G,'🗡️ Assalto a '+(C.kind==='clan'?(C.name||'un clan'):'un covo'));
      return;
    }
  }
  // 3 · Una risorsa
  for(const n of G.nodes){
    if(!isSeen(G,n.x,n.y))continue;
    if(dist(w.x,w.y,n.x,n.y)<Math.max(24,32/CAM.z)){
      if(!sel){toast('Scegli prima una banda');return}
      if(n.type==='rovina'){
        if(n.used){toast('Rovina già esplorata');return}
        orderMove(sel,n.x,n.y,{k:'ruin',n:n.id});
        toast('In marcia verso la rovina'); updateSel(); return;
      }
      if(!isPeasant(sel)){toast('Solo i contadini raccolgono');return}
      if(n.left<=.5){toast('Risorsa esaurita');return}
      orderHarvest(sel,n); updateSel(); return;
    }
  }
  // 4 · L'accampamento
  if(dist(w.x,w.y,G.camp.x,G.camp.y)<Math.max(30,38/CAM.z)){
    if(sel){orderMove(sel,G.camp.x,G.camp.y,null);toast('Rientro all\'accampamento');updateSel()}
    else openSheet('campo');
    return;
  }
  // 5 · Terra libera
  if(sel){orderMove(sel,w.x,w.y,null);updateSel()}
  else{SEL=null;updateSel()}
}

function select(b,center){
  SEL=b?b.id:null;
  if(b&&center)centerOn(b.x,b.y);
  updateSel();
}
function updateSel(){
  const G=RUN;
  if(cv)cv.classList.toggle('place',PLACE==='camp');
  const b=G&&SEL?G.bands.find(x=>x.id===SEL):null;
  const box=$('#gsel');
  if(PLACE==='camp'){
    box.classList.add('on');
    $('#selT').textContent='Dove portiamo il popolo?';
    $('#selH').textContent='Tocca la mappa. Servono 1 giorno per smontare, la marcia, e 1 per rimontare.';
    return;
  }
  if(!b){box.classList.remove('on');return}
  box.classList.add('on');
  const parts=[];
  for(const t of UORD)if(b.u[t]>=.5)parts.push(Math.round(b.u[t])+' '+(b.u[t]>1.5?UNIT[t].pl:UNIT[t].n));
  $('#selT').textContent=parts.join(' · ')||'—';
  let h='Tocca una risorsa, un covo o la terra per dare l\'ordine';
  if(b.job&&b.job.k==='harv'){
    const n=G.nodes.find(x=>x.id===b.job.n);
    if(n)h='Raccoglie '+NODE[n.type].n.toLowerCase()+' · resa '+
      Math.round(100/(1+dist(n.x,n.y,G.camp.x,G.camp.y)/HARV_D))+'% per la distanza';
  }
  else if(b.job&&b.job.k==='raid')h='In marcia verso il covo';
  else if(b.job&&b.job.k==='ruin')h='In marcia verso la rovina';
  else if(b.tx!==null)h='In marcia';
  $('#selH').textContent=h;
}

/* ═══════════════════════════════════════════════════════════════
   15 · CICLO DI GIOCO
   ═══════════════════════════════════════════════════════════════ */
let RAF=null, LAST=0;
const SPEEDS=[1,2,4];

function startRun(mode){
  MODE=mode;
  const M=MODES[mode];
  const chk=canPlay(mode);
  if(!chk.ok){toast(chk.why);return}

  // Pagamento della quota: entra nel montepremi, non sparisce
  let ticket=false;
  if(M.tk){DB.tickets.left-=M.tk;ticket=true;save()}
  else if(M.cur==='REG'&&M.fee>0){
    post('entry_fee',mode,[[ACC.pSnk,-M.fee],[ACC.prize,M.fee]]);
    post('entry_fee_opponents',mode,[[ACC.opp,-M.fee*(CLANS-1)],[ACC.prize,M.fee*(CLANS-1)]]);
    DB.stats.spent+=M.fee; save();
  }

  const seed=(Math.random()*4294967296)>>>0;
  RUN=genWorld(seed,mode);
  RUN.mods=loadoutMods(isRanked(mode)?'ranked':'casual');
  RUN.baseHp=RUN.mods.hp; syncTrain(RUN);
  RUN.ticket=ticket;
  RUN.mmr0=DB.player.mmr;
  SEL=null; PLACE=null;
  CAM.z=1.15; centerOn(RUN.camp.x,RUN.camp.y);
  $('#game').classList.add('on');
  $('#res').classList.remove('on');
  closeSheet();
  fitCanvas();
  CAM.z=clamp(1.15*(Math.min(cw,ch)/700),1.15,2.4);
  feed(RUN,'🏕️ Il popolo si accampa · '+M.days+' giorni per farsi un regno');
  LAST=performance.now();
  if(RAF)cancelAnimationFrame(RAF);
  RAF=requestAnimationFrame(loop);
  renderHud(); renderFeed(); updateSel();
  setTimeout(()=>{if(RUN&&!RUN.over)openSheet('popolo')},650);
}

function loop(ts){
  RAF=requestAnimationFrame(loop);
  const G=RUN; if(!G)return;
  let el=Math.min(80,ts-LAST); LAST=ts;
  const paused=$('#sheet').classList.contains('on')||$('#modal').classList.contains('on');
  if(!G.over&&!paused){
    const step=el/DAYMS*(G.speedV||1);
    // Passi piccoli: la simulazione resta stabile anche a 4×
    let left=step;
    while(left>1e-4){
      const d=Math.min(.06,left);
      simTick(G,d); G.t+=d; left-=d;
      const nd=Math.floor(G.t)+1;
      if(nd!==G.day){G.day=nd;onNewDay(G)}
      if(G.t>=G.days){endRun();break}
    }
    renderHud();
  }
  draw();
}

function onNewDay(G){
  if(G.day===Math.round(G.days*.5))feed(G,'⏳ Metà del tempo è passata');
  if(G.day===G.days-9)feed(G,'⏳ <b>Nove giorni</b> alla fine','war');
}

function setSpeed(){
  const G=RUN; if(!G)return;
  const i=SPEEDS.indexOf(G.speedV||1);
  G.speedV=SPEEDS[(i+1)%SPEEDS.length];
  $('#hSpd').textContent=G.speedV+'×';
}

function renderHud(){
  const G=RUN; if(!G)return;
  $('#hDay').textContent=G.day+'/'+G.days;
  $('#hGrano').textContent=nf(G.stock.grano);
  $('#hLegna').textContent=nf(G.stock.legna);
  $('#hFerro').textContent=nf(G.stock.ferro);
  $('#hPop').textContent=Math.round(popCount(G))+'/'+popCap(G);
  $('#cGrano').classList.toggle('warn',G.stock.grano<12);
  $('#hSpd').textContent=(G.speedV||1)+'×';
  $('#gbar').querySelector('[data-s="caserma"]').classList
    .toggle('alert',G.free>=1&&Object.keys(RECIPE).some(t=>{
      const r=RECIPE[t];
      return Object.keys(r).every(a=>G.arms[a]>=r[a]&&ARMS[a].era<=G.era);
    }));
  // Braccia ferme: è il richiamo più importante della schermata
  const idle=myBands(G).some(b=>!b.job&&b.tx===null&&isPeasant(b))||G.free>=4;
  $('#gbar').querySelector('[data-s="popolo"]').classList.toggle('alert',idle);
}
function renderFeed(){
  const G=RUN; if(!G)return;
  $('#gfeed').innerHTML=G.log.map(l=>'<div class="fev '+l.c+'">'+l.t+'</div>').join('');
}

/* ═══════════════════════════════════════════════════════════════
   16 · PANNELLI DI COMANDO
   Mentre un pannello è aperto il tempo si ferma: su un telefono
   devi poter decidere senza che il mondo ti passi addosso.
   ═══════════════════════════════════════════════════════════════ */
let SHEET=null;
function openSheet(k){SHEET=k;renderSheet();$('#sheet').classList.add('on');syncDock()}
function closeSheet(){SHEET=null;$('#sheet').classList.remove('on');syncDock()}

const resLine=c=>Object.keys(c).map(r=>
  (r==='grano'?'🌾':r==='legna'?'🪵':'⛏️')+c[r]).join(' ');

function renderSheet(){
  const G=RUN; if(!G||!SHEET)return;
  const m=G.mods;
  let h='';

  if(SHEET==='popolo'){
    const bands=myBands(G);
    h+=head('Il popolo');
    h+=`<div class="card flat">
      <div class="kv"><span>Anime</span><b>${Math.round(popCount(G))} / ${popCap(G)}</b></div>
      <div class="kv"><span>Contadini liberi al campo</span><b>${Math.round(G.free)}</b></div>
      <div class="kv"><span>Nati · perduti</span><b>${G.born} · ${Math.round(G.lost)}</b></div>
      <div class="muted" style="margin-top:6px">Le anime crescono solo se c'è grano in scorta e capanne libere.</div>
    </div>`;
    h+=`<h3>Stacca contadini</h3>
    <div class="row" style="gap:6px">
      ${[1,5,10].map(n=>`<button class="btn g sm grow" onclick="__app.detach(${n})">+${n}</button>`).join('')}
      <button class="btn g sm grow" onclick="__app.detach(999)">Tutti</button>
    </div>
    <div class="muted" style="margin-top:6px">Poi tocca un campo, un bosco o una vena sulla mappa: andranno a raccogliere.</div>`;
    h+=`<h3>Bande sul campo · ${bands.length}</h3>`;
    if(!bands.length)h+=`<div class="empty">Nessuno fuori dall'accampamento.</div>`;
    for(const b of bands){
      const parts=UORD.filter(t=>b.u[t]>=.5).map(t=>UNIT[t].ic+Math.round(b.u[t])).join(' ');
      let job='Ferma';
      if(b.job&&b.job.k==='harv'){
        const n=G.nodes.find(x=>x.id===b.job.n);
        job=n?'Raccoglie '+NODE[n.type].n.toLowerCase()+' · resa '+
          Math.round(100/(1+dist(n.x,n.y,G.camp.x,G.camp.y)/HARV_D))+'%':'Raccoglie';
      }
      else if(b.job&&b.job.k==='raid')job='Assalta un covo';
      else if(b.job&&b.job.k==='ruin')job='Verso una rovina';
      else if(b.tx!==null)job='In marcia';
      h+=`<div class="unit ${b.id===SEL?'sel':''}">
        <div class="u">${isPeasant(b)?'🧑‍🌾':'⚔️'}</div>
        <div class="grow"><div class="n">${parts}</div><div class="d">${job}</div></div>
        <button class="btn g xs" onclick="__app.pick('${b.id}')">Scegli</button>
        <button class="btn g xs" onclick="__app.home('${b.id}')">Rientro</button>
      </div>`;
    }
    if(bands.length)h+=`<button class="btn g wide sm" style="margin-top:6px" onclick="__app.recall()">📯 Richiamo generale</button>`;
  }

  if(SHEET==='campo'){
    const c=G.camp, f=fertAt(G,c.x,c.y);
    h+=head('L\'accampamento');
    const stato=c.state==='fermo'?'Fermo':c.state==='pack'?'Si smonta ('+Math.round(c.prog*100)+'%)'
      :c.state==='move'?'In marcia · '+Math.round(dist(c.x,c.y,c.tx,c.ty))+' passi'
      :'Si rimonta ('+Math.round(c.prog*100)+'%)';
    h+=`<div class="card flat">
      <div class="kv"><span>Stato</span><b>${stato}</b></div>
      <div class="kv"><span>Fertilità sotto il campo</span><b>${Math.round(f*100)}%</b></div>
      <div class="kv"><span>Carico dei carri</span><b>${nf(G.stock.grano+G.stock.legna+G.stock.ferro)} / ${nf(cartCap(G,m))}</b></div>

/* ═══════════════════════════════════════════════════════════════
   17 · CHIUSURA E SETTLEMENT
   Il montepremi si azzera esattamente: premi + rake + residuo
   bruciato. Nessun token nasce dal nulla.
   ═══════════════════════════════════════════════════════════════ */
function hashWorld(G){
  let s=G.seed+'|';
  for(const n of G.nodes)s+=n.type[0]+(n.x|0)+','+(n.y|0)+';';
  for(const c of G.camps)s+=c.kind[0]+(c.x|0)+','+(c.y|0)+';';
  return fnv(s);
}

/** Gli altri sette clan: stesso seme, stessa terra, bravura diversa. */
function ghosts(G,myScore){
  const r=mulberry32(G.seed^0x9e3779b9);
  const tier={prova:-420,libera:-220,t1:0,t2:230,t3:500}[G.mode]||0;
  const mu=1150+(DB.player.mmr-1000)*1.05+tier;
  const out=[];
  const NAMES=['Clan del Guado','Figli di Brann','Erranti di Kel','Popolo del Sale',
    'Orda Bianca','Gente di Mora','Stirpe di Torv','Nomadi del Vento','Casa Ferrara'];
  const used=new Set();
  for(let i=0;i<CLANS-1;i++){
    // Somma di tre uniformi ≈ normale: distribuzione credibile senza librerie
    const z=(r()+r()+r()-1.5)*1.9;
    const sc=Math.max(240,Math.round(mu+z*460));
    let nm; do{nm=NAMES[Math.floor(r()*NAMES.length)]}while(used.has(nm));
    used.add(nm);
    out.push({name:nm,score:sc,conq:clamp(Math.round((sc-620)/620),0,MAX_CONQ)});
  }
  return out;
}

function endRun(){
  const G=RUN; if(!G||G.over)return;
  G.over=true;
  settle();
}
function giveUp(){
  const G=RUN; if(!G||G.over)return;
  openModal(`<h2>Terminare adesso?</h2>
    <div class="sub">La spedizione viene chiusa al giorno ${G.day} di ${G.days} e il punteggio è quello attuale. La quota non torna indietro.</div>
    <button class="btn dan wide" onclick="__app.confirmGiveUp()">Sì, si torna a casa</button>
    <button class="btn g wide" style="margin-top:8px" onclick="__app.closeModal()">No, continuo</button>`);
}

function settle(){
  const G=RUN;
  // Idempotenza (§11.1): una spedizione si liquida UNA volta sola.
  if(!G||G.settled)return;
  G.settled=true; G.over=true;
  closeSheet();

  const myScore=scoreOf(G);
  const gs=ghosts(G,myScore);
  const board=[...gs.map(g=>({...g,me:false})),
    {name:'Il tuo popolo',score:myScore,conq:Math.min(G.conq,MAX_CONQ),me:true}]
    .sort((a,b)=>b.score-a.score);
  const place=board.findIndex(x=>x.me)+1;
  const M0=MODES[MODE], lm=G.mods, dim=diminish();

  const base=computePayout(MODE,place,G.conq,null);
  const eco=computePayout(MODE,place,G.conq,lm);
  const baseMine=Math.round((base.place+base.conq)*dim);
  const ecoMine=Math.round((eco.place+eco.conq)*dim);
  const bonus=Math.max(0,ecoMine-baseMine);
  let mine=baseMine+bonus, coinPay=0, burnRes=0;

  if(M0.cur==='COINS'){
    mine=0;
    coinPay=eco.place+eco.conq;
    post('run_reward_coins',MODE,[[ACC.emis,-coinPay],[ACC.pCoin,coinPay]]);
  } else {
    const pool=M0.fee*CLANS, rake=Math.round(pool*M0.rake), distrib=pool-rake;
    let others=0;
    for(let i=0;i<board.length;i++){
      if(board[i].me)continue;
      const q=computePayout(MODE,i+1,board[i].conq,null);
      others+=q.place+q.conq;
    }
    // I covi che nessuno ha raso al suolo lasciano una quota senza destinatario:
    // si brucia, non si redistribuisce (§5.2).
    burnRes=Math.max(0,distrib-baseMine-others);

    const bRake=Math.round(rake*.4), res=Math.round(rake*.3),
          ops=Math.round(rake*.2), cre=rake-bRake-res-ops;
    const moves=[
      [ACC.prize,-pool],
      [ACC.pSnk,baseMine+bonus],[ACC.opp,others],
      [ACC.burn,bRake+burnRes],[ACC.resv,res-bonus],[ACC.ops,ops],[ACC.crea,cre]
    ];
    const sum=moves.reduce((a,x)=>a+x[1],0);
    if(Math.abs(sum)>1e-6)moves.push([ACC.burn,-sum]);   // arrotondamenti → burn
    post('run_settle',MODE,moves);

    DB.eco.burned+=bRake+burnRes; DB.eco.sunk+=rake+burnRes;
    DB.eco.weekSink+=rake+burnRes; DB.eco.rakeTot+=rake;
    DB.stats.earned+=mine;
  }

  // Progressione
  const xp=Math.round(30+G.conq*40+(CLANS+1-place)*18+(place===1?110:0)+G.era*12);
  const ups=addXp(xp);
  DB.player.mmr=clamp(Math.round(DB.player.mmr+(4.5-place)*8*(isRanked(MODE)?1:.3)),600,2400);

  DB.stats.played++; DB.stats.conq+=G.conq; DB.stats.migr+=G.migr;
  if(place===1)DB.stats.wins++;
  if(place<=3)DB.stats.top3++;
  DB.stats.bestPop=Math.max(DB.stats.bestPop,Math.round(G.peak));
  DB.stats.era=Math.max(DB.stats.era,G.era);
  DB.risk.count++;

  questProgress({played:1,conq:G.conq,wins:place===1?1:0,top3:place<=3?1:0,
    pop90:G.peak>=90?1:0,era3:G.era>=3?1:0,migr:G.migr,ranked:isRanked(MODE)?1:0});
  checkAch();

  // Durabilità: si consuma solo in Esodo
  if(isRanked(MODE))for(const id of lm.used){
    const n=nftById(id);
    if(n&&n.dur!==null)n.dur=Math.max(0,n.dur-1);
  }

  const rep={id:uid('rep'),seed:G.seed,mode:MODE,days:G.days,lasted:G.day,
    score:myScore,hash:hashWorld(G),at:now()};
  DB.replays.unshift(rep); if(DB.replays.length>12)DB.replays.pop();
  DB.runs.unshift({at:now(),mode:MODE,place,score:myScore,conq:G.conq,
    pop:Math.round(popCount(G)),era:G.era,
    net:M0.cur==='COINS'?0:mine-(G.ticket?0:M0.fee),xp,rep:rep.id});
  if(DB.runs.length>40)DB.runs.pop();

  if(!ledgerOk())console.error('LEDGER SBILANCIATO');
  save();

  showResult({board,place,myScore,eco,mine,coinPay,burnRes,dim,xp,ups,M0,rep,G});
  $('#game').classList.remove('on');
  renderAll();
}

/** Ricostruisce il mondo dal seme e confronta l'impronta: la stessa
    verifica che il server farebbe su un risultato contestato. */
function verify(id){
  const r=DB.replays.find(x=>x.id===id); if(!r)return;
  const el=$('#vres'); el.textContent='Ricostruzione del mondo dal seme…';
  setTimeout(()=>{
    const G2=genWorld(r.seed,r.mode);
    const h=hashWorld(G2);
    el.innerHTML=h===r.hash
      ?'<span style="color:var(--grn)">✓ Impronta identica ('+h+') — la terra era la stessa per tutti gli otto clan.</span>'
      :'<span style="color:var(--dan)">✗ Impronta diversa: '+h+' ≠ '+r.hash+'</span>';
  },260);
}

function hLeft(t){
  const d=t-now();
  if(d<=0)return 'scaduta';
  const hh=Math.floor(d/36e5), mm=Math.floor(d/6e4)%60;
  return hh?hh+'h '+mm+'m':mm+'m';
}

      <div class="row">${[50,500,5000].map(v=>`<button class="btn g sm grow" onclick="__app.wd(${v})">${nf(v)} ◈</button>`).join('')}</div>
      <div class="muted" style="margin-top:8px">Sotto 100 ◈ istantaneo · fino a 1.000 coda di 1 ora · fino a 10.000 coda di 24 ore · oltre, revisione manuale.</div>
      <h3>Stake</h3>
      <div class="row">
        <button class="btn g sm grow" onclick="__app.stake(2000)">Metti 2.000 ◈</button>
        <button class="btn g sm grow" onclick="__app.unstake()">Ritira</button>
      </div>
      <div class="muted" style="margin-top:8px">Lo stake è il requisito per l'Esodo T3: alza il costo di creare identità usa e getta.</div>
    `:''}`;
  openModal(`<h2>Wallet</h2>`+
    (p.addr?`<div class="mcols"><div>${wLeft}</div><div>${wRight}</div></div>`:wLeft),
    {wide:!!p.addr});
}

function renderAll(){renderTop();renderPlay();renderInv();renderMkt();renderSeason();renderEco()}

/* ═══════════════════════════════════════════════════════════════
   19 · CONTROLLORE DI LAYOUT — unica sorgente di verità
   Le @media del foglio di stile e queste classi usano le STESSE
   soglie (720 / 1080 / landscape<=520): non possono divergere.
   .lay-side non è una soglia di larghezza ma di rapporto d'aspetto:
   dove la finestra è più larga che alta c'è posto per agganciare il
   pannello di comando a destra invece di coprirci la mappa.
   ═══════════════════════════════════════════════════════════════ */
const MQ={
  t   :matchMedia('(min-width:720px)'),
  d   :matchMedia('(min-width:1080px)'),
  land:matchMedia('(orientation:landscape) and (max-height:520px)'),
  side:matchMedia('(min-aspect-ratio:13/10)'),
  fine:matchMedia('(hover:hover) and (pointer:fine)')
};
let LAY='';
function applyLayout(){
  const c=document.body.classList;
  const d=MQ.d.matches, t=MQ.t.matches&&!d;
  c.toggle('lay-d',d);
  c.toggle('lay-t',t);
  c.toggle('lay-land',MQ.land.matches);
  c.toggle('lay-side',MQ.side.matches);
  c.toggle('lay-fine',MQ.fine.matches);
  const n=(d?'D':t?'T':'M')+(MQ.land.matches?'L':'')+(MQ.side.matches?'S':'');
  const changed=n!==LAY; LAY=n;
  return changed;
}

/* Il pannello di comando è un foglio dal basso in verticale e una
   colonna agganciata a destra dove c'è larghezza. La classe .dock sul
   body è ciò che dice alla tela di stringersi di quel tanto: senza,
   metà mappa resterebbe sotto il pannello e la telecamera inquadrerebbe
   un centro che il giocatore non vede. */
function syncDock(){
  const on=document.body.classList.contains('lay-side')&&$('#sheet').classList.contains('on');
  const had=document.body.classList.contains('dock');
  document.body.classList.toggle('dock',on);
  if(on!==had&&$('#game').classList.contains('on')){fitCanvas();if(RUN)draw()}
}

/* Un solo punto d'ingresso per QUALSIASI cambio di viewport: la tela si
   rimisura subito (altrimenti resta della misura vecchia finché non si
   muove qualcosa), il resto aspetta 90ms per non far partire una raffica
   di ricotture mentre si trascina il bordo della finestra. */
let vpT=0;
function onViewportChange(){
  const changed=applyLayout();
  if(changed)syncDock();
  const inGame=$('#game').classList.contains('on');
  if(inGame){fitCanvas();if(RUN)draw()}
  clearTimeout(vpT);
  vpT=setTimeout(()=>{
    if($('#game').classList.contains('on')){fitCanvas();if(RUN)draw()}
    if(SHEET)renderSheet();
  },90);
}

/* ═══════════════════════════════════════════════════════════════
   20 · ROUTER E AVVIO
   ═══════════════════════════════════════════════════════════════ */
function boot(){
  DB=load();
  if(!DB){
    DB=fresh();
    post('genesis_coins',null,[[ACC.emis,-2500],[ACC.pCoin,2500]]);
    post('airdrop',null,[[ACC.resv,-320],[ACC.pSnk,320]]);
    DB.eco.minted+=320;
    const s=mint('st_verde','genesis');
    DB.loadout.ranked.skin=s.id; DB.loadout.casual.skin=s.id;
    save();
  }
  refreshQuests(); ticketsLeft(); tickMarket();

  $$('.tab').forEach(b=>b.onclick=()=>{
    $$('.tab').forEach(x=>x.classList.toggle('on',x===b));
    $$('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));
  });
  $('#wbtn').onclick=()=>{DB.player.addr?openWallet():connectWallet()};
  $('#mx').addEventListener('click',closeModal);
  /* La chiusura sullo sfondo vale solo se ANCHE la pressione è partita
     dallo sfondo: col mouse, selezionare il prezzo dentro il campo #sp
     e rilasciare fuori dal riquadro chiudeva la modale per sbaglio. */
  let mDownBg=false;
  $('#modal').addEventListener('pointerdown',e=>{mDownBg=(e.target.id==='modal')});
  $('#modal').addEventListener('click',e=>{
    if(e.target.id==='modal'&&mDownBg)closeModal();
    mDownBg=false;
  });
  $('#gspeed').onclick=setSpeed;
  $('#selX').onclick=()=>{SEL=null;PLACE=null;updateSel()};
  $$('.gb').forEach(b=>b.onclick=()=>{
    if(SHEET===b.dataset.s)closeSheet(); else openSheet(b.dataset.s);
  });
  applyLayout();
  window.addEventListener('resize',onViewportChange);
  window.addEventListener('orientationchange',()=>setTimeout(onViewportChange,240));
  if(window.visualViewport)visualViewport.addEventListener('resize',onViewportChange);
  for(const k in MQ)MQ[k].addEventListener('change',onViewportChange);

  fitCanvas(); bindInput(); renderAll();
  setInterval(()=>{tickMarket();renderMkt();renderTop()},45e3);
}

window.__app={
  start:startRun, again:()=>{$('#res').classList.remove('on');startRun(MODE)},
  toHub:()=>{$('#res').classList.remove('on');RUN=null;if(RAF)cancelAnimationFrame(RAF);RAF=null},
  verify, giveUp, confirmGiveUp:()=>{closeModal();settle()},
  detach, recruit, build, recall:recallAll, closeSheet,
  forge:k=>{if(RUN){RUN.forgeSel=k;RUN.forgeP=Math.min(RUN.forgeP,.999);renderSheet()}},
  moveCamp:()=>{closeSheet();PLACE='camp';SEL=null;updateSel();toast('Tocca il punto dove portare il popolo')},
  pick:id=>{const b=RUN.bands.find(x=>x.id===id);if(b){closeSheet();select(b,true)}},
  home:id=>{const b=RUN.bands.find(x=>x.id===id);if(b){b.job=null;orderMove(b,RUN.camp.x,RUN.camp.y);renderSheet()}},
  nft:openNft, sell:openSell, listing:openListing, closeModal,
  equip:(m,id)=>{equip(m,id);closeModal()},
  repair:id=>{repair(id);closeModal()},
  craft, buy:buyListing, cancel:cancelListing,
  bid:lid=>{const l=DB.market.listings.find(x=>x.id===lid);if(l)placeBid(lid,Math.ceil(l.bid*1.05)+1)},
  doList:(id,kind)=>{
    const v=parseInt($('#sp').value,10);
    if(!v||v<1){toast('Prezzo non valido');return}
    listNft(id,v,kind,kind==='auction'?6:72); closeModal();
  },
  invTab:t=>{INVTAB=t;renderInv()}, mktTab:t=>{MKTTAB=t;renderMkt()},
  buyTicket, conv:convertToCoins, buyBP, bp:bpClaim, quest:claimQuest,
  connect:connectWallet, dep:deposit, wd:requestWithdraw,
  stake:v=>{
    if(v>snk()){toast('$REG insufficienti');return}
    post('stake',null,[[ACC.pSnk,-v],[ACC.treas,v]]);
    DB.player.stake+=v; save(); openWallet(); renderTop(); toast('Stake attivo');
  },
  unstake:()=>{
    const v=DB.player.stake; if(!v){toast('Nessuno stake');return}
    post('unstake',null,[[ACC.treas,-v],[ACC.pSnk,v]]);
    DB.player.stake=0; save(); openWallet(); renderTop(); toast('Stake ritirato');
  }
};

boot();
})();
</script>
