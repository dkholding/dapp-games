<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Regno Errante</title>
<style>
:root{
  --bg:#0c0a07; --bg2:#12100b; --panel:#181410; --panel2:#1f1a14; --line:#2b241b;
  --txt:#f2ece0; --dim:#a5947c; --dim2:#6f6152;
  --ac:#e0a44a; --gold:#f5d060; --dan:#e0574a; --pur:#b98cf0; --blu:#6cb8e8; --grn:#7cc45f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-variant-numeric:tabular-nums;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* ── Header ─────────────────────────────────────── */
#top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;
  background:var(--bg2);border-bottom:1px solid var(--line);z-index:5}
.bal{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:700}
.bal i{font-style:normal;font-size:13px}
.bal.snk{color:var(--ac)} .bal.coin{color:var(--gold)}
#wbtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:6px 11px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px}
#wbtn.on{color:var(--ac);border-color:rgba(224,164,74,.45)}
#wbtn .dot{width:6px;height:6px;border-radius:50%;background:var(--dim2)}
#wbtn.on .dot{background:var(--ac);box-shadow:0 0 8px var(--ac)}

/* ── Corpo ──────────────────────────────────────── */
#body{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:14px 12px 18px;display:none;
  -webkit-overflow-scrolling:touch}
.page.on{display:block}

/* ── Tab bar ────────────────────────────────────── */
#tabs{flex:none;display:flex;background:var(--bg2);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;padding:9px 2px 8px;text-align:center;color:var(--dim2);font-size:9.5px;font-weight:600;
  letter-spacing:.2px;transition:color .15s}
.tab b{display:block;font-size:19px;font-weight:400;margin-bottom:2px;line-height:1}
.tab.on{color:var(--ac)}

/* ── Tipografia ─────────────────────────────────── */
h2{margin:0 0 3px;font-size:20px;font-weight:700;letter-spacing:-.3px}
h3{margin:20px 0 9px;font-size:12px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:.7px}
h3:first-child{margin-top:0}
.sub{margin:0 0 14px;color:var(--dim);font-size:12.5px;line-height:1.55}
.muted{color:var(--dim);font-size:11.5px;line-height:1.5}

/* ── Componenti ─────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
.card.flat{background:var(--bg2)}
.row{display:flex;align-items:center;gap:10px}
.row+.row{margin-top:9px}
.grow{flex:1;min-width:0}
.btn{background:var(--ac);color:#241601;border-radius:10px;padding:11px 18px;font-size:14px;
  font-weight:700;text-align:center;transition:transform .07s,opacity .15s}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.38}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:8px}
.btn.xs{padding:5px 9px;font-size:11px;border-radius:7px}
.btn.g{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2d2200}
.btn.dan{background:rgba(224,87,74,.15);color:var(--dan);border:1px solid rgba(224,87,74,.35)}
.btn.wide{width:100%}
.pill{display:inline-block;padding:2.5px 8px;border-radius:999px;font-size:9.5px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase}
.bar{height:6px;background:#0a0806;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px}
.kv span{color:var(--dim)}
.kv b{font-weight:600}
.empty{text-align:center;color:var(--dim2);font-size:12.5px;padding:26px 10px;line-height:1.6}
.pos{color:var(--grn)} .neg{color:var(--dan)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--txt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ── NFT ────────────────────────────────────────── */
.nft{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;position:relative;overflow:hidden}
.nft .ico{font-size:26px;line-height:1;margin-bottom:7px}
.nft .nm{font-size:12.5px;font-weight:700;line-height:1.25;margin-bottom:3px}
.nft .rr{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.nft.eq{border-color:rgba(224,164,74,.5);box-shadow:0 0 0 1px rgba(224,164,74,.2) inset}
.nft.brk{opacity:.5}
.dur{height:3px;background:#0a0806;border-radius:99px;margin-top:7px;overflow:hidden}
.dur>i{display:block;height:100%;background:var(--grn)}
.dur>i.lo{background:var(--dan)}

/* ── Modale ─────────────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;z-index:60}
#modal.on{display:flex}
#mbox{width:100%;max-height:88%;overflow-y:auto;background:var(--bg2);border-top-left-radius:20px;
  border-top-right-radius:20px;padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.mgrab{width:36px;height:4px;background:var(--line);border-radius:99px;margin:4px auto 12px}

/* ── Gioco ──────────────────────────────────────── */
#game{position:fixed;inset:0;display:none;background:#0a0906;z-index:40;touch-action:none}
#game.on{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ghud{position:absolute;inset:0;pointer-events:none;user-select:none}
#gtop{position:absolute;top:calc(6px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.gchip{background:rgba(18,15,11,.86);border:1px solid var(--line);border-radius:8px;padding:4px 8px;
  font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;backdrop-filter:blur(6px)}
.gchip small{color:var(--dim2);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.gchip.warn{color:var(--dan);border-color:rgba(224,87,74,.5)}
#gspeed{pointer-events:auto;margin-left:auto}
#gfeed{position:absolute;top:calc(62px + env(safe-area-inset-top));right:8px;width:56%;max-width:240px;
  display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fev{background:rgba(18,15,11,.82);border:1px solid var(--line);border-radius:7px;padding:3px 7px;
  font-size:10.5px;color:var(--dim);animation:fin .3s;max-width:100%;text-align:right;line-height:1.35}
.fev b{color:var(--txt);font-weight:700}
.fev.war{color:#ffb0a6;border-color:rgba(224,87,74,.4)}
.fev.good{color:#bfe8a8;border-color:rgba(124,196,95,.35)}
@keyframes fin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
#gsel{position:absolute;left:8px;right:8px;bottom:calc(112px + env(safe-area-inset-bottom));
  pointer-events:auto;display:none}
#gsel.on{display:block}
.selbox{background:rgba(18,15,11,.92);border:1px solid rgba(224,164,74,.45);border-radius:11px;
  padding:8px 10px;display:flex;align-items:center;gap:9px;backdrop-filter:blur(6px)}
.selbox .t{font-size:12.5px;font-weight:700}
.selbox .h{font-size:10.5px;color:var(--dim);margin-top:1px;line-height:1.3}
#gbar{position:absolute;left:0;right:0;bottom:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(10,9,6,.92) 22%);pointer-events:auto;display:flex;gap:6px}
.gb{flex:1;background:rgba(24,20,16,.94);border:1px solid var(--line);border-radius:11px;padding:7px 2px 6px;
  text-align:center;font-size:9px;font-weight:700;color:var(--dim);letter-spacing:.2px}
.gb b{display:block;font-size:18px;font-weight:400;line-height:1.05;margin-bottom:2px}
.gb.alert{border-color:rgba(224,164,74,.6);color:var(--ac)}
.gb:active{background:var(--panel2)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow-y:auto;background:var(--bg2);
  border-top:1px solid var(--line);border-top-left-radius:18px;border-top-right-radius:18px;
  padding:8px 12px calc(14px + env(safe-area-inset-bottom));pointer-events:auto;display:none;
  animation:up .2s cubic-bezier(.2,.9,.3,1);z-index:3;user-select:none}
#sheet.on{display:block}
.shead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.shead h4{margin:0;font-size:15px;font-weight:700;flex:1}
.xbtn{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  font-size:14px;color:var(--dim);line-height:1}
.unit{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-bottom:6px}
.unit .u{font-size:20px;line-height:1;width:24px;text-align:center;flex:none}
.unit .n{font-size:12.5px;font-weight:700}
.unit .d{font-size:10.5px;color:var(--dim);margin-top:1px;line-height:1.35}
.unit.sel{border-color:rgba(224,164,74,.55)}
.cost{font-size:10.5px;color:var(--dim);font-weight:600}
.cost.no{color:var(--dan)}

/* ── Risultato ──────────────────────────────────── */
#res{position:fixed;inset:0;background:rgba(6,5,3,.95);display:none;z-index:70;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
#res.on{display:block}
.rwrap{max-width:440px;margin:0 auto}
.rplace{text-align:center;font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1;margin:6px 0 2px}
.rsub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:18px}
.lbrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px}
.lbrow.me{background:rgba(224,164,74,.11);border:1px solid rgba(224,164,74,.32)}
.lbrow .p{width:20px;font-weight:800;color:var(--dim)}
.lbrow .s{margin-left:auto;font-weight:700}

/* ── Mercato ────────────────────────────────────── */
.lst{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px;margin-bottom:8px}
.lst .ico{font-size:24px;width:30px;text-align:center}
.lst .nm{font-size:12.5px;font-weight:700}
.lst .mt{font-size:10.5px;color:var(--dim);margin-top:2px}
.lst .pr{margin-left:auto;text-align:right}
.lst .pr b{display:block;font-size:13.5px;color:var(--ac)}

/* ── Tabella economia ───────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--dim2);font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(78px + env(safe-area-inset-bottom));
  background:#2a2118;border:1px solid var(--line);color:var(--txt);padding:9px 15px;border-radius:11px;
  font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:.24s;z-index:90;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE — telefono (base) · tablet ≥720 · computer ≥1080
   La baseline sopra è il telefono e non va toccata.
   ═══════════════════════════════════════════════════════════════ */
:root{--col:660px;--gut:12px}
.brand{display:none}

/* Il mouse merita una barra di scorrimento e uno stato hover */
@media (pointer:fine){
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;
    border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim2)}
  ::-webkit-scrollbar-track{background:transparent}
}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){filter:brightness(1.09)}
  .tab:hover{color:var(--txt)}
  .nft:hover,.lst:hover,.unit:hover{border-color:var(--dim2)}
  .xbtn:hover{color:var(--txt)}
}

/* ── TABLET ─────────────────────────────────────── */
@media (min-width:720px){
  :root{--gut:20px}
  #top{padding-left:max(var(--gut),calc((100% - var(--col))/2));
       padding-right:max(var(--gut),calc((100% - var(--col))/2))}
  .page{padding:22px max(var(--gut),calc((100% - var(--col))/2)) 32px}
  h2{font-size:23px}
  .sub{font-size:13.5px}
  .card{padding:15px;border-radius:15px;margin-bottom:12px}
  .grid2{grid-template-columns:repeat(3,1fr)}
  .grid3{grid-template-columns:repeat(4,1fr)}
  #tabs{justify-content:center;gap:8px}
  .tab{flex:0 1 148px;font-size:11px;padding:11px 4px 10px}
  .tab b{font-size:21px}
  /* La modale diventa un dialogo centrato, non un foglio che sale */
  #modal{align-items:center}
  #mbox{max-width:540px;border-radius:20px;max-height:84vh;
        padding:18px 20px 22px;animation:fadein .18s ease-out}
  .mgrab{display:none}
  .rwrap{max-width:540px}
  .toast{bottom:calc(94px + env(safe-area-inset-bottom))}
}
@keyframes fadein{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* ── COMPUTER ───────────────────────────────────── */
@media (min-width:1080px){
  :root{--col:720px}
  #app{flex-direction:row}
  #main{flex:1;min-width:0}
  #tabs{order:-1;flex:none;width:224px;flex-direction:column;justify-content:flex-start;
        gap:4px;border-top:none;border-right:1px solid var(--line);
        padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
  .tab{flex:none;display:flex;align-items:center;gap:12px;text-align:left;
       padding:11px 13px;border-radius:11px;font-size:13.5px;letter-spacing:0}
  .tab b{font-size:20px;margin:0;line-height:1;display:block}
  .tab.on{background:var(--panel)}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 13px 18px;
         font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--txt)}
  .brand b{font-size:20px;color:var(--ac);font-weight:400}
  .toast{bottom:30px}
}

/* ── Telefono coricato ──────────────────────────── */
@media (max-height:520px) and (orientation:landscape) and (max-width:1079px){
  #top{padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:5px}
  .tab{padding:5px 2px 4px;font-size:9px}
  .tab b{font-size:15px;margin-bottom:0}
  .page{padding-top:12px}
}

/* ═══════════════════════════════════════════════════════════════
   HUD DI GIOCO — specifico di Regno Errante
   La tela resta a tutto schermo: è l'interfaccia sopra che si
   raccoglie verso il centro, così non finisce agli antipodi.
   ═══════════════════════════════════════════════════════════════ */
@media (hover:hover) and (pointer:fine){
  #cv{cursor:grab}
  #cv.drag{cursor:grabbing}
  #cv.place{cursor:crosshair}
  .gb,.gchip,#gspeed,.xbtn,.tab{cursor:pointer}
  .gb:hover{border-color:var(--dim2);color:var(--txt)}
  #gspeed:hover{border-color:var(--dim2)}
}

/* ── HUD · tablet ───────────────────────────────── */
@media (min-width:720px){
  #gtop{left:max(14px,calc((100% - 900px)/2));right:max(14px,calc((100% - 900px)/2))}
  #gfeed{right:max(14px,calc((100% - 900px)/2));width:260px;max-width:260px}
  #gbar{left:50%;right:auto;transform:translateX(-50%);
    width:min(640px,calc(100% - 24px));bottom:calc(14px + env(safe-area-inset-bottom));
    padding:8px;background:rgba(10,9,6,.9);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(6px)}
  .gb{font-size:11px;padding:9px 4px 8px}
  .gb b{font-size:22px}
  #gsel{left:50%;right:auto;transform:translateX(-50%);
    width:min(640px,calc(100% - 24px));bottom:calc(106px + env(safe-area-inset-bottom))}
  #sheet{left:0;right:0;margin-inline:auto;width:min(560px,100%);
    max-height:70%;bottom:calc(96px + env(safe-area-inset-bottom));
    border:1px solid var(--line);border-radius:18px;
    padding:8px 14px 16px}
  #game.on ~ .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}

/* ── HUD · computer ─────────────────────────────── */
@media (min-width:1080px){
  #gtop{left:max(14px,calc((100% - 1100px)/2));right:max(14px,calc((100% - 1100px)/2))}
  #gfeed{right:max(14px,calc((100% - 1100px)/2));width:280px;max-width:280px}
  .fev{font-size:11.5px;padding:4px 9px}
  #game.on ~ .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}

/* Telefono coricato: la barra torna a piena larghezza (altrimenti
   restano attive le voci da 148px della regola tablet) */
@media (max-height:520px) and (orientation:landscape) and (max-width:1079px){
  #tabs{justify-content:stretch;gap:0}
  .tab{flex:1}
  .toast{bottom:calc(58px + env(safe-area-inset-bottom))}
}

/* Fuoco da tastiera (invisibile al tocco: :focus-visible non scatta) */
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--ac);outline-offset:2px;border-radius:9px}
#cv:focus,#cv:focus-visible{outline:none}

/* ═══════════════════════════════════════════════════════════════
   RIFINITURA — seconda passata
   Tutto ciò che segue vive dentro una @media oppure dietro una
   classe lay-* messa dal JS: il telefono in verticale non cambia.
   ═══════════════════════════════════════════════════════════════ */

/* ── Chiusura visibile della modale ─────────────── */
#mbox{position:relative}
#mx{display:none;position:absolute;top:10px;right:10px;width:32px;height:32px;
  border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  font-size:15px;line-height:1;align-items:center;justify-content:center;z-index:2}
@media (min-width:720px){#mx{display:flex} #mbox h2{padding-right:38px}}
@media (hover:hover) and (pointer:fine){#mx:hover{color:var(--txt);border-color:var(--dim2)}}

/* ── Modale larga su richiesta (#mbox.wide) ─────── */
@media (min-width:1080px){
  #mbox.wide{max-width:880px}
  #mbox.wide .mcols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
  #mbox.wide .mcols>div>h3:first-child{margin-top:0}
}

/* ── Barra di scorrimento anche nei contenitori scuri ─ */
@media (pointer:fine){
  #mbox::-webkit-scrollbar-thumb,#sheet::-webkit-scrollbar-thumb{border-color:var(--bg2)}
  #mbox,#res,.page,#sheet{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
}

/* ── Aree di tocco: mai sotto ~40px quando si tocca col dito ── */
@media (pointer:coarse){
  .btn.sm{min-height:40px;padding:9px 14px}
  .seg button{min-height:40px}
  .gb{min-height:44px}
  .gchip,#gspeed{min-height:32px}
  .selbox .btn{min-height:36px}
  .xbtn{width:32px;height:32px}
}
@media (pointer:coarse) and (max-height:460px) and (orientation:landscape){
  .gb{min-height:36px;padding:6px 2px 5px}
}

/* ── Il mouse deve dire cosa è cliccabile ───────── */
@media (pointer:fine){
  .nft,.lst,.seg button{cursor:pointer}
}

/* ── Controlli e stati vuoti che non devono stirarsi ── */
@media (min-width:720px){
  .seg{max-width:430px}
  .seg button{padding:9px 8px;font-size:12.5px}

/* ═══════════════════════════════════════════════════════════════
   IL PANNELLO DI COMANDO AGGANCIATO  (body.lay-side)
   #sheet è la vera interfaccia di comando: in verticale è giusto
   che salga dal basso, ma dove la finestra è più larga che alta
   coprire metà mappa non ha senso. Diventa una colonna a destra e
   la mappa si STRINGE di quel tanto (body.dock) invece di finirci
   sotto: la telecamera resta centrata su ciò che si vede davvero.
   La condizione è il rapporto d'aspetto, non una larghezza: vale
   identica sul telefono coricato e sul monitor, con le sole
   metriche diverse fra .lay-land e .lay-d.
   ═══════════════════════════════════════════════════════════════ */
body.lay-side #game{--dock-w:clamp(260px,27vw,340px)}
body.lay-side.lay-land #game{--dock-w:clamp(190px,32vw,260px)}
body.lay-side.lay-d #game{--dock-w:clamp(320px,24vw,400px)}

/* Sulla tela serve una LARGHEZZA esplicita, non width:auto con un right:
   il canvas ha una dimensione intrinseca (gli attributi width/height del
   bitmap), quindi con width:auto la userebbe e il right verrebbe ignorato. */
body.lay-side.dock #cv{width:calc(100% - var(--dock-w))}
body.lay-side.dock #ghud{right:var(--dock-w)}

body.lay-side #sheet{left:auto;right:0;top:0;bottom:0;margin-inline:0;
  width:var(--dock-w);max-height:none;border:none;border-left:1px solid var(--line);
  border-radius:0;padding:calc(8px + env(safe-area-inset-top)) 13px
  calc(14px + env(safe-area-inset-bottom));animation:dockin .2s cubic-bezier(.2,.9,.3,1)}
@keyframes dockin{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
body.lay-side #sheet .shead{position:sticky;top:0;z-index:2;background:var(--bg2);
  margin:0 0 10px;padding:6px 0 8px}
body.lay-side #sheet .unit{flex-wrap:wrap;padding:8px 9px;gap:8px}

  calc(8px + env(safe-area-inset-bottom))}

/* ═══════════════════════════════════════════════════════════════
   3 · LEDGER A PARTITA DOPPIA          ← identico agli altri titoli
   Ogni movimento di valore è una transazione le cui scritture
   sommano a ZERO. Se non quadra, l'operazione viene rifiutata.
   ═══════════════════════════════════════════════════════════════ */
const ACC={
  pSnk:'player:REG', pCoin:'player:COINS',
  prize:'sys:prize', burn:'sys:burn', treas:'sys:treasury', ops:'sys:ops',
  crea:'sys:creators', resv:'sys:seasonReserve', emis:'sys:emission',
  opp:'sys:opponents', ext:'sys:external', mkt:'sys:market',
  coinSink:'sys:coinsink'
};

function bal(a){return DB.accounts[a]||0}

function post(type,ref,moves){
  let s=0;
  for(const m of moves) s+=m[1];
  if(Math.abs(s)>1e-6) throw new Error('Transazione sbilanciata: '+type+' → '+s.toFixed(6));
  const tx={id:'tx_'+(++DB.seq),type,ref:ref||null,at:now()};
  DB.txs.push(tx);
  if(DB.txs.length>400) DB.txs.splice(0,DB.txs.length-400);
  for(const [a,v] of moves){
    DB.accounts[a]=(DB.accounts[a]||0)+v;
    DB.entries.push({t:tx.id,a,v});
  }
  if(DB.entries.length>2500) DB.entries.splice(0,DB.entries.length-2500);
  if(DB.accounts[ACC.pSnk]<-1e-6) throw new Error('Saldo $REG negativo');
  return tx;
}

function ledgerOk(){
  let s=0; for(const k in DB.accounts) s+=DB.accounts[k];
  return Math.abs(s)<1e-6;
}

const snk=()=>bal(ACC.pSnk), coins=()=>bal(ACC.pCoin);

/* ═══════════════════════════════════════════════════════════════
   4 · WALLET  (TON Connect simulato)  ← identico agli altri titoli
   ═══════════════════════════════════════════════════════════════ */
function connectWallet(){
  if(DB.player.addr){openWallet();return}
  const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
  let a='EQ';for(let i=0;i<46;i++)a+=c[Math.floor(Math.random()*c.length)];
  DB.player.addr=a; save(); renderTop();
  toast('Wallet collegato — ora puoi prelevare');
  openWallet();
}

function requestWithdraw(amt){
  if(amt<=0||amt>snk()){toast('Importo non valido');return}
  let delay,label;
  if(amt<100){delay=0;label='istantaneo'}
  else if(amt<1000){delay=36e5;label='coda 1 ora'}
  else if(amt<10000){delay=DAY;label='coda 24 ore'}
  else{delay=DAY;label='revisione manuale + KYC'}
  const risk=riskScore();
  post('withdrawal_lock','w',[[ACC.pSnk,-amt],[ACC.ext,amt]]);
  DB.withdrawals.push({id:uid('w'),amt,at:now(),ready:now()+delay,label,risk,
    st:risk>70?'revisione':'in coda'});
  save(); toast('Prelievo di '+nf(amt)+' $REG — '+label);
  openWallet();
}

function deposit(amt){
  post('deposit','d',[[ACC.ext,-amt],[ACC.pSnk,amt]]);
  DB.deposits.push({id:uid('d'),amt,at:now()});
  save(); renderTop(); toast('Depositati '+nf(amt)+' $REG');
}

/* ═══════════════════════════════════════════════════════════════
   5 · NFT ENGINE                       ← identico agli altri titoli
   ═══════════════════════════════════════════════════════════════ */
function mint(defId,src){
  const d=DEFS[defId];
  const n={id:uid('nft'),def:defId,cat:d.cat,rar:d.rar,
    dur:d.dur?d.dur:null,durMax:d.dur||null,
    at:now(),src:src||'mint',
    addr:'EQ'+fnv(defId+Math.random()).repeat(2)};
  DB.nfts.push(n); return n;
}
const owned=cat=>DB.nfts.filter(n=>!n.listed&&(!cat||n.cat===cat));
const nftById=id=>DB.nfts.find(n=>n.id===id);
const defOf=n=>DEFS[n.def];
const isBroken=n=>n.dur!==null&&n.dur<=0;

function repairCost(n){
  const d=defOf(n), missing=(n.durMax-n.dur)/n.durMax;
  return Math.round(d.price*0.5*missing);
}
function repair(id){
  const n=nftById(id); if(!n||n.dur===null)return;
  const c=repairCost(n);
  if(c>snk()){toast('$REG insufficienti');return}
  post('repair',id,[[ACC.pSnk,-c],[ACC.burn,c]]);
  DB.eco.burned+=c; DB.eco.sunk+=c; DB.eco.weekSink+=c;
  n.dur=n.durMax; save(); toast('Riparato per '+nf(c)+' $REG (bruciati)');
  renderAll();
}

/** Fusione: 3 NFT stessa rarità e categoria + token → 1 rarità superiore */
function craftables(){
  const out={};
  for(const n of owned()){
    if(n.rar==='leggendario')continue;
    const k=n.cat+'|'+n.rar; (out[k]=out[k]||[]).push(n);
  }
  return Object.entries(out).filter(([,v])=>v.length>=3);
}
function craftCost(rar){return Math.round(400*RAR[rar].k)}
function craft(cat,rar){
  const pool=owned().filter(n=>n.cat===cat&&n.rar===rar).slice(0,3);
  if(pool.length<3)return;
  const cost=craftCost(rar);
  if(cost>snk()){toast('$REG insufficienti');return}
  const up=RARORD[RARORD.indexOf(rar)+1];
  const cands=Object.keys(DEFS).filter(k=>DEFS[k].cat===cat&&DEFS[k].rar===up);
  if(!cands.length){toast('Nessuna ricetta disponibile');return}
  post('craft',cat,[[ACC.pSnk,-cost],[ACC.burn,cost]]);
  DB.eco.burned+=cost; DB.eco.sunk+=cost; DB.eco.weekSink+=cost;
  const ids=pool.map(n=>n.id);
  DB.nfts=DB.nfts.filter(n=>!ids.includes(n.id));
  for(const s in DB.loadout) for(const k in DB.loadout[s])
    if(ids.includes(DB.loadout[s][k])) delete DB.loadout[s][k];
  const got=mint(cands[Math.floor(Math.random()*cands.length)],'craft');
  save(); closeModal();
  toast('Fusione riuscita → '+defOf(got).name+' ('+RAR[up].n+')');
  renderAll();
}

/* ── Loadout ───────────────────────────────────────────────── */
function equip(mode,id){
  const n=nftById(id); if(!n)return;
  if(n.cat==='core'&&mode==='ranked'){toast('Le Reliquie sono disattivate in Esodo');return}
  const cur=DB.loadout[mode][n.cat];
  DB.loadout[mode][n.cat]= cur===id ? undefined : id;
  save(); renderInv();
}

const BASEMODS=()=>({march:1,camp:1,cart:1,farm:1,wood:1,iron:1,forge:1,birth:1,
  upkeep:1,know:1,loot:1,sight:1,atkMel:1,atkArc:1,atkCav:1,hp:1,
  earn:0,conqEarn:0,placeEarn:0,fee:0,tickets:0,
  skin:'st_verde',ability:null,used:[]});

/** Aggrega i modificatori del loadout. In Esodo le Reliquie vengono ignorate. */
function loadoutMods(mode){
  const m=BASEMODS();
  const L=DB.loadout[mode]||{};
  for(const cat in L){
    const id=L[cat]; if(!id)continue;
    const n=nftById(id); if(!n)continue;
    if(n.cat==='core'&&mode==='ranked')continue;
    if(isBroken(n))continue;
    const d=defOf(n);
    if(d.cat==='skin'){m.skin=n.def;continue}
    m.used.push(n.id);
    if(d.cat==='ability')m.ability=n.def;
    if(d.mods)for(const k in d.mods)m[k]*=d.mods[k];
    if(d.eco)for(const k in d.eco)m[k]+=d.eco[k];
  }
  return m;
}
const skinCol=m=>DEFS[m.skin]||DEFS.st_verde;

/* ═══════════════════════════════════════════════════════════════
   6 · MARKETPLACE                      ← identico agli altri titoli
   Listing a prezzo fisso, aste con anti-sniping.
   Royalty 5% al creator + fee 5% protocollo (metà bruciata).
   ═══════════════════════════════════════════════════════════════ */
const ROY=.05, FEE=.05;

function marketFee(){return Math.max(.01,FEE+loadoutMods('ranked').fee)}

function listNft(id,price,kind,hours){
  const n=nftById(id); if(!n||n.listed)return;
  for(const s in DB.loadout) for(const k in DB.loadout[s])
    if(DB.loadout[s][k]===id) delete DB.loadout[s][k];
  n.listed=true;
  DB.market.listings.push({id:uid('lst'),nft:id,defId:n.def,dur:n.dur,mine:true,price,
    kind:kind||'fixed',bid:kind==='auction'?Math.round(price*.6):null,bidder:null,
    ends:now()+(hours||24)*36e5,at:now()});
  save(); toast('Messo in vendita a '+nf(price)+' $REG'); renderAll();
}

function cancelListing(lid){
  const i=DB.market.listings.findIndex(l=>l.id===lid); if(i<0)return;
  const l=DB.market.listings[i];
  if(l.bidder==='me'){
    post('bid_refund',lid,[[ACC.mkt,-l.bid],[ACC.pSnk,l.bid]]);
  }
  const n=nftById(l.nft); if(n)n.listed=false;
  DB.market.listings.splice(i,1); save(); toast('Annullato'); renderAll();
}

function buyListing(lid){
  const l=DB.market.listings.find(x=>x.id===lid); if(!l)return;
  if(l.mine){toast('È già tuo');return}
  if(l.price>snk()){toast('$REG insufficienti');return}
  const fee=Math.round(l.price*marketFee()), roy=Math.round(l.price*ROY);
  const net=l.price-fee-roy, burn=Math.round(fee/2);
  post('market_buy',lid,[
    [ACC.pSnk,-l.price],[ACC.opp,net],[ACC.crea,roy],
    [ACC.burn,burn],[ACC.treas,fee-burn]
  ]);
  DB.eco.burned+=burn; DB.eco.sunk+=fee; DB.eco.weekSink+=fee;
  DB.stats.spent+=l.price;
  const n=mint(l.defId,'market');
  if(l.dur!==undefined&&l.dur!==null){n.dur=l.dur}
  DB.market.trades.unshift({at:now(),def:l.defId,price:l.price,side:'buy'});
  DB.market.listings=DB.market.listings.filter(x=>x.id!==lid);
  save(); closeModal(); toast('Comprato '+DEFS[l.defId].name); renderAll();
}

function placeBid(lid,amt){
  const l=DB.market.listings.find(x=>x.id===lid); if(!l||l.kind!=='auction')return;
  const min=Math.ceil((l.bid||0)*1.05)+1;
  if(amt<min){toast('Rilancio minimo '+nf(min)+' $REG');return}
  if(amt>snk()){toast('$REG insufficienti');return}
  if(l.bidder==='me') post('bid_refund',lid,[[ACC.mkt,-l.bid],[ACC.pSnk,l.bid]]);
  post('bid',lid,[[ACC.pSnk,-amt],[ACC.mkt,amt]]);
  l.bid=amt; l.bidder='me';
  if(l.ends-now()<18e4){l.ends=now()+18e4;toast('Rilancio accettato — asta estesa di 3 min')}
  else toast('Rilancio di '+nf(amt)+' $REG');
  save(); renderAll();
}

/** Bot di mercato: tiene vivo il mercato fra una sessione e l'altra. */
function tickMarket(){
  const L=DB.market.listings;
  for(const l of [...L]){
    if(l.kind==='auction'&&now()>l.ends){
      if(l.bidder==='me'){
        const fee=Math.round(l.bid*marketFee()), roy=Math.round(l.bid*ROY);
        const burn=Math.round(fee/2);
        post('auction_win',l.id,[[ACC.mkt,-l.bid],[ACC.opp,l.bid-fee-roy],
          [ACC.crea,roy],[ACC.burn,burn],[ACC.treas,fee-burn]]);
        DB.eco.burned+=burn; DB.eco.sunk+=fee;
        mint(l.defId,'auction');
        toast('Asta vinta: '+DEFS[l.defId].name);
      } else if(l.mine&&l.bidder){
        const fee=Math.round(l.bid*marketFee()), roy=Math.round(l.bid*ROY);
        const burn=Math.round(fee/2);
        post('auction_sold',l.id,[[ACC.opp,-l.bid],[ACC.pSnk,l.bid-fee-roy],
          [ACC.crea,roy],[ACC.burn,burn],[ACC.treas,fee-burn]]);
        DB.eco.burned+=burn;
        DB.nfts=DB.nfts.filter(n=>n.id!==l.nft);
      } else if(l.mine){
        const n=nftById(l.nft); if(n)n.listed=false;
      }
      DB.market.listings=DB.market.listings.filter(x=>x.id!==l.id);
    }
  }
  for(const l of DB.market.listings){
    if(l.kind==='auction'&&l.bidder==='me'&&Math.random()<.25&&now()<l.ends-6e4){
      const up=Math.ceil(l.bid*(1.06+Math.random()*.12));
      post('bid_refund',l.id,[[ACC.mkt,-l.bid],[ACC.pSnk,l.bid]]);
      l.bid=up; l.bidder='bot';
      if(l.ends-now()<18e4) l.ends=now()+18e4;
    }
  }
  for(const l of [...DB.market.listings]){
    if(l.mine&&l.kind==='fixed'){
      const d=DEFS[l.defId];
      const fair=d?d.price:l.price;
      const p=l.price<=fair*1.1?.30:l.price<=fair*1.6?.10:.02;
      if(Math.random()<p){
        const fee=Math.round(l.price*marketFee()), roy=Math.round(l.price*ROY);
        const burn=Math.round(fee/2);
        post('market_sold',l.id,[[ACC.opp,-l.price],[ACC.pSnk,l.price-fee-roy],
          [ACC.crea,roy],[ACC.burn,burn],[ACC.treas,fee-burn]]);
        DB.eco.burned+=burn; DB.eco.sunk+=fee;
        DB.stats.earned+=l.price-fee-roy;
        DB.market.trades.unshift({at:now(),def:l.defId,price:l.price,side:'sell'});
        DB.nfts=DB.nfts.filter(n=>n.id!==l.nft);
        DB.market.listings=DB.market.listings.filter(x=>x.id!==l.id);
        toast('Venduto! +'+nf(l.price-fee-roy)+' $REG');
      }
    }
  }
  const botL=DB.market.listings.filter(l=>!l.mine);
  while(botL.length<12){
    const l=genListing(); DB.market.listings.push(l); botL.push(l);
  }
  save();
}

function genListing(){
  const keys=Object.keys(DEFS).filter(k=>DEFS[k].price>0);
  const def=keys[Math.floor(Math.random()*keys.length)];
  const d=DEFS[def];
  const auction=Math.random()<.25;
  const jitter=.72+Math.random()*.7;
  const price=Math.round(d.price*jitter/10)*10;
  const dur=d.dur?Math.round(35+Math.random()*65):null;
  const durAdj=dur?Math.round(price*(.55+.45*dur/100)):price;
  return {id:uid('lst'),defId:def,mine:false,dur,
    kind:auction?'auction':'fixed',
    price:auction?Math.round(durAdj*.7):durAdj,
    bid:auction?Math.round(durAdj*.55):null,bidder:auction?'bot':null,
    ends:now()+(auction?(1+Math.random()*8)*36e5:72*36e5),at:now()};
}

function floorOf(cat){
  const ls=DB.market.listings.filter(l=>!l.mine&&l.kind==='fixed'&&DEFS[l.defId].cat===cat);
  return ls.length?Math.min(...ls.map(l=>l.price)):0;
}

/* ═══════════════════════════════════════════════════════════════
   7 · MODALITÀ E MATCHMAKING
   ─────────────────────────────────────────────────────────────
   L'Esodo è PvP asincrono a seme condiviso: otto clan ricevono
   ESATTAMENTE la stessa mappa, le stesse risorse e gli stessi covi,
   e hanno gli stessi 60 giorni. Non c'è fortuna da spartire: chi
   finisce più in alto ha giocato meglio quel mondo. È la stessa
   somma zero di un'arena, senza bisogno di stare online insieme.

   LA MEMBRANA A SENSO UNICO
   I Coins si guadagnano giocando (rubinetto libero) e non escono
   MAI verso i $REG. I $REG possono diventare Coins, bruciandosi.
   ═══════════════════════════════════════════════════════════════ */
const CLANS=8;                 // partecipanti a un Esodo
const RUN_DAYS=60;             // durata di una spedizione

const MODES={
  prova: {key:'prova', name:'Accampamento', cur:'COINS', fee:0,  tk:0, rake:0,   min:1, days:30,
          d:'Gratis, sempre · 30 giorni · premi in Coins · serve a imparare la terra'},
  libera:{key:'libera',name:'Libera',       cur:'COINS', fee:0,  tk:1, rake:0,   min:1, days:60,
          d:'Costa 1 Ticket · 60 giorni · Reliquie attive · premi in Coins molto più alti'},
  t1:    {key:'t1',    name:'Esodo T1',     cur:'REG',   fee:60, tk:0, rake:.10, min:2, days:60,
          d:'Quota bassa in $REG · qui si gioca per valore reale'},
  t2:    {key:'t2',    name:'Esodo T2',     cur:'REG',   fee:150,tk:0, rake:.10, min:4, days:60,
          d:'La fascia principale'},
  t3:    {key:'t3',    name:'Esodo T3',     cur:'REG',   fee:600,tk:0, rake:.10, min:8, days:60,
          d:'Alta posta · richiede livello 8 e stake'}
};
const isRanked=k=>MODES[k].cur==='REG';

const TICKET_PRICE=600;      // in Coins
const TICKET_FREE=3;         // gratuiti al giorno
const TICKET_MAX=12;         // tetto giornaliero: chiude l'arbitraggio da bot

function ticketsLeft(){
  const d=Math.floor(now()/DAY);
  if(DB.tickets.date!==d){
    DB.tickets.date=d;
    DB.tickets.left=TICKET_FREE+loadoutMods('ranked').tickets;
    DB.tickets.bought=0; save();
  }
  return DB.tickets.left;
}
function ticketCost(){
  const n=DB.tickets.bought||0;
  return Math.round(TICKET_PRICE*(1+n*0.35));   // prezzo crescente: freno al farming
}
function buyTicket(){
  const c=ticketCost();
  if((DB.tickets.bought||0)>=TICKET_MAX){toast('Hai raggiunto il tetto giornaliero di Ticket');return}
  if(c>coins()){toast('Servono '+nf(c)+' ● Coins');return}
  post('ticket_buy',null,[[ACC.pCoin,-c],[ACC.coinSink,c]]);
  DB.tickets.bought=(DB.tickets.bought||0)+1;
  DB.tickets.left++;
  save(); toast('Ticket comprato per '+nf(c)+' ● Coins'); renderAll();
}

/** $REG → Coins, senso unico. Sink puro: i $REG spesi si bruciano. */
function convertToCoins(amtSnk){
  if(amtSnk>snk()){toast('$REG insufficienti');return}
  const got=amtSnk*45;
  post('convert_reg_coins',null,[[ACC.pSnk,-amtSnk],[ACC.burn,amtSnk],
    [ACC.emis,-got],[ACC.pCoin,got]]);
  DB.eco.burned+=amtSnk; DB.eco.sunk+=amtSnk; DB.eco.weekSink+=amtSnk;
  save(); toast(nf(amtSnk)+' ◈ bruciati → '+nf(got)+' ● Coins'); renderAll();
}

function canPlay(k){
  const M=MODES[k];
  if(k==='prova')return{ok:true};
  if(M.tk){
    if(ticketsLeft()<M.tk)return{ok:false,why:'Serve un Ticket',needTicket:true};
    return{ok:true};
  }
  if(DB.player.level<M.min)return{ok:false,why:'Serve il livello '+M.min};
  if(k==='t3'&&DB.player.stake<2000)return{ok:false,why:'Serve uno stake di 2.000 $REG'};
  if(snk()<M.fee)return{ok:false,why:'Servono '+nf(M.fee)+' $REG'};
  return{ok:true};
}

/* ═══════════════════════════════════════════════════════════════
   8 · CURVA DEI PREMI  (§11.4 dell'architettura)
   Tariffa FISSA per covo raso al suolo: il residuo dei covi che
   nessuno ha conquistato viene BRUCIATO, non redistribuito.
   Motivo (§5.2): una conquista deve valere sempre lo stesso, o il
   giocatore non può più calcolare se gli conviene rischiare
   l'esercito invece di coltivare.
   ═══════════════════════════════════════════════════════════════ */
const SPLIT={1:.40,2:.24,3:.16,4:.11,5:.06,6:.03};
const PLACE_SHARE=.65, CONQ_SHARE=.35, MAX_CONQ=6;

/** Premi in Coins: rubinetto libero, nessun montepremi da bilanciare. */
const COIN_PAY={prova:{base:120,place:26,conq:70},libera:{base:400,place:150,conq:210}};

function computePayout(modeKey,place,conq,eco){
  const M=MODES[modeKey];
  conq=Math.min(conq,MAX_CONQ);
  if(M.cur==='COINS'){
    const c=COIN_PAY[modeKey]||COIN_PAY.prova;
    let p=Math.round(c.base+c.place*Math.max(0,CLANS+1-place)*(place<=3?1.7:1));
    let k=Math.round(c.conq*conq);
    if(eco){p=Math.round(p*(1+eco.earn));k=Math.round(k*(1+eco.earn))}
    return {place:p,conq:k,fee:0,pool:0,dist:0,cur:'COINS'};
  }
  const pool=M.fee*CLANS, dist=pool*(1-M.rake);
  let p=Math.round(dist*PLACE_SHARE*(SPLIT[place]||0));
  let k=Math.round(dist*CONQ_SHARE/MAX_CONQ*conq);
  if(eco){
    if(place<=3)p=Math.round(p*(1+eco.placeEarn));
    k=Math.round(k*(1+eco.conqEarn));
    p=Math.round(p*(1+eco.earn)); k=Math.round(k*(1+eco.earn));
  }
  return {place:p,conq:k,fee:M.fee,pool,dist,cur:'REG'};
}

/** Rendimenti decrescenti oltre 18 spedizioni/giorno — anti-bot §13 */
function diminish(){
  const d=Math.floor(now()/DAY);
  if(DB.risk.date!==d){DB.risk.date=d;DB.risk.count=0}
  const n=DB.risk.count;
  return n<=18?1:Math.pow(.85,Math.min(20,n-18));
}
function riskScore(){
  let s=0;
  if(DB.risk.count>30)s+=35;
  if(DB.risk.count>55)s+=30;
  if(!DB.player.addr)s+=5;
  return Math.min(100,s);
}

/* ═══════════════════════════════════════════════════════════════
   9 · PROGRESSIONE · BATTLE PASS · QUEST · ACHIEVEMENT
   ═══════════════════════════════════════════════════════════════ */
const lvlNeed=l=>Math.round(140*Math.pow(l,1.35));
function addXp(n){
  DB.player.xp+=n; DB.season.bpXp+=n;
  let up=0;
  while(DB.player.xp>=lvlNeed(DB.player.level)){
    DB.player.xp-=lvlNeed(DB.player.level); DB.player.level++; up++;
  }
  return up;
}

const BP_TIERS=50, BP_STEP=300, BP_PRICE=1200;
const bpTier=()=>Math.min(BP_TIERS,Math.floor(DB.season.bpXp/BP_STEP));
function bpReward(t){
  if(t%10===0)return{type:'nft',v:t>=40?'epico':t>=20?'raro':'comune'};
  if(t%5===0)return{type:'snk',v:60+t*8};
  return{type:'coins',v:120+t*14};
}
function bpClaim(t){
  if(DB.season.claimed.includes(t))return;
  if(t>bpTier()){toast('Livello non ancora raggiunto');return}
  DB.season.claimed.push(t);
  give(bpReward(t),'battlepass');
  if(DB.season.premium){
    const prem=t%5===0?{type:'snk',v:110+t*14}:{type:'coins',v:200+t*20};
    give(prem,'battlepass_premium');
  }
  save(); renderSeason(); renderTop();
}
function buyBP(){
  if(BP_PRICE>snk()){toast('Servono '+nf(BP_PRICE)+' $REG');return}
  const burn=Math.round(BP_PRICE*.6);
  post('battlepass',null,[[ACC.pSnk,-BP_PRICE],[ACC.burn,burn],[ACC.treas,BP_PRICE-burn]]);
  DB.eco.burned+=burn; DB.eco.sunk+=BP_PRICE; DB.eco.weekSink+=BP_PRICE;
  DB.season.premium=true; save(); toast('Cronaca Premium attivata');
  renderSeason(); renderTop();
}

function give(r,src){
  if(r.type==='coins'){post('reward_coins',src,[[ACC.emis,-r.v],[ACC.pCoin,r.v]])}
  else if(r.type==='snk'){
    post('reward_reg',src,[[ACC.resv,-r.v],[ACC.pSnk,r.v]]);
    DB.eco.minted+=r.v; DB.eco.weekMint+=r.v;
  }
  else if(r.type==='nft'){
    const c=Object.keys(DEFS).filter(k=>DEFS[k].rar===r.v&&DEFS[k].price>0);
    const got=mint(c[Math.floor(Math.random()*c.length)],src);
    toast('Ricevuto: '+defOf(got).name);
  }
}

const QPOOL=[
  {id:'q_run3',  t:'Guida 3 spedizioni',           n:3, k:'played', r:{type:'coins',v:280}},
  {id:'q_conq4', t:'Rade al suolo 4 covi',         n:4, k:'conq',   r:{type:'coins',v:440}},

  {id:'q_esodo2',t:'Gioca 2 Esodi in $REG',        n:2, k:'ranked', r:{type:'snk',v:55}}
];
function refreshQuests(){
  const d=Math.floor(now()/DAY);
  if(DB.quests.day===d)return;
  DB.quests.day=d;
  const sh=[...QPOOL].sort(()=>Math.random()-.5);
  DB.quests.daily=sh.slice(0,3).map(q=>({...q,p:0,done:false}));

/* ═══════════════════════════════════════════════════════════════
   10 · ECONOMIA · EMISSION GOVERNOR  (§5.4)
   E_w = min(CAP_w , k × SINK_(w-1))  — l'emissione non può mai
   superare i consumi della settimana precedente.
   ═══════════════════════════════════════════════════════════════ */
const SUPPLY=1e9, K_FACTOR=.7, WEEK_CAP=2.4e6;
function governor(){
  const prevSink=DB.eco.hist.length?DB.eco.hist[DB.eco.hist.length-1].sink:DB.eco.weekSink;
  const allowed=Math.min(WEEK_CAP,K_FACTOR*Math.max(prevSink,1));
  return {allowed,used:DB.eco.weekMint,prevSink,
    ratio:DB.eco.weekMint?DB.eco.weekSink/DB.eco.weekMint:Infinity};
}
function rollWeek(){
  DB.eco.hist.push({w:DB.eco.week,sink:DB.eco.weekSink,mint:DB.eco.weekMint});
  if(DB.eco.hist.length>12)DB.eco.hist.shift();
  DB.eco.week++; DB.eco.weekSink=0; DB.eco.weekMint=0; save();
}
