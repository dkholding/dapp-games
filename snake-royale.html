let holdT=null,holdFired=false,holdX=0,holdY=0;
function tapNft(id,ev){
  clearTimeout(holdT);
  // Se la pressione lunga ha già aperto la scheda, il click che il browser
  // genera al rilascio del dito NON deve anche equipaggiare/sequipaggiare.
  if(holdFired){holdFired=false;return}
  // Col mouse il doppio clic è un evento vero (detail>=2): apre la scheda
  // dell'oggetto. Al tocco non cambia nulla — lì detail resta 1 e il gesto
  // documentato (tocco per equipaggiare) è intatto.
  if(ev&&ev.detail>=2&&!isTouch){nftDetail(id);return}
  equip(invMode,id);
}
/* Pressione lunga sulle tessere dell'inventario: è il gesto che il
   sottotitolo promette al dito, dove il doppio clic non esiste. Delegato
   sulla pagina perché le tessere vengono ricreate a ogni render: un solo
   listener, mai registrato due volte. Uno spostamento oltre 12px (sta
   scorrendo la pagina) o il rilascio annullano il timer. */
{
  const inv=$('#p-inv');
  const stop=()=>{clearTimeout(holdT);holdT=null};
  inv.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.nft[data-id]'); if(!el)return;
    stop(); holdFired=false; holdX=e.clientX; holdY=e.clientY;
    const id=el.dataset.id;
    holdT=setTimeout(()=>{holdT=null;holdFired=true;nftDetail(id)},480);
  });
  inv.addEventListener('pointermove',e=>{
    if(holdT===null)return;
    if(Math.abs(e.clientX-holdX)>12||Math.abs(e.clientY-holdY)>12)stop();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>inv.addEventListener(ev,stop));
  // Il menù contestuale del sistema (Android lo apre sulla pressione lunga)
  // non deve sovrapporsi alla scheda dell'oggetto.
  inv.addEventListener('contextmenu',e=>{if(e.target.closest('.nft'))e.preventDefault()});
}

/* ═══════════════════════════════════════════════════════════════
   CONTROLLORE DI LAYOUT — unica sorgente di verità
   Le @media del foglio di stile e queste classi usano le STESSE
   soglie (720 / 1080 / landscape<=520): non possono divergere.
   Le classi restano agganci condivisi fra CSS e JS: qui servono
   soprattutto al punto d'ingresso unico qui sotto, perché le @media
   da sole non sanno dire al JS che il layout è cambiato — e i canvas
   (tela di gioco, minimappa, anteprime NFT) sono disegnati a pixel
   fissi e resterebbero della misura vecchia.
   ═══════════════════════════════════════════════════════════════ */
const MQ={
  t   :matchMedia('(min-width:720px)'),
  d   :matchMedia('(min-width:1080px)'),
  land:matchMedia('(orientation:landscape) and (max-height:520px)'),
  side:matchMedia('(min-aspect-ratio:13/10)'),
  fine:matchMedia('(hover:hover) and (pointer:fine)')
};
let LAY='';
function applyLayout(){
  const c=document.body.classList;
  const d=MQ.d.matches, t=MQ.t.matches&&!d;
  c.toggle('lay-d',d);
  c.toggle('lay-t',t);
  c.toggle('lay-land',MQ.land.matches);
  c.toggle('lay-side',MQ.side.matches);
  c.toggle('lay-fine',MQ.fine.matches);
  const n=(d?'D':t?'T':'M')+(MQ.land.matches?'L':'')+(MQ.side.matches?'S':'');
  const changed=n!==LAY; LAY=n;
  return changed;
}
applyLayout();

/* Un solo punto d'ingresso per QUALSIASI cambio di viewport: la tela
   della partita si ridimensiona subito (altrimenti si vede un salto),
   mentre le anteprime su canvas aspettano 90ms per non far partire una
   raffica di ridisegni mentre si trascina il bordo della finestra. */
let vpT=0;
function onViewportChange(){
  applyLayout();
  const inGame=$('#game').classList.contains('on');
  if(inGame)resize();
  clearTimeout(vpT);
  vpT=setTimeout(()=>{
    if($('#game').classList.contains('on')){resize();if(M)drawMap()}
    paintArt('#p-'+page);
    if($('#modal').classList.contains('on'))paintArt('#mIn');
  },90);
}
addEventListener('orientationchange',()=>setTimeout(onViewportChange,240));
addEventListener('resize',onViewportChange);
if(window.visualViewport)visualViewport.addEventListener('resize',onViewportChange);
for(const k in MQ)MQ[k].addEventListener('change',onViewportChange);

/* ── Avvio ─────────────────────────────────────────────────── */
/** Stato di genesi. Estratto perché i test possano ripartire puliti. */
function genesis(){
  DB=fresh();
  // Grant di benvenuto: passa dal ledger come emissione, non appare dal nulla
  post('welcome_grant',null,[[ACC.emis,-1500],[ACC.pSnk,1500]]);
  post('welcome_coins',null,[[ACC.emis,-2000],[ACC.pCoin,2000]]);
  // Allocazione di genesi: conta nella supply totale ma NON nel tetto
  // settimanale del governor, che misura l'emissione ricorrente.
  DB.eco.minted+=1500;
  const s=mint('sk_verde','starter');
  DB.loadout.ranked.skin=s.id; DB.loadout.casual.skin=s.id;
  const a=mint('ab_viper','starter');
  DB.loadout.ranked.ability=a.id; DB.loadout.casual.ability=a.id;
  for(let i=0;i<12;i++)DB.market.listings.push(genListing());
  M=null;
  save();
}

function boot(){
  DB=load();
  const first=!DB;
  if(first)genesis();
  refreshQuests();
  tickMarket();
  resize();
  go('play');
  if(first)setTimeout(()=>toast('Benvenuto: 1.500 ◈, una skin e l\'abilità Viper'),600);
}
boot();
})();
</script>
