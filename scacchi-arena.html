<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scacchi Arena</title>
<style>
:root{
  --bg:#0a0e13; --bg2:#0e141d; --panel:#121924; --panel2:#161f2c; --line:#1f2a3a;
  --txt:#e8eef7; --dim:#8b9bb0; --dim2:#5f7285;
  --ac:#2dd4bf; --gold:#f5c451; --dan:#ef5a5a; --pur:#c084fc; --blu:#38bdf8; --grn:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-variant-numeric:tabular-nums;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* ── Header ─────────────────────────────────────── */
#top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;
  background:var(--bg2);border-bottom:1px solid var(--line);z-index:5}
.bal{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:5px 9px;font-size:12.5px;font-weight:700}
.bal i{font-style:normal;font-size:13px}
.bal.snk{color:var(--ac)} .bal.coin{color:var(--gold)}
#wbtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:6px 11px;font-size:12px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px}
#wbtn.on{color:var(--ac);border-color:rgba(45,212,191,.4)}
#wbtn .dot{width:6px;height:6px;border-radius:50%;background:var(--dim2)}
#wbtn.on .dot{background:var(--ac);box-shadow:0 0 8px var(--ac)}

/* ── Corpo ──────────────────────────────────────── */
#body{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:14px 12px 18px;display:none;
  -webkit-overflow-scrolling:touch}
.page.on{display:block}

/* ── Tab bar ────────────────────────────────────── */
#tabs{flex:none;display:flex;background:var(--bg2);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;padding:9px 2px 8px;text-align:center;color:var(--dim2);font-size:9.5px;font-weight:600;
  letter-spacing:.2px;transition:color .15s}
.tab b{display:block;font-size:19px;font-weight:400;margin-bottom:2px;line-height:1}
.tab.on{color:var(--ac)}

/* ── Tipografia ─────────────────────────────────── */
h2{margin:0 0 3px;font-size:20px;font-weight:700;letter-spacing:-.3px}
h3{margin:20px 0 9px;font-size:12px;font-weight:700;color:var(--dim);
  text-transform:uppercase;letter-spacing:.7px}
h3:first-child{margin-top:0}
.sub{margin:0 0 14px;color:var(--dim);font-size:12.5px;line-height:1.55}
.muted{color:var(--dim);font-size:11.5px;line-height:1.5}

/* ── Componenti ─────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
.card.flat{background:var(--bg2)}
.row{display:flex;align-items:center;gap:10px}
.row+.row{margin-top:9px}
.grow{flex:1;min-width:0}
.btn{background:var(--ac);color:#04211d;border-radius:10px;padding:11px 18px;font-size:14px;
  font-weight:700;text-align:center;transition:transform .07s,opacity .15s}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.38}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:8px}
.btn.g{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2d1f00}
.btn.dan{background:rgba(239,90,90,.15);color:var(--dan);border:1px solid rgba(239,90,90,.35)}
.btn.wide{width:100%}
.pill{display:inline-block;padding:2.5px 8px;border-radius:999px;font-size:9.5px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase}
.bar{height:6px;background:#0a0f16;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px}
.kv span{color:var(--dim)}
.kv b{font-weight:600}
.empty{text-align:center;color:var(--dim2);font-size:12.5px;padding:26px 10px;line-height:1.6}
input.fld{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:11px;
  color:var(--txt);font:inherit;width:100%}

/* ── NFT ────────────────────────────────────────── */
.nftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.nft{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;
  position:relative;overflow:hidden;transition:border-color .15s}
.nft.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.nft.off{opacity:.42}
.nft .art{height:52px;border-radius:8px;margin-bottom:7px;position:relative;overflow:hidden;
  background:#0a0f16;display:flex;align-items:center;justify-content:center}
.nft .art canvas{width:100%;height:100%}
.nft .nm{font-size:11.5px;font-weight:700;line-height:1.25;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nft .rr{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.nft .dur{margin-top:6px;height:3px;background:#0a0f16;border-radius:99px;overflow:hidden}
.nft .dur>i{display:block;height:100%;border-radius:99px}
.nft .eq{position:absolute;top:6px;right:6px;background:var(--ac);color:#04211d;font-size:8px;
  font-weight:800;padding:2px 5px;border-radius:5px;letter-spacing:.3px}

/* ── Modale ─────────────────────────────────────── */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;
  background:rgba(6,9,13,.82);backdrop-filter:blur(6px)}
#modal.on{display:flex}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;
  max-width:460px;max-height:88%;overflow-y:auto;padding:16px 15px calc(18px + env(safe-area-inset-bottom))}
#mbox h4{margin:0 0 4px;font-size:17px;font-weight:700}
.mgrab{width:34px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 13px}

/* ── Partita ────────────────────────────────────── */
#game{position:fixed;inset:0;z-index:30;display:none;background:var(--bg);
  flex-direction:column}
#game.on{display:flex}
.seat{flex:none;display:flex;align-items:center;gap:9px;padding:9px 13px}
.seat.top{padding-top:calc(10px + env(safe-area-inset-top))}
.seat .av{width:34px;height:34px;flex:none;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px}
.seat .who{flex:1;min-width:0}
.seat .who b{display:block;font-size:13px;font-weight:700;line-height:1.3}
.seat .cap{font-size:13px;color:var(--dim);line-height:1.2;letter-spacing:-1px}
.seat .cap em{font-style:normal;color:var(--gold);font-size:10.5px;letter-spacing:0;margin-left:4px}
.clk{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:7px 12px;font-size:17px;font-weight:800;min-width:82px;text-align:center}
.clk.act{border-color:var(--ac);color:var(--ac)}
.clk.low{border-color:var(--dan);color:var(--dan)}
#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#cv{display:block;touch-action:none;border-radius:10px}
#evalWrap{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:7px;height:74%;
  background:#0a0f16;border:1px solid var(--line);border-radius:99px;overflow:hidden;display:none}
#evalWrap.on{display:block}
#evalBar{position:absolute;left:0;right:0;bottom:0;background:var(--txt);transition:height .3s}
#gbar{flex:none;display:flex;gap:7px;padding:9px 13px calc(11px + env(safe-area-inset-bottom))}
#gbar button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 4px;font-size:11.5px;font-weight:700;color:var(--dim)}
#gbar button.hot{color:var(--ac);border-color:rgba(45,212,191,.4)}
#gbar button:disabled{opacity:.35}
#moves{flex:none;height:26px;overflow:hidden;padding:0 13px;font-size:11px;color:var(--dim);
  white-space:nowrap;text-overflow:ellipsis;direction:rtl;text-align:left}
#moves b{color:var(--txt);font-weight:600}
#gmsg{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:15px;font-weight:800;
  color:var(--gold);text-shadow:0 2px 14px #000;opacity:0;transition:opacity .25s;pointer-events:none}
#gmsg.on{opacity:1}

/* ── Risultato ──────────────────────────────────── */
#res{position:fixed;inset:0;z-index:35;display:none;background:rgba(10,14,19,.96);
  overflow-y:auto;padding:22px 14px calc(22px + env(safe-area-inset-bottom))}
#res.on{display:block}
.rwrap{max-width:420px;margin:0 auto}
.rplace{text-align:center;padding:12px 0 18px}
.rplace .n{font-size:44px;font-weight:800;line-height:1.05;color:var(--gold)}
.rplace .l{color:var(--dim);font-size:12.5px;margin-top:5px}
.rstats{display:flex;gap:8px;margin-bottom:12px}
.rstat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}
.rstat b{display:block;font-size:18px}
.rstat small{color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.4px}
.pos{color:var(--ac)!important} .neg{color:var(--dan)!important}

/* ── Mercato ────────────────────────────────────── */
.lst{display:flex;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px;margin-bottom:8px}
.lst .art{width:52px;height:52px;flex:none;border-radius:9px;overflow:hidden;background:#0a0f16}
.lst .art canvas{width:100%;height:100%}
.lst .info{flex:1;min-width:0}
.lst .nm{font-size:13px;font-weight:700;margin-bottom:2px}
.lst .meta{font-size:10.5px;color:var(--dim)}
.lst .buy{flex:none;text-align:right}
.lst .price{font-size:14px;font-weight:800;color:var(--ac);margin-bottom:5px}

/* ── Segmenti ───────────────────────────────────── */
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;
  margin-bottom:12px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--txt)}

/* ── Tabella economia ───────────────────────────── */
.ebar{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:11.5px}
.ebar .lbl{width:96px;flex:none;color:var(--dim)}
.ebar .tr{flex:1;height:16px;background:#0a0f16;border-radius:5px;overflow:hidden}
.ebar .tr>i{display:block;height:100%;border-radius:5px}
.ebar .vl{width:74px;flex:none;text-align:right;font-weight:700}
pre.code{background:#0a0f16;border:1px solid var(--line);border-radius:10px;padding:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.55;
  color:var(--dim);overflow-x:auto;margin:0}
pre.code b{color:var(--ac);font-weight:600}

/* ── Mondo aperto ───────────────────────────────── */
#p-play{padding:0;overflow:hidden}
#wworld{position:absolute;inset:0;overflow:hidden;background:#0b1410}
#wcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#whud{position:absolute;top:9px;left:9px;right:9px;display:flex;gap:6px;align-items:flex-start;
  pointer-events:none;flex-wrap:wrap}
#whud .wc{background:rgba(14,20,29,.86);border:1px solid var(--line);border-radius:9px;
  padding:5px 9px;font-size:11px;font-weight:700;pointer-events:auto;display:flex;gap:6px;align-items:center}
#whud .wc small{color:var(--dim);font-weight:600;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px}
#whud .wc.gold{color:var(--gold)} #whud .wc.ac{color:var(--ac)}
#whud .sp{flex:1}
#wzone{position:absolute;left:0;right:0;top:46%;text-align:center;pointer-events:none;
  font-size:20px;font-weight:800;letter-spacing:-.3px;text-shadow:0 3px 16px #000;
  opacity:0;transition:opacity .5s}
#wzone.on{opacity:1}
#wzone small{display:block;font-size:11.5px;font-weight:600;color:var(--dim);
  letter-spacing:.2px;margin-top:3px}
#wprompt{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(14,20,29,.94);
  border:1px solid var(--line);border-radius:13px;padding:10px 12px;display:none;
  align-items:center;gap:10px}
#wprompt.on{display:flex}
#wprompt .ic{width:36px;height:36px;flex:none;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px}
#wprompt .tx{flex:1;min-width:0}
#wprompt .tx b{display:block;font-size:13px;font-weight:700}
#wprompt .tx span{font-size:11px;color:var(--dim);display:block;line-height:1.4}
#wcall{position:absolute;left:10px;right:10px;top:52px;background:rgba(245,196,81,.12);
  border:1px solid rgba(245,196,81,.5);border-radius:12px;padding:9px 11px;display:none;
  align-items:center;gap:9px}
#wcall.on{display:flex}
#wcall b{font-size:12.5px;color:var(--gold);display:block}
#wcall span{font-size:11px;color:var(--dim)}

/* ── Scelta della posta ─────────────────────────── */
.betrow{display:flex;gap:6px;margin:10px 0}
.betrow button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:9px 2px;font-size:12.5px;font-weight:700}
.betrow button.on{background:rgba(45,212,191,.16);border-color:var(--ac);color:var(--ac)}
.betrow button:disabled{opacity:.3}
.kindpick{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.kindpick button{display:flex;align-items:center;gap:11px;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:11px;text-align:left}
.kindpick button:disabled{opacity:.4}
.kindpick .ki{width:34px;height:34px;flex:none;border-radius:9px;background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.kindpick b{display:block;font-size:13.5px}
.kindpick span{font-size:11px;color:var(--dim);line-height:1.4}
.brk{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.brk .m{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;font-size:11.5px}
.brk .m .p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brk .m .p.win{color:var(--ac);font-weight:700}
.brk .m .p.me{color:var(--gold)}
.brk .m .vs{color:var(--dim2);font-size:10px}
#gPlace{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:10.5px;
  color:var(--dim);letter-spacing:.3px;pointer-events:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 16px;
  font-size:12.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;max-width:88%;text-align:center;line-height:1.45}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE — telefono (base) · tablet ≥720 · computer ≥1080
   La baseline sopra è il telefono e non va toccata.
   ═══════════════════════════════════════════════════════════════ */
:root{--col:660px;--gut:12px}
.brand{display:none}

/* Il mouse merita una barra di scorrimento e uno stato hover */
@media (pointer:fine){
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;
    border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim2)}
  ::-webkit-scrollbar-track{background:transparent}
}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){filter:brightness(1.09)}
  .tab:hover{color:var(--txt)}
  .nft:hover,.lst:hover,.unit:hover{border-color:var(--dim2)}
  .xbtn:hover{color:var(--txt)}
}

/* ── TABLET ─────────────────────────────────────── */
@media (min-width:720px){
  :root{--gut:20px}
  #top{padding-left:max(var(--gut),calc((100% - var(--col))/2));
       padding-right:max(var(--gut),calc((100% - var(--col))/2))}
  .page{padding:22px max(var(--gut),calc((100% - var(--col))/2)) 32px}
  h2{font-size:23px}
  .sub{font-size:13.5px}
  .card{padding:15px;border-radius:15px;margin-bottom:12px}
  .grid2{grid-template-columns:repeat(3,1fr)}
  .grid3{grid-template-columns:repeat(4,1fr)}
  #tabs{justify-content:center;gap:8px}
  .tab{flex:0 1 148px;font-size:11px;padding:11px 4px 10px}
  .tab b{font-size:21px}
  /* La modale diventa un dialogo centrato, non un foglio che sale */
  #modal{align-items:center}
  #mbox{max-width:540px;border-radius:20px;max-height:84vh;
        padding:18px 20px 22px;animation:fadein .18s ease-out}
  .mgrab{display:none}
  .rwrap{max-width:540px}
  .toast{bottom:calc(94px + env(safe-area-inset-bottom))}
}
@keyframes fadein{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* ── COMPUTER ───────────────────────────────────── */
@media (min-width:1080px){
  :root{--col:720px}
  #app{flex-direction:row}
  #main{flex:1;min-width:0}
  #tabs{order:-1;flex:none;width:224px;flex-direction:column;justify-content:flex-start;
        gap:4px;border-top:none;border-right:1px solid var(--line);
        padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
  .tab{flex:none;display:flex;align-items:center;gap:12px;text-align:left;
       padding:11px 13px;border-radius:11px;font-size:13.5px;letter-spacing:0}
  .tab b{font-size:20px;margin:0;line-height:1;display:block}
  .tab.on{background:var(--panel)}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 13px 18px;
         font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--txt)}
  .brand b{font-size:20px;color:var(--ac);font-weight:400}
  .toast{bottom:30px}
}

/* ── Telefono coricato ──────────────────────────── */
@media (max-height:520px) and (orientation:landscape) and (max-width:1079px){
  #top{padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:5px}
  .tab{padding:5px 2px 4px;font-size:9px}
  .tab b{font-size:15px;margin-bottom:0}
  .page{padding-top:12px}
}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE — interfaccia di gioco (specifica di Scacchi Arena)
   La tela resta a tutto schermo: si raccoglie solo l'HUD sopra.
   ═══════════════════════════════════════════════════════════════ */
@media (pointer:fine){
  #wcv{cursor:grab}
  #wcv:active{cursor:grabbing}
  #cv{cursor:pointer}
  #whud .wc,.nft,.seg button,.betrow button,.kindpick button,.lst .buy button{cursor:pointer}
  }
@media (min-width:720px){
  .nftgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  /* Panchine, mosse e barra comandi rientrano fino alla scacchiera centrata */
  .seat{padding-left:max(13px,calc((100% - 560px)/2));
        padding-right:max(13px,calc((100% - 560px)/2))}
  #gbar{padding-left:max(13px,calc((100% - 560px)/2));
        padding-right:max(13px,calc((100% - 560px)/2))}
  #moves{padding-left:max(13px,calc((100% - 560px)/2));
         padding-right:max(13px,calc((100% - 560px)/2))}
  #gmsg{font-size:19px}
  #gPlace{font-size:12px}
  /* Città: chip raccolti verso il centro, barre di comando centrate */
  #whud{left:max(14px,calc((100% - 900px)/2));right:max(14px,calc((100% - 900px)/2))}
  #whud .wc{font-size:12px;padding:6px 10px}
  #wprompt{left:50%;right:auto;transform:translateX(-50%);width:min(100% - 20px,640px)}
  #wcall{left:50%;right:auto;transform:translateX(-50%);width:min(100% - 20px,560px)}
}
@media (min-width:1080px){
  .nftgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

  coinSink:'sys:coinsink'
};

function bal(a){return DB.accounts[a]||0}

function post(type,ref,moves){
  let s=0;
  for(const m of moves) s+=m[1];
  if(Math.abs(s)>1e-6) throw new Error('Transazione sbilanciata: '+type+' → '+s.toFixed(6));
  const tx={id:'tx_'+(++DB.seq),type,ref:ref||null,at:now()};
  DB.txs.push(tx);
  if(DB.txs.length>400) DB.txs.splice(0,DB.txs.length-400);
  for(const [a,v] of moves){
    DB.accounts[a]=(DB.accounts[a]||0)+v;
    DB.entries.push({t:tx.id,a,v});
  }
  if(DB.entries.length>2500) DB.entries.splice(0,DB.entries.length-2500);
  if(DB.accounts[ACC.pSnk]<-1e-6) throw new Error('Saldo ◈ negativo');
  return tx;
}

/** Verifica l'invariante globale: la somma di TUTTI i conti è zero. */
function ledgerOk(){
  let s=0; for(const k in DB.accounts) s+=DB.accounts[k];
  return Math.abs(s)<1e-6;
}

const snk=()=>bal(ACC.pSnk), coins=()=>bal(ACC.pCoin);

function requestWithdraw(amt){

  let delay,label;
  if(amt<100){delay=0;label='istantaneo'}
  else if(amt<1000){delay=36e5;label='coda 1 ora'}
  else if(amt<10000){delay=DAY;label='coda 24 ore'}
  else{delay=DAY;label='revisione manuale + KYC'}
  const risk=riskScore();
  post('withdrawal_lock','w',[[ACC.pSnk,-amt],[ACC.ext,amt]]);
  DB.withdrawals.push({id:uid('w'),amt,at:now(),ready:now()+delay,label,risk,
    st:risk>70?'revisione':'in coda'});

  openWallet();
}

   5 · NFT ENGINE                        ← identico a Snake Royale
   ═══════════════════════════════════════════════════════════════ */
function mint(defId,src){
  const d=DEFS[defId];
  const n={id:uid('nft'),def:defId,cat:d.cat,rar:d.rar,
    dur:d.dur?d.dur:null,durMax:d.dur||null,
    at:now(),src:src||'mint',
    addr:'EQ'+fnv(defId+Math.random()).repeat(2)};
  DB.nfts.push(n); return n;
}
const owned=cat=>DB.nfts.filter(n=>!n.listed&&(!cat||n.cat===cat));
const nftById=id=>DB.nfts.find(n=>n.id===id);
const defOf=n=>DEFS[n.def];

/** Crafting: 3 NFT stessa rarità e categoria + token → 1 rarità superiore */
function craftables(){
  const out={};
  for(const n of owned()){
    if(n.rar==='leggendario')continue;
    const k=n.cat+'|'+n.rar; (out[k]=out[k]||[]).push(n);
  }
  return Object.entries(out).filter(([,v])=>v.length>=3);
}
function craftCost(rar){return Math.round(400*RAR[rar].k)}
function craft(cat,rar){
  const pool=owned().filter(n=>n.cat===cat&&n.rar===rar).slice(0,3);
  if(pool.length<3)return;
  const cost=craftCost(rar);
  if(cost>snk()){toast('◈ insufficienti');return}
  const up=RARORD[RARORD.indexOf(rar)+1];
  const cands=Object.keys(DEFS).filter(k=>DEFS[k].cat===cat&&DEFS[k].rar===up);
  if(!cands.length){toast('Nessuna ricetta disponibile');return}
  post('craft',cat,[[ACC.pSnk,-cost],[ACC.burn,cost]]);
  DB.eco.burned+=cost; DB.eco.sunk+=cost; DB.eco.weekSink+=cost;
  const ids=pool.map(n=>n.id);
  DB.nfts=DB.nfts.filter(n=>!ids.includes(n.id));
  if(ids.includes(DB.loadout.set))DB.loadout.set=null;
  const got=mint(cands[Math.floor(Math.random()*cands.length)],'craft');
  save(); closeModal();
  toast('Fusione riuscita → '+defOf(got).name+' ('+RAR[up].n+')');
  renderAll();
}

/* ── Il set è la chiave: senza, non si gioca ───────────────── */
const ownedSets=()=>DB.nfts.filter(n=>!n.listed&&n.cat==='set');
const hasSet=()=>ownedSets().length>0;

/** Il set attualmente in uso. Se quello equipaggiato non c'è più
 *  (venduto, fuso) ne prende un altro; se non ne resta nessuno
 *  torna null — e null significa "non puoi giocare". */
function activeSet(){
  const id=DB.loadout.set, n=id?nftById(id):null;
  if(n&&!n.listed)return n;
  const o=ownedSets();
  if(o.length){DB.loadout.set=o[0].id;return o[0]}
  DB.loadout.set=null; return null;
}
function setDef(){const n=activeSet();return n?DEFS[n.def]:DEFS.st_legno}

function equip(id){
  const n=nftById(id); if(!n||n.listed)return;
  DB.loadout.set=n.id; save(); renderInv();
  toast('Giochi con '+DEFS[n.def].name);
}

/** Superficie compatibile col resto del motore economico: gli NFT
 *  non danno più alcun bonus, quindi i moltiplicatori valgono zero. */
function loadoutMods(){
  const n=activeSet();
  return {set:n?n.def:'st_legno',earn:0,winEarn:0,mateEarn:0,fee:0,tickets:0,used:[]};
}
/* ═══════════════════════════════════════════════════════════════
   6 · MARKETPLACE                       ← identico a Snake Royale
   Listing a prezzo fisso, aste con anti-sniping, offerte.
   Royalty 5% al creator + fee 5% protocollo (metà bruciata).
   ═══════════════════════════════════════════════════════════════ */
const ROY=.05, FEE=.05;

function marketFee(){return Math.max(.01,FEE+loadoutMods().fee)}

function listNft(id,price,kind,hours){
  const n=nftById(id); if(!n||n.listed)return;
  if(DB.loadout.set===id)DB.loadout.set=null;
  n.listed=true;
  DB.market.listings.push({id:uid('lst'),nft:id,mine:true,price,kind:kind||'fixed',
    bid:kind==='auction'?Math.round(price*.6):null,bidder:null,
    ends:now()+(hours||24)*36e5,at:now()});
  save(); toast('Messo in vendita a '+nf(price)+' ◈'); renderAll();
}

function cancelListing(lid){
  const i=DB.market.listings.findIndex(l=>l.id===lid); if(i<0)return;
  const l=DB.market.listings[i];
  if(l.bidder==='me'){
    post('bid_refund',lid,[[ACC.mkt,-l.bid],[ACC.pSnk,l.bid]]);
  }
  const n=nftById(l.nft); if(n)n.listed=false;
  DB.market.listings.splice(i,1); save(); toast('Annullato'); renderAll();
}

function buyListing(lid){
  const l=DB.market.listings.find(x=>x.id===lid); if(!l)return;
  if(l.mine){toast('È già tuo');return}
  if(l.price>snk()){toast('◈ insufficienti');return}
  const fee=Math.round(l.price*marketFee()), roy=Math.round(l.price*ROY);
  const net=l.price-fee-roy, burn=Math.round(fee/2);
  post('market_buy',lid,[
    [ACC.pSnk,-l.price],[ACC.opp,net],[ACC.crea,roy],
    [ACC.burn,burn],[ACC.treas,fee-burn]
  ]);
  DB.eco.burned+=burn; DB.eco.sunk+=fee; DB.eco.weekSink+=fee;
  DB.stats.spent+=l.price;
  mint(l.defId,'market');
  DB.market.trades.unshift({at:now(),def:l.defId,price:l.price,side:'buy'});
  DB.market.listings=DB.market.listings.filter(x=>x.id!==lid);
  save(); closeModal(); toast('Comprato '+DEFS[l.defId].name); renderAll();
}

function placeBid(lid,amt){
  const l=DB.market.listings.find(x=>x.id===lid); if(!l||l.kind!=='auction')return;
  const min=Math.ceil((l.bid||0)*1.05)+1;
  if(amt<min){toast('Rilancio minimo '+nf(min)+' ◈');return}
  if(amt>snk()){toast('◈ insufficienti');return}
  if(l.bidder==='me') post('bid_refund',lid,[[ACC.mkt,-l.bid],[ACC.pSnk,l.bid]]);
  post('bid',lid,[[ACC.pSnk,-amt],[ACC.mkt,amt]]);
  l.bid=amt; l.bidder='me';
  if(l.ends-now()<18e4){l.ends=now()+18e4;toast('Rilancio accettato — asta estesa di 3 min')}
  else toast('Rilancio di '+nf(amt)+' ◈');
  save(); renderAll();
}

/** Bot di mercato: mantiene il mercato vivo fra una sessione e l'altra. */
function tickMarket(){
  const L=DB.market.listings;
  for(const l of [...L]){
    if(l.kind==='auction'&&now()>l.ends){
      if(l.bidder==='me'){
        const fee=Math.round(l.bid*marketFee()), roy=Math.round(l.bid*ROY);
        const burn=Math.round(fee/2);
        post('auction_win',l.id,[[ACC.mkt,-l.bid],[ACC.opp,l.bid-fee-roy],
          [ACC.crea,roy],[ACC.burn,burn],[ACC.treas,fee-burn]]);
        DB.eco.burned+=burn; DB.eco.sunk+=fee;
        mint(l.defId,'auction');
        toast('Asta vinta: '+DEFS[l.defId].name);
      } else if(l.mine&&l.bidder){
        const fee=Math.round(l.bid*marketFee()), roy=Math.round(l.bid*ROY);
        const burn=Math.round(fee/2);
        post('auction_sold',l.id,[[ACC.opp,-l.bid],[ACC.pSnk,l.bid-fee-roy],
          [ACC.crea,roy],[ACC.burn,burn],[ACC.treas,fee-burn]]);
        DB.eco.burned+=burn;
        DB.nfts=DB.nfts.filter(n=>n.id!==l.nft);
      } else if(l.mine){
        const n=nftById(l.nft); if(n)n.listed=false;
      }
      DB.market.listings=DB.market.listings.filter(x=>x.id!==l.id);
    }
  }
  for(const l of DB.market.listings){
    if(l.kind==='auction'&&l.bidder==='me'&&Math.random()<.25&&now()<l.ends-6e4){
      const up=Math.ceil(l.bid*(1.06+Math.random()*.12));
      post('bid_refund',l.id,[[ACC.mkt,-l.bid],[ACC.pSnk,l.bid]]);
      l.bid=up; l.bidder='bot';
      if(l.ends-now()<18e4) l.ends=now()+18e4;
    }
  }
  for(const l of [...DB.market.listings]){
    if(l.mine&&l.kind==='fixed'){
      const nn=nftById(l.nft);
      const d=DEFS[nn?nn.def:''];
      const fair=d?d.price:l.price;
      const p=l.price<=fair*1.1?.30:l.price<=fair*1.6?.10:.02;
      if(Math.random()<p){
        const fee=Math.round(l.price*marketFee()), roy=Math.round(l.price*ROY);
        const burn=Math.round(fee/2);
        post('market_sold',l.id,[[ACC.opp,-l.price],[ACC.pSnk,l.price-fee-roy],
          [ACC.crea,roy],[ACC.burn,burn],[ACC.treas,fee-burn]]);
        DB.eco.burned+=burn; DB.eco.sunk+=fee;
        DB.stats.earned+=l.price-fee-roy;
        DB.market.trades.unshift({at:now(),def:nn?nn.def:null,price:l.price,side:'sell'});
        DB.nfts=DB.nfts.filter(n=>n.id!==l.nft);
        DB.market.listings=DB.market.listings.filter(x=>x.id!==l.id);
        toast('Venduto! +'+nf(l.price-fee-roy)+' ◈');
      }
    }
  }
  const botL=DB.market.listings.filter(l=>!l.mine);
  while(botL.length<12){
    const l=genListing(); DB.market.listings.push(l); botL.push(l);
  }
  save();
}

function genListing(){
  const keys=Object.keys(DEFS).filter(k=>DEFS[k].price>0);
  const def=keys[Math.floor(Math.random()*keys.length)];
  const d=DEFS[def];
  const auction=Math.random()<.25;
  const jitter=.72+Math.random()*.7;
  const price=Math.round(d.price*jitter/10)*10;
  const dur=null, durAdj=price;
  return {id:uid('lst'),defId:def,mine:false,dur,
    kind:auction?'auction':'fixed',
    price:auction?Math.round(durAdj*.7):durAdj,
    bid:auction?Math.round(durAdj*.55):null,bidder:auction?'bot':null,
    ends:now()+(auction?(1+Math.random()*8)*36e5:72*36e5),at:now()};
}

function floorOf(cat){
  const ls=DB.market.listings.filter(l=>!l.mine&&l.kind==='fixed'&&DEFS[l.defId].cat===cat);
  return ls.length?Math.min(...ls.map(l=>l.price)):0;
}
/** Prezzo minimo a cui si trova un set di una certa rarità. */
function floorRar(rar){
  const ls=DB.market.listings.filter(l=>!l.mine&&l.kind==='fixed'&&DEFS[l.defId].rar===rar);
  return ls.length?Math.min(...ls.map(l=>l.price)):0;
}

   7 · I TRE MODI DI GIOCARE
   ─ Amichevole: nessuna posta, premi in Coins. Serve a imparare

   ─ Sfida: scegli TU quanto mettere sul tavolo. L'avversario copre
     la stessa cifra, il montepremi è la somma delle due quote meno

   ─ Sfida al buio: stessa cosa, ma ti siedi a un tavolo libero e
     non sai chi arriva. L'avversario viene pescato attorno al tuo
     rating con una banda larga: può essere un principiante o un
     mostro. Scopri chi era solo alla fine.
   ─ Torneo: si organizza a orario, ti iscrivi e vieni chiamato.
   ═══════════════════════════════════════════════════════════════ */
const KINDS={
  amichevole:{key:'amichevole',name:'Amichevole',cur:'COINS',rake:0,   icon:'♟',
    d:'Nessuna posta. Premi in Coins e XP.'},
  sfida:     {key:'sfida',     name:'Sfida',     cur:'ARC',  rake:.10, icon:'⚔',
    d:'Scegli quanto scommettere. Chi vince prende il piatto.'},
  buio:      {key:'buio',      name:'Sfida al buio',cur:'ARC',rake:.10,icon:'🎭',

  torneo:    {key:'torneo',    name:'Torneo',    cur:'ARC',  rake:.10, icon:'🏆',
    d:'Tabellone a eliminazione diretta, si viene chiamati a turno.'}
};
const isWager=k=>KINDS[k].cur==='ARC';

/* Compatibilità con il resto del motore (storico, replay, quest) */
const MODES=KINDS;

const TICKET_PRICE=600;
const TICKET_FREE=3;
const TICKET_MAX=12;

function ticketsLeft(){
  const d=Math.floor(now()/DAY);
  if(DB.tickets.date!==d){
    DB.tickets.date=d;
    DB.tickets.left=TICKET_FREE+loadoutMods().tickets;
    DB.tickets.bought=0; save();
  }
  return DB.tickets.left;
}
function ticketCost(){
  const n=DB.tickets.bought||0;
  return Math.round(TICKET_PRICE*(1+n*0.35));
}
function buyTicket(){
  const c=ticketCost();

  if(c>coins()){toast('Servono '+nf(c)+' ● Coins');return}

  DB.tickets.left++;
  save(); toast('Ticket comprato per '+nf(c)+' ● Coins'); renderAll();

/** ◈ → Coins, senso unico. È un sink puro: i token spesi si bruciano. */
function convertToCoins(amtSnk){
  if(amtSnk>snk()){toast('◈ insufficienti');return}
  const got=amtSnk*45;
  post('convert_arc_coins',null,[[ACC.pSnk,-amtSnk],[ACC.burn,amtSnk],
    [ACC.emis,-got],[ACC.pCoin,got]]);
  DB.eco.burned+=amtSnk; DB.eco.sunk+=amtSnk; DB.eco.weekSink+=amtSnk;
  save(); toast(nf(amtSnk)+' ◈ bruciati → '+nf(got)+' ● Coins'); renderAll();
}

/** Tetto di scommessa: cresce col livello, si sblocca del tutto con lo stake.
 *  Non è paternalismo: è il freno che impedisce a un nuovo account di
 *  bruciarsi tutto in dieci minuti, ed è anche un freno anti-riciclo. */
function maxBet(){
  const l=DB.player.level;
  let m=l>=8?1000:l>=5?400:l>=3?150:50;
  if(DB.player.stake>=2000)m=Math.max(m,5000);
  return m;
}
const betSteps=cap=>[5,10,25,50,100,250,500,1000,2500,5000].filter(v=>v<=cap);

/** Si può sedere? La prima domanda è sempre: hai gli scacchi? */
function canSit(placeKey,kind,bet){
  if(!hasSet())return{ok:false,why:'Non hai un set di pezzi: senza scacchi non puoi giocare',shop:true};
  const p=PLACES[placeKey];
  if(p&&p.req){
    if(DB.player.level<p.req.lvl)return{ok:false,why:'Serve il livello '+p.req.lvl};
    if(p.req.stake&&DB.player.stake<p.req.stake)
      return{ok:false,why:'Serve uno stake di '+nf(p.req.stake)+' ◈'};
  }
  if(kind==='amichevole')return{ok:true};
  const cap=Math.min(maxBet(),p?p.cap:maxBet());
  if(bet>cap)return{ok:false,why:'A questo tavolo il tuo massimo è '+nf(cap)+' ◈'};
  if(bet<5)return{ok:false,why:'La posta minima è 5 ◈'};
  if(bet>snk())return{ok:false,why:'Servono '+nf(bet)+' ◈'};
  return{ok:true};
}

/* ═══════════════════════════════════════════════════════════════
   8 · CURVA DEI PREMI  (§11.4 dell'architettura)
   Rispetto a Snake cambia SOLO questo file: la quota d'ingresso
   non è più fissa per fascia, la sceglie il giocatore. Il codice
   che paga è lo stesso — riceve un numero, non sa da dove venga.
   ═══════════════════════════════════════════════════════════════ */
const REWARD_CURVE={
  version:3, currency:'ARC',
  entry:{mode:'player_chosen',min:5,capByLevel:{1:50,3:150,5:400,8:1000},capWithStake:5000},
  rakeBps:1000, rakeSplit:{burn:4000,seasonReserve:3000,ops:2000,creators:1000},
  pools:[
    {key:'result',shareBps:9000,distribution:{win:10000,draw:5000,loss:0},
     onDraw:'absorb_mate_pool'},
    {key:'mate',  shareBps:1000,mode:'bonus_on_event',statKey:'checkmate',remainder:'burn'}
  ],
  bracket:{key:'tournament',size:8,payoutBps:{1:5000,2:2500,3:1250,4:1250}},
  modifiers:[
    {type:'blind_match',opponentHidden:true,mmrBand:280},
    {type:'diminishing',afterMatchesPerDay:25,decay:0.85}
  ],
  caps:{perPlayerPerDay:5000,perMatchMultipleOfEntry:12}
};
const RESULT_SHARE=.9, MATE_SHARE=.1;
const RES_DIST={win:1, draw:.5, loss:0};
const PLAYERS=2;

/** Premi in Coins: rubinetto libero. Più forte è l'avversario che
 *  affronti, più Coins valgono la vittoria e anche la resistenza. */
function coinPay(res,mate,elo){
  const k=clamp((elo-800)/1100,0,1.4);
  const base=Math.round(90+70*k);
  const win=Math.round(220+520*k);
  const draw=Math.round(90+220*k);
  const mb=Math.round(110+180*k);
  return {base,win,draw,mate:mb,
    tot:base+(res==='win'?win:res==='draw'?draw:0)+(mate?mb:0)};
}

/**
 * @param kind 'amichevole' | 'sfida' | 'buio' | 'torneo'
 * @param fee  quota d'ingresso scelta (0 per l'amichevole)
 * @param res  'win' | 'draw' | 'loss'
 */
function computePayout(kind,fee,res,mate,eco,elo){
  const K=KINDS[kind];
  if(K.cur==='COINS'){
    const c=coinPay(res,mate,elo||1000);
    let p=c.base+(res==='win'?c.win:res==='draw'?c.draw:0);
    let k=mate?c.mate:0;
    if(eco){p=Math.round(p*(1+eco.earn));k=Math.round(k*(1+eco.earn))}
    return {result:p,mate:k,fee:0,pool:0,dist:0,cur:'COINS'};
  }
  const pool=fee*PLAYERS, dist=pool*(1-K.rake);
  // Sulla patta il bonus-matto non esiste per nessuno dei due: invece di
  // bruciarlo si rimette in gioco, e i due si dividono l'intero piatto.
  // Altrimenti pattare costerebbe il 19% della posta, e negli scacchi
  // fra pari le patte sono la norma: sarebbe una tassa sulla bravura.
  let p=res==='draw'?Math.round(dist*.5)
                    :Math.round(dist*RESULT_SHARE*(RES_DIST[res]||0));
  let k=mate?Math.round(dist*MATE_SHARE):0;
  if(eco){
    if(res==='win')p=Math.round(p*(1+eco.winEarn));
    k=Math.round(k*(1+eco.mateEarn));
    p=Math.round(p*(1+eco.earn)); k=Math.round(k*(1+eco.earn));
  }
  return {result:p,mate:k,fee,pool,dist,cur:'ARC'};
}

/** Rendimenti decrescenti oltre 25 partite/giorno — anti-bot §13 */
function diminish(){
  const d=Math.floor(now()/DAY);
  if(DB.risk.date!==d){DB.risk.date=d;DB.risk.count=0}
  const n=DB.risk.count;
  return n<=25?1:Math.pow(.85,Math.min(20,n-25));
}
function riskScore(){
  let s=0;
  if(DB.risk.count>40)s+=35;
  if(DB.risk.count>70)s+=30;
  if(!DB.player.addr)s+=5;
  return Math.min(100,s);
}

const SUPPLY=1e9, K_FACTOR=.7, WEEK_CAP=2.4e6;
function governor(){
  const prevSink=DB.eco.hist.length?DB.eco.hist[DB.eco.hist.length-1].sink:DB.eco.weekSink;
  const allowed=Math.min(WEEK_CAP,K_FACTOR*Math.max(prevSink,1));
  return {allowed,used:DB.eco.weekMint,prevSink,
    ratio:DB.eco.weekMint?DB.eco.weekSink/DB.eco.weekMint:Infinity};
}

/* ═══════════════════════════════════════════════════════════════
   11 · MOTORE DI SCACCHI
   Rappresentazione 0x88: la scacchiera è un array di 128 caselle,
   di cui solo metà valide. Un indice è fuori dalla scacchiera se
   (sq & 0x88) è diverso da zero — un solo AND al posto di quattro
   confronti. Pezzi: 1=P 2=C 3=A 4=T 5=D 6=R, positivi = Bianco.

   Regole implementate per intero: arrocco (con diritti e caselle
   attaccate), presa en passant, promozione, scacco matto, stallo,
   regola delle 50 mosse, tripla ripetizione, materiale insufficiente.
   ═══════════════════════════════════════════════════════════════ */
const P=1,N=2,B=3,R=4,Q=5,K=6;
const NOFF=[33,31,18,14,-33,-31,-18,-14];
const KOFF=[16,-16,1,-1,17,15,-17,-15];
const BOFF=[17,15,-17,-15];
const ROFF=[16,-16,1,-1];
const FL_EP=1, FL_CAST=2, FL_DBL=4;

const mk=(f,t,pr,fl,cap)=>f|(t<<8)|((pr||0)<<16)|((fl||0)<<19)|((cap||0)<<22);
const mFrom=m=>m&0xFF, mTo=m=>(m>>8)&0xFF, mPr=m=>(m>>16)&7,
      mFl=m=>(m>>19)&7, mCap=m=>(m>>22)&7;

const FILES='abcdefgh';
const sqName=sq=>FILES[sq&7]+((sq>>4)+1);
const nameSq=s=>(FILES.indexOf(s[0]))|((+s[1]-1)<<4);
const idx64=sq=>(sq>>4)*8+(sq&7);

function newGame(){
  const b=new Int8Array(128);
  const back=[R,N,B,Q,K,B,N,R];
  for(let f=0;f<8;f++){
    b[f]=back[f]; b[16+f]=P;
    b[96+f]=-P;   b[112+f]=-back[f];
  }
  return {b,turn:1,cast:15,ep:-1,half:0,full:1,
    kSq:[4,116],undo:[],reps:{},log:[],san:[]};
}

function cloneState(s){
  const c={b:Int8Array.from(s.b),turn:s.turn,cast:s.cast,ep:s.ep,half:s.half,
    full:s.full,kSq:[s.kSq[0],s.kSq[1]],undo:[],reps:Object.assign({},s.reps),
    log:[...s.log],san:[...s.san]};
  return c;
}

/** La casella `sq` è attaccata da un pezzo del colore `by`? */
function attacked(s,sq,by){
  const b=s.b;
  if(by===1){
    let x=sq-17; if(!(x&0x88)&&b[x]===P)return true;
    x=sq-15;     if(!(x&0x88)&&b[x]===P)return true;
  }else{
    let x=sq+17; if(!(x&0x88)&&b[x]===-P)return true;
    x=sq+15;     if(!(x&0x88)&&b[x]===-P)return true;
  }
  for(let i=0;i<8;i++){const x=sq+NOFF[i]; if(!(x&0x88)&&b[x]===N*by)return true}
  for(let i=0;i<8;i++){const x=sq+KOFF[i]; if(!(x&0x88)&&b[x]===K*by)return true}
  for(let i=0;i<4;i++){
    let x=sq+BOFF[i];
    while(!(x&0x88)){const p=b[x];
      if(p){if(p===B*by||p===Q*by)return true;break}
      x+=BOFF[i];}
  }
  for(let i=0;i<4;i++){
    let x=sq+ROFF[i];
    while(!(x&0x88)){const p=b[x];
      if(p){if(p===R*by||p===Q*by)return true;break}
      x+=ROFF[i];}
  }
  return false;
}
const inCheck=(s,c)=>attacked(s,s.kSq[c>0?0:1],-c);

/** Mosse pseudo-legali. capsOnly = solo catture e promozioni (quiescenza). */
function genMoves(s,capsOnly){
  const b=s.b,c=s.turn,out=[];
  const promoRank=c>0?7:0, startRank=c>0?1:6, fwd=c>0?16:-16;
  for(let sq=0;sq<128;sq++){
    if(sq&0x88){sq+=7;continue}
    const p=b[sq];
    if(!p||(p>0)!==(c>0))continue;
    const t=Math.abs(p);
    if(t===P){
      const one=sq+fwd;
      if(!(one&0x88)&&!b[one]){
        if((one>>4)===promoRank){
          for(const pr of [Q,R,B,N])out.push(mk(sq,one,pr,0,0));
        }else if(!capsOnly){
          out.push(mk(sq,one,0,0,0));
          const two=sq+fwd*2;
          if((sq>>4)===startRank&&!b[two])out.push(mk(sq,two,0,FL_DBL,0));
        }
      }
      for(const d of (c>0?[15,17]:[-15,-17])){
        const x=sq+d; if(x&0x88)continue;
        const q=b[x];
        if(q&&(q>0)!==(c>0)){
          if((x>>4)===promoRank){for(const pr of [Q,R,B,N])out.push(mk(sq,x,pr,0,Math.abs(q)))}
          else out.push(mk(sq,x,0,0,Math.abs(q)));
        }else if(!q&&x===s.ep){
          out.push(mk(sq,x,0,FL_EP,P));
        }
      }
    }
    else if(t===N||t===K){
      const offs=t===N?NOFF:KOFF;
      for(let i=0;i<8;i++){
        const x=sq+offs[i]; if(x&0x88)continue;
        const q=b[x];
        if(q&&(q>0)===(c>0))continue;
        if(q)out.push(mk(sq,x,0,0,Math.abs(q)));
        else if(!capsOnly)out.push(mk(sq,x,0,0,0));
      }
    }
    else{
      const offs=t===B?BOFF:t===R?ROFF:BOFF.concat(ROFF);
      for(let i=0;i<offs.length;i++){
        let x=sq+offs[i];
        while(!(x&0x88)){
          const q=b[x];
          if(q){
            if((q>0)!==(c>0))out.push(mk(sq,x,0,0,Math.abs(q)));
            break;
          }
          if(!capsOnly)out.push(mk(sq,x,0,0,0));
          x+=offs[i];
        }
      }
    }
  }
  if(!capsOnly){
    // Arrocco: diritti intatti, caselle libere e re mai in transito sotto scacco
    const k=c>0?4:116, own=c>0?1:4, ownQ=c>0?2:8, rk=R*c;
    if((s.cast&own)&&b[k+1]===0&&b[k+2]===0&&b[k+3]===rk&&
       !attacked(s,k,-c)&&!attacked(s,k+1,-c)&&!attacked(s,k+2,-c))
      out.push(mk(k,k+2,0,FL_CAST,0));
    if((s.cast&ownQ)&&b[k-1]===0&&b[k-2]===0&&b[k-3]===0&&b[k-4]===rk&&
       !attacked(s,k,-c)&&!attacked(s,k-1,-c)&&!attacked(s,k-2,-c))
      out.push(mk(k,k-2,0,FL_CAST,0));
  }
  return out;
}

/* Diritti d'arrocco persi quando re/torre si muovono o la torre viene mangiata */
const CAST_MASK=(()=>{const m=new Int8Array(128).fill(15);
  m[0]&=~2; m[4]&=~3; m[7]&=~1; m[112]&=~8; m[116]&=~12; m[119]&=~4; return m})();

function make(s,m){
  const f=mFrom(m),t=mTo(m),fl=mFl(m),pr=mPr(m),b=s.b;
  const p=b[f],c=s.turn;
  let capSq=t,cap=b[t];
  if(fl&FL_EP){capSq=t-(c>0?16:-16);cap=b[capSq];b[capSq]=0}
  s.undo.push({m,cap,capSq,cast:s.cast,ep:s.ep,half:s.half,full:s.full});
  b[t]=pr?pr*c:p; b[f]=0;
  if(Math.abs(p)===K){
    s.kSq[c>0?0:1]=t;
    if(fl&FL_CAST){
      if(t>f){b[t-1]=b[t+1];b[t+1]=0}     // corto: la torre salta a sinistra del re
      else   {b[t+1]=b[t-2];b[t-2]=0}     // lungo
    }
  }
  s.cast&=CAST_MASK[f]&CAST_MASK[t];
  s.ep=(fl&FL_DBL)?f+(c>0?16:-16):-1;
  s.half=(Math.abs(p)===P||cap)?0:s.half+1;
  if(c<0)s.full++;
  s.turn=-c;
}

function unmake(s){
  const u=s.undo.pop(); if(!u)return;
  const m=u.m,f=mFrom(m),t=mTo(m),fl=mFl(m),pr=mPr(m),b=s.b;
  const c=-s.turn;
  b[f]=pr?P*c:b[t];
  b[t]=0;
  if(fl&FL_EP){b[u.capSq]=u.cap}
  else if(u.cap)b[t]=u.cap;
  if(Math.abs(b[f])===K){
    s.kSq[c>0?0:1]=f;
    if(fl&FL_CAST){
      if(t>f){b[t+1]=b[t-1];b[t-1]=0}
      else   {b[t-2]=b[t+1];b[t+1]=0}
    }
  }
  s.cast=u.cast; s.ep=u.ep; s.half=u.half; s.full=u.full; s.turn=c;
}

function legalMoves(s){
  const out=[];
  for(const m of genMoves(s,false)){
    make(s,m);
    if(!attacked(s,s.kSq[s.turn>0?1:0],s.turn))out.push(m);
    unmake(s);
  }
  return out;
}

/* ── Posizione, chiavi, FEN ─────────────────────────────────── */
const FEN_C='  PNBRQK';
function fen(s){
  let out='';
  for(let r=7;r>=0;r--){
    let empty=0;
    for(let f=0;f<8;f++){
      const p=s.b[r*16+f];
      if(!p){empty++;continue}
      if(empty){out+=empty;empty=0}
      const ch=FEN_C[Math.abs(p)+1];
      out+=p>0?ch:ch.toLowerCase();
    }
    if(empty)out+=empty;
    if(r)out+='/';
  }
  let cs='';
  if(s.cast&1)cs+='K'; if(s.cast&2)cs+='Q';
  if(s.cast&4)cs+='k'; if(s.cast&8)cs+='q';
  return out+' '+(s.turn>0?'w':'b')+' '+(cs||'-')+' '+(s.ep>=0?sqName(s.ep):'-');
}
const posKey=s=>fen(s);

function insufficient(s){
  const pieces=[];
  for(let sq=0;sq<128;sq++){
    if(sq&0x88){sq+=7;continue}
    const p=s.b[sq]; if(p&&Math.abs(p)!==K)pieces.push([Math.abs(p),sq,p>0?1:-1]);
  }
  if(!pieces.length)return true;                                  // R vs R
  if(pieces.length===1&&(pieces[0][0]===N||pieces[0][0]===B))return true; // R+C / R+A
  if(pieces.length===2&&pieces[0][0]===B&&pieces[1][0]===B&&
     pieces[0][2]!==pieces[1][2]){
    const c1=((pieces[0][1]>>4)+(pieces[0][1]&7))&1;
    const c2=((pieces[1][1]>>4)+(pieces[1][1]&7))&1;
    if(c1===c2)return true;                                       // alfieri stesso colore
  }
  return false;
}

/** Stato della partita dal punto di vista di chi deve muovere. */
function gameOver(s){
  const moves=legalMoves(s);
  if(!moves.length){
    if(inCheck(s,s.turn))return{over:true,res:s.turn>0?'black':'white',how:'matto'};
    return{over:true,res:'draw',how:'stallo'};
  }
  if(s.half>=100)return{over:true,res:'draw',how:'50 mosse'};
  if((s.reps[posKey(s)]||0)>=3)return{over:true,res:'draw',how:'tripla ripetizione'};
  if(insufficient(s))return{over:true,res:'draw',how:'materiale insufficiente'};
  return{over:false,moves};
}

/* ── Notazione ──────────────────────────────────────────────── */
const LET={1:'',2:'C',3:'A',4:'T',5:'D',6:'R'};
function toSan(s,m,legal){
  const f=mFrom(m),t=mTo(m),fl=mFl(m),pr=mPr(m);
  const p=Math.abs(s.b[f]);
  let san;
  if(fl&FL_CAST){san=t>f?'O-O':'O-O-O'}
  else{
    const cap=s.b[t]||(fl&FL_EP);
    if(p===P){
      san=(cap?FILES[f&7]+'x':'')+sqName(t)+(pr?'='+LET[pr]:'');
    }else{
      let dis='';
      for(const o of (legal||legalMoves(s))){
        if(o===m)continue;
        if(mTo(o)===t&&Math.abs(s.b[mFrom(o)])===p){
          dis=((mFrom(o)&7)!==(f&7))?FILES[f&7]:''+((f>>4)+1);
        }
      }
      san=LET[p]+dis+(cap?'x':'')+sqName(t);
    }
  }
  make(s,m);
  const chk=inCheck(s,s.turn);
  const none=chk&&!legalMoves(s).length;
  unmake(s);
  return san+(none?'#':chk?'+':'');
}
const toUci=m=>sqName(mFrom(m))+sqName(mTo(m))+(mPr(m)?'nbrq'[[N,B,R,Q].indexOf(mPr(m))]:'');
function fromUci(s,u){
  for(const m of legalMoves(s)) if(toUci(m)===u)return m;
  return 0;
}

/** Applica una mossa alla partita "vera": aggiorna ripetizioni e storico. */
function play(s,m){
  const legal=legalMoves(s);
  const san=toSan(s,m,legal);
  s.san.push(san);
  s.log.push(toUci(m));
  make(s,m);
  const k=posKey(s);
  s.reps[k]=(s.reps[k]||0)+1;
  return san;
}
/* ═══════════════════════════════════════════════════════════════
   12 · IL MOTORE AVVERSARIO
   Negamax con potatura alfa-beta, ordinamento delle mosse,
   ricerca di quiescenza (solo catture) e tabelle posizionali.
   La forza si regola con profondità + rumore + probabilità di
   svista: un avversario da 900 Elo deve sbagliare come un umano,
   non giocare a caso.

const VAL=[0,100,320,330,500,900,0];
const PST={

      5,-5,-10,0,0,-10,-5,5,
      5,10,10,-20,-20,10,10,5,

  2:[-50,-40,-30,-30,-30,-30,-40,-50,

     -30,5,10,15,15,10,5,-30,

     -50,-40,-30,-30,-30,-30,-40,-50],

     -10,0,0,0,0,0,0,-10,

     -10,5,5,10,10,5,5,-10,

     -10,5,0,0,0,0,5,-10,

const MATE=100000;

/** Valutazione statica, in centesimi di pedone, dal lato che muove. */
function evaluate(s){
  const b=s.b;
  let sc=0,phase=0,wb=0,bb=0;
  const wp=new Int8Array(8),bp=new Int8Array(8);
  for(let sq=0;sq<128;sq++){
    if(sq&0x88){sq+=7;continue}
    const p=b[sq]; if(!p)continue;
    const t=Math.abs(p),i=idx64(sq),f=sq&7,r=sq>>4;
    if(t!==K&&t!==P)phase+=VAL[t];
    if(t===B){if(p>0)wb++;else bb++}
    if(t===P){if(p>0)wp[f]++;else bp[f]++}
    if(t===K)continue;
    const pv=VAL[t]+PST[t][p>0?(7-r)*8+f:r*8+f];
    sc+=p>0?pv:-pv;
  }
  // Il re cambia tabella nel finale
  const endgame=phase<2600;
  for(const c of [1,-1]){
    const sq=s.kSq[c>0?0:1],f=sq&7,r=sq>>4;
    const v=PST[endgame?7:6][c>0?(7-r)*8+f:r*8+f];
    sc+=c>0?v:-v;
  }
  if(wb>=2)sc+=30; if(bb>=2)sc-=30;
  for(let f=0;f<8;f++){
    if(wp[f]>1)sc-=12*(wp[f]-1);
    if(bp[f]>1)sc+=12*(bp[f]-1);
    if(wp[f]&&!(f>0&&wp[f-1])&&!(f<7&&wp[f+1]))sc-=14;
    if(bp[f]&&!(f>0&&bp[f-1])&&!(f<7&&bp[f+1]))sc+=14;
  }
  return sc*s.turn;
}

const ENG={nodes:0,stop:false,deadline:0,killer:[]};

function orderScore(s,m,ply){
  const cap=mCap(m);
  if(cap)return 10000+cap*100-Math.abs(s.b[mFrom(m)]);
  if(mPr(m))return 9000+mPr(m);
  const k=ENG.killer[ply];
  if(k&&(m===k[0]||m===k[1]))return 8000;
  return 0;
}

function quiesce(s,alpha,beta){
  const stand=evaluate(s);
  if(stand>=beta)return beta;
  if(stand>alpha)alpha=stand;
  const caps=genMoves(s,true);
  caps.sort((a,b)=>orderScore(s,b,0)-orderScore(s,a,0));
  for(const m of caps){
    make(s,m);
    if(attacked(s,s.kSq[s.turn>0?1:0],s.turn)){unmake(s);continue}
    const v=-quiesce(s,-beta,-alpha);
    unmake(s);
    if(v>=beta)return beta;
    if(v>alpha)alpha=v;
  }
  return alpha;
}

function negamax(s,depth,alpha,beta,ply){
  if((++ENG.nodes&1023)===0&&now()>ENG.deadline)ENG.stop=true;
  if(ENG.stop)return 0;
  if(depth<=0)return quiesce(s,alpha,beta);
  const moves=genMoves(s,false);
  moves.sort((a,b)=>orderScore(s,b,ply)-orderScore(s,a,ply));
  let legal=0,best=-MATE*2;
  for(const m of moves){
    make(s,m);
    if(attacked(s,s.kSq[s.turn>0?1:0],s.turn)){unmake(s);continue}
    legal++;
    const v=-negamax(s,depth-1,-beta,-alpha,ply+1);
    unmake(s);
    if(ENG.stop)return 0;
    if(v>best)best=v;
    if(v>alpha)alpha=v;
    if(alpha>=beta){
      if(!mCap(m)){
        const k=ENG.killer[ply]||(ENG.killer[ply]=[0,0]);
        if(k[0]!==m){k[1]=k[0];k[0]=m}
      }
      return beta;
    }
  }
  if(!legal)return inCheck(s,s.turn)?-MATE+ply:0;
  if(s.half>=100)return 0;
  return best;
}

/** Ricerca a profondità crescente con limite di tempo. */
function think(state,maxDepth,timeMs){
  const s=cloneState(state);
  ENG.nodes=0; ENG.stop=false; ENG.deadline=now()+timeMs; ENG.killer=[];
  const roots=legalMoves(s);
  if(!roots.length)return{best:0,score:0,list:[]};
  let list=roots.map(m=>({m,sc:0}));
  for(let d=1;d<=maxDepth;d++){
    const cur=[];
    let alpha=-MATE*2;
    for(const {m} of list){
      make(s,m);
      const v=-negamax(s,d-1,-MATE*2,MATE*2,1);
      unmake(s);
      if(ENG.stop)break;
      cur.push({m,sc:v});
      if(v>alpha)alpha=v;
    }
    if(ENG.stop||cur.length<list.length)break;
    cur.sort((a,b)=>b.sc-a.sc);
    list=cur;
    if(Math.abs(list[0].sc)>MATE-100)break;   // matto trovato: inutile scavare
  }
  return{best:list[0].m,score:list[0].sc,list,nodes:ENG.nodes};
}

const BOOKODD=BOOK.slice(-4);

/** Mossa da repertorio, se la partita è ancora dentro una linea. */
function bookMove(s,st){
  if(s.log.length>=10)return 0;
  const pre=s.log.join(' ');
  const pool=(st&&st.odd&&Math.random()<.75)?BOOKODD:BOOK;
  const cand=[];
  for(const line of pool){
    if(!s.log.length||line.startsWith(pre+' ')){
      const parts=line.split(' ');
      if(parts.length>s.log.length)cand.push(parts[s.log.length]);
    }
  }
  if(!cand.length)return 0;
  const u=cand[Math.floor(Math.random()*cand.length)];
  return fromUci(s,u);
}

function givesCheck(s,m){
  make(s,m);
  const c=inCheck(s,s.turn);
  unmake(s);
  return c;
}

function botMove(state,skill,styleKey){
  const cfg=BOTS[clamp(skill,0,4)];
  const st=STYLES[styleKey]||STYLES.classico;
  const bm=bookMove(state,st);
  if(bm)return bm;
  const r=think(state,cfg.depth,Math.round(cfg.time*st.time));
  if(!r.list.length)return 0;
  // La svista umana: ogni tanto prende una mossa qualsiasi fra le migliori
  if(Math.random()<cfg.blunder*st.blunder&&r.list.length>1){
    const pool=r.list.slice(1,Math.min(r.list.length,6));
    return pool[Math.floor(Math.random()*pool.length)].m;
  }
  // Lo stile sposta i punteggi solo alla radice: la ricerca resta corretta,
  // cambia la preferenza fra mosse di valore simile.
  let best=r.best,bs=-Infinity;
  for(const e of r.list){
    let v=e.sc+(Math.random()*2-1)*cfg.noise*st.noise;
    if(mCap(e.m))v+=st.cap;
    if(st.quiet&&!mCap(e.m))v+=st.quiet;
    if((st.chk||0)!==0&&givesCheck(state,e.m))v+=st.chk;
    if(v>bs){bs=v;best=e.m}
  }
  return best;
}

  for(const [x,y,c] of [[170,760,'#c0563f'],[430,745,'#3f7bc0'],[760,760,'#c0a13f'],
                        [980,900,'#4fae72'],[180,1150,'#a05fc0'],[700,1350,'#c07a3f']]){
    prop('bancarella',x,y,c);solid(x-58,y-22,116,54);
  }
  for(let i=0;i<12;i++){const x=110+rnd()*940,y=760+rnd()*640;
    if(Math.hypot(560-x,1080-y)<150)continue;
    if(TABLES.some(t=>t.place==='piazza'&&Math.hypot(t.x-x,t.y-y)<120))continue;
    prop('cassa',x,y,11+rnd()*7,rnd());solid(x-14,y-11,28,24)}

  /* Terrazza */
  prop('mare',1180,470,0,120);
  solid(1160,420,840,180);
  const [tx,ty,tw,th]=PLACES.terrazza.rect;
  for(let x=tx+22;x<tx+tw-10;x+=46)prop('ringhiera',x,ty+16);
  solid(tx,ty,tw,18);
  prop('barca',1330,540,1);prop('barca',1700,505,-1);
  for(const [x,y] of [[1240,960],[1910,700],[1650,975]]){prop('botte',x,y);solid(x-16,y-12,32,26)}

  /* Sala d'Onore */
  const [sx,sy,sw,sh]=PLACES.sala.rect;
  prop('tappetoRosso',sx+sw/2,sy+sh/2,270,sh-40);
  for(let i=0;i<4;i++)for(const side of [-1,1]){
    const x=sx+sw/2+side*250,y=sy+80+i*92;
    prop('colonna',x,y,26);solid(x-24,y-14,48,36);
  }
  prop('candelabro',sx+sw/2,sy+52);
  WS_ROPE={x:sx+sw/2-95,y:sy-16,w:190,h:20};

  props.sort((a,b)=>a.y-b.y);
  return{props,solids};
}

function rect2(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function bakeWorld(props,s){
  s=s||1;
  const c=document.createElement('canvas');
  c.width=Math.round(WORLD.w*s); c.height=Math.round(WORLD.h*s);
  const x=c.getContext('2d');
  x.setTransform(s,0,0,s,0,0);   // il resto della funzione continua in unità mondo
  const rnd=mulberry32(99);

  x.fillStyle='#13200f'; x.fillRect(0,0,WORLD.w,WORLD.h);
  for(let i=0;i<1100;i++){
    x.fillStyle='rgba(255,255,255,'+(rnd()*.022)+')';
    x.fillRect(rnd()*WORLD.w,rnd()*WORLD.h,3+rnd()*7,2+rnd()*4);
  }
  const road=(a,b,w,h)=>{x.fillStyle='#39373a';x.fillRect(a,b,w,h);
    x.fillStyle='rgba(255,255,255,.045)';
    for(let i=0;i<w;i+=26)for(let j=0;j<h;j+=26)x.fillRect(a+i+2,b+j+2,22,22)};
  road(420,600,130,90);
  road(860,220,110,90);
  road(1090,900,110,300);
  road(1090,980,880,80);
  road(1500,1040,90,40);

  for(const k in PLACES){
    const p=PLACES[k],[px,py,pw,ph]=p.rect;
    x.fillStyle=p.floor; x.fillRect(px,py,pw,ph);
    if(k==='piazza'){
      for(let i=0;i<pw;i+=34)for(let j=0;j<ph;j+=34){
        x.fillStyle=rnd()<.5?p.floor2:p.floor;
        rect2(x,px+i+2,py+j+2,30,30,7); x.fill();
      }
    }else if(k==='circolo'||k==='terrazza'){
      for(let j=0;j<ph;j+=26){
        x.fillStyle=(j/26)%2?p.floor2:p.floor;
        x.fillRect(px,py+j,pw,26);
        x.strokeStyle='rgba(0,0,0,.2)';x.lineWidth=1;
        x.beginPath();x.moveTo(px,py+j+.5);x.lineTo(px+pw,py+j+.5);x.stroke();
      }
    }else if(k==='sala'){
      for(let i=0;i<pw;i+=88)for(let j=0;j<ph;j+=88){
        x.fillStyle=(i/88+j/88)%2?p.floor2:p.floor;
        x.fillRect(px+i,py+j,88,88);
        x.strokeStyle='rgba(245,196,81,.10)';x.lineWidth=1;
        x.strokeRect(px+i+.5,py+j+.5,88,88);
      }
    }else{
      for(let i=0;i<240;i++){
        x.fillStyle='rgba(120,190,110,'+(rnd()*.05)+')';
        x.beginPath();x.ellipse(px+rnd()*pw,py+rnd()*ph,18+rnd()*40,10+rnd()*22,rnd()*3,0,7);x.fill();
      }
    }
    x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=3;x.strokeRect(px,py,pw,ph);
  }

  const [wx,wy,ww,wh]=PLACES.circolo.rect;
  x.fillStyle='#2a1e14';
  x.fillRect(wx-14,wy-14,ww+28,22); x.fillRect(wx-14,wy+wh-8,ww+28,22);
  x.fillRect(wx+ww-8,wy,22,wh);
  x.fillRect(wx-14,wy,22,wh*0.52); x.fillRect(wx-14,wy+wh*0.76,22,wh*0.26);
  x.fillStyle='rgba(245,196,81,.18)';
  x.fillRect(wx-14,wy+wh*0.52,22,wh*0.24);

  for(const p of props)drawProp(x,p);
  return c;
}

function drawChar(x,px,py,col,bob,sitting,facing){
  x.fillStyle='rgba(0,0,0,.34)';
  x.beginPath();x.ellipse(px,py+13,13,5,0,0,7);x.fill();
  const b=sitting?0:bob;
  x.fillStyle=col;
  rect2(x,px-9,py-14+b,18,20,7); x.fill();
  x.fillStyle='#e8c9a8';
  x.beginPath();x.arc(px,py-20+b,8.5,0,7);x.fill();
  x.fillStyle='rgba(0,0,0,.55)';
  x.beginPath();x.arc(px,py-24+b,8.5,Math.PI*1.05,Math.PI*1.95);x.fill();
  if(facing){ // occhi, per capire dove guarda
    x.fillStyle='#12181f';
    x.beginPath();x.arc(px-3+facing*1.5,py-19+b,1.4,0,7);x.fill();
    x.beginPath();x.arc(px+3+facing*1.5,py-19+b,1.4,0,7);x.fill();
  }
}

function drawTable(x,t,near,t0){
  const pl=PLACES[t.place],tb=pl.tbl;
  const busy=DB.tourney&&DB.tourney.tableId===t.id;
  x.fillStyle='rgba(0,0,0,.36)';
  x.beginPath();x.ellipse(t.x,t.y+22,42,15,0,0,7);x.fill();
  // sgabelli
  x.fillStyle='#4a3c2c'; x.strokeStyle='rgba(0,0,0,.5)'; x.lineWidth=2;
  x.beginPath();x.arc(t.x,t.y+36,11,0,7);x.fill();x.stroke();
  x.beginPath();x.arc(t.x,t.y-38,11,0,7);x.fill();x.stroke();
  // gambe e piano
  x.fillStyle=tb.frame;
  x.fillRect(t.x-30,t.y+4,7,18); x.fillRect(t.x+23,t.y+4,7,18);
  rect2(x,t.x-38,t.y-30,76,52,9); x.fill();
  x.strokeStyle='rgba(255,255,255,.22)'; x.lineWidth=2; x.stroke();
  // scacchiera incisa nel piano
  const c0=t.x-30,r0=t.y-24,cs=7.5;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    x.fillStyle=(i+j)%2?tb.d:tb.l;
    x.fillRect(c0+i*cs,r0+j*cs*.82,cs,cs*.82);
  }
  // qualche pezzo lasciato sul tavolo
  x.fillStyle='rgba(0,0,0,.5)';
  x.font='11px '+PFONT; x.textAlign='center'; x.textBaseline='middle';
  x.fillText('♟',c0+cs*2.5,r0+cs*4.9); x.fillText('♞',c0+cs*5.5,r0+cs*2.5);
  if(t.npc){
    drawChar(x,t.x,t.y-46,t.npc.c,0,true,1);
  }else{
    // tavolo libero: la sedia vuota e il punto interrogativo
    x.fillStyle='rgba(10,14,19,.75)';
    x.beginPath();x.arc(t.x,t.y-46,13,0,7);x.fill();
    x.strokeStyle=near?'rgba(245,196,81,.9)':'rgba(139,155,176,.5)';
    x.lineWidth=2; x.stroke();
    x.fillStyle=near?'#f5c451':'rgba(200,212,228,.8)';
    x.font='bold 15px -apple-system,sans-serif';
    x.textAlign='center'; x.textBaseline='middle';
    x.fillText('?',t.x,t.y-45);
  }
  if(busy){
    x.strokeStyle='rgba(245,196,81,.9)';x.lineWidth=3;
    x.beginPath();x.arc(t.x,t.y-4,52+Math.sin(t0/260)*3,0,7);x.stroke();
  }
  if(near){
    x.strokeStyle='rgba(45,212,191,.85)';x.lineWidth=2.5;
    x.beginPath();x.ellipse(t.x,t.y+22,50,18,0,0,7);x.stroke();
  }
}

/* k compensa lo zoom: 1 su telefono, ~0.81 su tablet, ~0.69 su PC.
   Non lo annulla del tutto (sarebbe 1/z): le targhette restano legate
   alla scena ma a schermo passano da 11px a ~15px invece che a 22px. */
function label(x,px,py,txt,sub,col,k){
  k=k||1;
  x.font='bold '+(11*k).toFixed(1)+'px -apple-system,sans-serif';
  const w=Math.max(x.measureText(txt).width,sub?x.measureText(sub).width:0)+16*k;
  const h=(sub?30:19)*k;
  x.fillStyle='rgba(10,14,19,.82)';
  rect2(x,px-w/2,py-h,w,h,7*k);x.fill();
  x.strokeStyle='rgba(31,42,58,.9)';x.lineWidth=Math.max(.6,k);x.stroke();
  x.fillStyle=col||'#e8eef7';x.textAlign='center';x.textBaseline='middle';
  x.fillText(txt,px,py-h+10*k);
  if(sub){x.font=(10*k).toFixed(1)+'px -apple-system,sans-serif';x.fillStyle='#8b9bb0';
    x.fillText(sub,px,py-h+23*k)}
}
