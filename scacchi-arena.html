        tx:null,ty:null,keys:{},near:null,pending:null,zone:null,
        cam:{x:0,y:0},camSnap:true,t0:0,leaves:[],last:0,anim:0,face:1,
        zoom:1,dpr:1,vw:360,vh:520,vwW:360,vhW:520,pid:null};
    for(let i=0;i<26;i++)WS.leaves.push({x:Math.random()*860,y:Math.random()*600,
      s:.4+Math.random()*.8,r:Math.random()*7});
  }
  WS.ctx=cv.getContext('2d');
  WS.cv=cv;
  worldResize();   // calcola lo zoom e, tramite ensureBg(), cuoce il fondale giusto
  // Se la tela non era ancora misurata (pagina appena aperta, o incorniciata
  // da un'altra pagina) worldResize esce subito e il fondale resta da cuocere:
  // qui si garantisce che esista comunque, alla scala di base.
  if(!WS.bg){WS.bg=bakeWorld(WS.props,1);WS.bgS=1}
  if(!WS.raf)WS.raf=requestAnimationFrame(worldFrame);
}
function stopWorld(){
  if(WS&&WS.raf){cancelAnimationFrame(WS.raf);WS.raf=0}
  if(WS&&DB){DB.world.x=Math.round(WS.px);DB.world.y=Math.round(WS.py);save()}
}
/* ═══ Zoom adattivo del mondo ═══
   La città è 2000x1500. A 1:1 un telefono ne vede 390x600 (il 4%),
   un PC 1440x760 (il 36%): stessa città, due giochi diversi. Il
   criterio non è "quanti pixel ho" ma "che frazione dello schermo
   occupa il personaggio": deve restare intorno al 5-8% dell'altezza.
     390x600  -> 1.00   (telefono: identico a prima, pixel per pixel)
     780x330  -> 1.11   (telefono coricato)
     768x950  -> 1.40   (tablet)
     1280x760 -> 1.58   1920x1000 -> 1.97   2560x1300 -> 2.05 (tetto) */
const REF_DIAG=Math.hypot(390,680);   // tela del mondo su un telefono tipico: lì lo zoom vale 1
const ZOOM_MIN=.85, ZOOM_MAX=2.05, ZOOM_EXP=.62;
function baseZoom(w,h){
  return clamp(Math.pow(Math.hypot(w,h)/REF_DIAG,ZOOM_EXP),ZOOM_MIN,ZOOM_MAX);
}
/* Il fondale è cotto a un pixel per unità di mondo: con zoom 2 ogni
   pixel verrebbe stirato al doppio. Si ricuoce più grande, ma con un
   tetto: 1.5 → 3000x2250, circa 27 MB. Mai su telefono (scala 1). */
const BG_MAX_S=1.5;
const bgScaleFor=z=>clamp(Math.round(z*5)/5,1,BG_MAX_S);
function ensureBg(){
  const s=bgScaleFor(WS.zoom);
  if(WS.bg&&WS.bgS>=s-1e-6)return;
  if(!WS.bg){WS.bg=bakeWorld(WS.props,s);WS.bgS=s;return}
  clearTimeout(WS.bgT);                    // ricuocere costa 40-80ms: con calma
  WS.bgT=setTimeout(()=>{
    if(!WS)return;
    const s2=bgScaleFor(WS.zoom);
    if(WS.bgS>=s2-1e-6)return;
    WS.bg=bakeWorld(WS.props,s2); WS.bgS=s2;
  },200);
}
function worldResize(){
  const cv=$(wcvId); if(!cv||!WS)return;
  const w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h)return;                        // pagina nascosta: non sporcare lo stato
  const r=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*r); cv.height=Math.round(h*r);
  WS.cv=cv; WS.vw=w; WS.vh=h; WS.dpr=r;

  const zFit=Math.max(w/WORLD.w,h/WORLD.h);   // sotto questo si vedrebbe oltre i bordi
  WS.zoom=clamp(baseZoom(w,h),zFit,ZOOM_MAX);
  WS.vwW=w/WS.zoom; WS.vhW=h/WS.zoom;         // inquadratura in UNITÀ MONDO
  WS.spd=168*clamp(Math.pow(WS.vwW/390,.45),1,1.9);  // schermo più largo, passo più lungo
  WS.lblK=clamp(Math.pow(1/WS.zoom,.55),.55,1.15);   // etichette quasi costanti a schermo
  WS.lblR=250*clamp(WS.vwW/390,1,2.2);               // fin dove si leggono i nomi
  WS.camSnap=true;
  ensureBg();
  WS.ctx.imageSmoothingEnabled=true;
}

function ropeClosed(){
  return !(DB.player.level>=PLACES.sala.req.lvl&&DB.player.stake>=PLACES.sala.req.stake);
}
function hitsSolid(x,y){
  const r=11;
  for(const s of WS.solids)
    if(x+r>s.x&&x-r<s.x+s.w&&y+r>s.y&&y-r<s.y+s.h)return true;
  for(const t of TABLES)
    if(Math.abs(x-t.x)<40&&Math.abs(y-t.y)<32)return true;
  if(WS_ROPE&&ropeClosed()){
    const s=WS_ROPE;
    if(x+r>s.x&&x-r<s.x+s.w&&y+r>s.y&&y-r<s.y+s.h)return true;
  }
  return false;
}
function zoneAt(x,y){
  for(const k in PLACES){
    const [px,py,pw,ph]=PLACES[k].rect;
    if(x>px&&x<px+pw&&y>py&&y<py+ph)return k;
  }
  return null;
}

function worldFrame(ts){
  if(!WS){return}
  WS.raf=requestAnimationFrame(worldFrame);
  const dt=Math.min(50,ts-(WS.last||ts)); WS.last=ts; WS.t0=ts;
  worldStep(dt/1000);
  worldDraw(ts);
}

function worldStep(dt){
  let dx=0,dy=0;
  const k=WS.keys;
  if(k.ArrowLeft||k.a)dx-=1; if(k.ArrowRight||k.d)dx+=1;
  if(k.ArrowUp||k.w)dy-=1; if(k.ArrowDown||k.s)dy+=1;
  if(dx||dy){WS.tx=null;WS.ty=null;WS.pending=null}
  else if(WS.tx!==null){
    const ax=WS.tx-WS.px, ay=WS.ty-WS.py;
    const d=Math.hypot(ax,ay);
    if(d<6){WS.tx=null;WS.ty=null}
    else{dx=ax/d;dy=ay/d}
  }
  const sp=(WS.spd||168)*dt;
  const len=Math.hypot(dx,dy)||1;
  const nx=WS.px+dx/len*sp, ny=WS.py+dy/len*sp;
  if(dx||dy){
    if(!hitsSolid(nx,WS.py))WS.px=nx;
    if(!hitsSolid(WS.px,ny))WS.py=ny;
    WS.anim+=dt*9;
    if(dx)WS.face=dx>0?1:-1;
  }else WS.anim=0;
  WS.px=clamp(WS.px,20,WORLD.w-20); WS.py=clamp(WS.py,20,WORLD.h-20);

  /* Telecamera: qui e non in worldDraw perché qui c'è dt, così la
     morbidezza non dipende dai fotogrammi al secondo. */
  {const vwW=WS.vwW||WS.vw, vhW=WS.vhW||WS.vh;
   const gx=clamp(WS.px-vwW/2,0,Math.max(0,WORLD.w-vwW));
   const gy=clamp(WS.py-vhW/2,0,Math.max(0,WORLD.h-vhW));
   if(WS.camSnap){WS.cam.x=gx;WS.cam.y=gy;WS.camSnap=false}
   else{
     const f=1-Math.pow(.0016,dt);          // costante di tempo ~150ms
     WS.cam.x+=(gx-WS.cam.x)*f; WS.cam.y+=(gy-WS.cam.y)*f;
     if(Math.abs(gx-WS.cam.x)<.05)WS.cam.x=gx;
     if(Math.abs(gy-WS.cam.y)<.05)WS.cam.y=gy;
   }}

  // zona corrente
  const z=zoneAt(WS.px,WS.py);
  if(z!==WS.zone){
    WS.zone=z;
    if(z){
      const p=PLACES[z];
      $('#wzone').innerHTML=p.name+'<small>'+p.tag+'</small>';
      $('#wzone').classList.add('on');
      clearTimeout(WS.zt); WS.zt=setTimeout(()=>$('#wzone').classList.remove('on'),2200);
      if(!DB.world.seen[z]){DB.world.seen[z]=now();save()}
    }
    updateWorldHud();
  }

  // interazione più vicina
  let best=null,bd=86;
  for(const t of TABLES){
    const d=Math.hypot(t.x-WS.px,t.y-WS.py);
    if(d<bd){bd=d;best={type:'table',ref:t}}
  }
  for(const s of SPOTS){
    const d=Math.hypot(s.x-WS.px,s.y-WS.py);
    if(d<bd){bd=d;best={type:'spot',ref:s}}
  }
  const changed=(best&&best.ref.id)!==(WS.near&&WS.near.ref.id);
  WS.near=best;
  if(changed)updatePrompt();
  if(WS.pending&&best&&best.ref.id===WS.pending){
    const p=WS.pending; WS.pending=null; WS.tx=null; WS.ty=null;
    interact();
  }
}

function worldDraw(ts){
  if(!WS||!WS.ctx||!WS.cv)return;
  if(!WS.bg){ worldResize(); if(!WS.bg){WS.bg=bakeWorld(WS.props,1);WS.bgS=1} }
  const x=WS.ctx, z=WS.zoom||1, r=WS.dpr||1;
  const vw=WS.vwW||WS.vw, vh=WS.vhW||WS.vh;   // unità mondo
  const cx=WS.cam.x, cy=WS.cam.y;             // la telecamera la calcola worldStep
  const kk=WS.lblK||1, LR=WS.lblR||250;
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,WS.cv.width,WS.cv.height);
  x.setTransform(r*z,0,0,r*z,0,0);            // dpr × zoom: da qui in giù tutto è in unità mondo
  x.save(); x.translate(-cx,-cy);
  {const s=WS.bgS||1;
   const sx=Math.max(0,cx), sy=Math.max(0,cy);
   const sw=Math.min(WORLD.w-sx,vw), sh=Math.min(WORLD.h-sy,vh);
   if(sw>0&&sh>0)x.drawImage(WS.bg,sx*s,sy*s,sw*s,sh*s,sx,sy,sw,sh);}

  // mare animato
  if(cx<1980&&cy<640){
    x.strokeStyle='rgba(232,238,247,.13)';x.lineWidth=2;
    for(let i=0;i<9;i++){
      const yy=380+i*24+Math.sin(ts/900+i)*4;
      x.beginPath();
      for(let px2=1160;px2<WORLD.w;px2+=40)
        x.lineTo(px2,yy+Math.sin((px2+ts/6)/60+i)*3);
      x.stroke();
    }
  }
  // fontana
  {const fx=560,fy=1080;
   x.strokeStyle='rgba(232,238,247,.2)';x.lineWidth=2;
   for(let i=0;i<3;i++){
     const rr=((ts/12+i*90)%150)/150;
     x.globalAlpha=.5*(1-rr);
     x.beginPath();x.arc(fx,fy,10+rr*62,0,7);x.stroke();
   }
   x.globalAlpha=1;
   x.fillStyle='rgba(200,235,245,.75)';
   for(let i=0;i<7;i++){
     const a=ts/300+i;
     x.beginPath();x.arc(fx+Math.cos(a)*14,fy-26+Math.abs(Math.sin(a))*-14,2.2,0,7);x.fill();
   }}
  // foglie nel parco
  x.fillStyle='rgba(160,200,120,.5)';
  for(const l of WS.leaves){
    l.x+=Math.sin(ts/1600+l.r)*.35+.25; l.y+=l.s*.28;
    if(l.y>600){l.y=40;l.x=60+Math.random()*780}
    x.beginPath();x.ellipse(60+l.x%780,40+l.y%560,2.6,1.5,l.r+ts/2400,0,7);x.fill();
  }

  // cordone della Sala d'Onore
  if(WS_ROPE){
    const closed=ropeClosed();
    x.strokeStyle=closed?'#8a1c1c':'rgba(74,222,128,.5)';
    x.lineWidth=5;
    x.beginPath();
    x.moveTo(WS_ROPE.x,WS_ROPE.y+10);
    x.quadraticCurveTo(WS_ROPE.x+WS_ROPE.w/2,WS_ROPE.y+24,WS_ROPE.x+WS_ROPE.w,WS_ROPE.y+10);
    x.stroke();
    x.fillStyle='#f5c451';
    x.fillRect(WS_ROPE.x-4,WS_ROPE.y-6,8,34);
    x.fillRect(WS_ROPE.x+WS_ROPE.w-4,WS_ROPE.y-6,8,34);
    if(closed){
      x.fillStyle='rgba(239,90,90,.9)';x.font='bold 10px -apple-system,sans-serif';
      x.textAlign='center';
      x.fillText('LIV. 8 + STAKE',WS_ROPE.x+WS_ROPE.w/2,WS_ROPE.y-12);
    }
  }

  // oggetti ordinati per profondità
  const ents=[];
  for(const t of TABLES)ents.push({y:t.y,d:()=>drawTable(x,t,WS.near&&WS.near.ref.id===t.id,ts)});
  for(const s of SPOTS)ents.push({y:s.y,d:()=>drawSpot(x,s,WS.near&&WS.near.ref.id===s.id,ts)});
  ents.push({y:WS.py,d:()=>drawChar(x,WS.px,WS.py,'#2dd4bf',
    Math.sin(WS.anim)*1.6,false,WS.face)});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents)e.d();

  // etichette: raggio e corpo seguono la finestra
  for(const t of TABLES){
    if(Math.hypot(t.x-WS.px,t.y-WS.py)>LR)continue;
    if(t.npc)label(x,t.x,t.y-64,t.npc.name,t.npc.elo+' Elo · '+STYLES[t.npc.style].n,t.npc.c,kk);
    else label(x,t.x,t.y-64,'Tavolo libero','sfida al buio','#f5c451',kk);
  }
  for(const s of SPOTS){
    if(Math.hypot(s.x-WS.px,s.y-WS.py)>LR)continue;
    label(x,s.x,s.y-(s.t==='albo'?62:34),s.label,
      s.t==='albo'?'tocca per iscriverti':'compra e vendi set','#e8eef7',kk);
  }
  label(x,WS.px,WS.py-34,'TU',DB.player.mmr+' Elo','#2dd4bf',kk);
  x.restore();
}
/* ── Comandi del mondo: camminare, avvicinarsi, sedersi ────── */
/* Con lo zoom la conversione 1:1 sbaglierebbe sempre di più man mano
   che ci si allontana dal centro: qui si divide per WS.zoom. A zoom 1
   la formula si riduce esattamente a quella di prima. */
function worldPoint(ev){
  const cv=WS.cv||$(wcvId), r=cv.getBoundingClientRect();
  const sx=r.width?WS.vw/r.width:1, sy=r.height?WS.vh/r.height:1;
  const z=WS.zoom||1;
  return {x:(ev.clientX-r.left)*sx/z+WS.cam.x,
          y:(ev.clientY-r.top )*sy/z+WS.cam.y};
}
/* Le scatole di tocco restano in unità mondo: scalano col disegno,
   quindi il bersaglio è sempre grande quanto il tavolo che si vede. */
function worldHit(p){
  for(const t of TABLES)if(Math.abs(p.x-t.x)<46&&p.y>t.y-70&&p.y<t.y+44)return{type:'table',ref:t};
  for(const s of SPOTS) if(Math.abs(p.x-s.x)<38&&p.y>s.y-60&&p.y<s.y+30)return{type:'spot',ref:s};
  return null;
}
function worldDown(ev){
  if(!WS)return;
  if(ev.button===2||ev.button===1){WS.tx=null;WS.ty=null;WS.pending=null;WS.drag=false;return}
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  ev.preventDefault();
  const c=WS.cv||$(wcvId);
  if(c&&c.setPointerCapture&&ev.pointerId!=null){try{c.setPointerCapture(ev.pointerId)}catch(e){}}
  WS.pid=ev.pointerId; WS.drag=true;
  const p=worldPoint(ev);
  const hit=worldHit(p);
  if(hit){
    WS.pending=hit.ref.id;
    WS.tx=hit.ref.x; WS.ty=hit.ref.y+58;
    if(Math.hypot(hit.ref.x-WS.px,hit.ref.y-WS.py)<86){
      WS.pending=null;WS.tx=null;WS.ty=null;WS.near=hit;WS.drag=false;interact();
    }
    return;
  }
  WS.tx=p.x; WS.ty=p.y; WS.pending=null;
}
function worldMove(ev){
  if(!WS)return;
  if(WS.drag&&ev.pointerId===WS.pid){
    if(WS.pending)return;
    const p=worldPoint(ev);
    WS.tx=p.x; WS.ty=p.y;
    return;
  }
  if(ev.pointerType!=='mouse')return;             // il cursore cambia solo col mouse
  const c=WS.cv||$(wcvId); if(!c)return;
  c.style.cursor=worldHit(worldPoint(ev))?'pointer':'';
}
function worldUp(ev){
  if(!WS)return;
  WS.drag=false;
  const c=WS.cv||$(wcvId);
  if(c&&ev&&ev.pointerId!=null&&c.releasePointerCapture){
    try{c.releasePointerCapture(ev.pointerId)}catch(e){}
  }
  WS.pid=null;
}

function updatePrompt(){
  const el=$('#wprompt'); if(!el)return;
  const n=WS&&WS.near;
  if(!n){el.classList.remove('on');return}
  let ic,tit,sub;
  if(n.type==='table'){
    const t=n.ref,pl=PLACES[t.place];
    if(t.npc){ic='♟';tit=t.npc.name+' · '+t.npc.elo+' Elo';
      sub=t.npc.line}
    else{ic='🎭';tit='Tavolo libero';
      sub='Ti siedi senza sapere chi arriva · fino a '+nf(Math.min(maxBet(),pl.cap))+' ◈'}
  }else if(n.ref.t==='albo'){
    const T=TOURS[n.ref.tour];
    ic='🏆';tit=T.name;
    sub=DB.tourney&&DB.tourney.id===T.id?'sei iscritto · inizia fra '+fmtLeft(DB.tourney.startsAt-now())
      :'iscrizione '+(T.entry.cur==='TICKET'?'1 🎟':nf(T.entry.v)+' ◈')+' · fra '+fmtLeft(tourCountdown(T));
  }else{ic='🛒';tit='Mercante di scacchi';sub='Compra o vendi i tuoi set'}
  el.innerHTML='<div class="ic">'+ic+'</div><div class="tx"><b>'+tit+'</b><span>'+sub+'</span></div>'+
    '<button class="btn sm" onclick="__app.interact()">'+
    (n.type==='table'?'SIEDITI':n.ref.t==='albo'?'APRI':'ENTRA')+'</button>';
  el.classList.add('on');
}

function interact(){
  const n=WS&&WS.near; if(!n)return;
  if(n.type==='table')openTable(n.ref.id);
  else if(n.ref.t==='albo')openTour(n.ref.tour);
  else go('mkt');
}

function updateWorldHud(){
  const h=$('#whud'); if(!h)return;
  const t=DB.tourney&&!DB.tourney.done?DB.tourney:null;
  const tour=t?(t.round?'Turno '+t.round:'inizia fra '+fmtLeft(t.startsAt-now())):null;
  h.innerHTML=
    '<div class="wc"><small>Liv</small>'+DB.player.level+'</div>'+
    '<div class="wc ac"><small>Elo</small>'+DB.player.mmr+'</div>'+
    '<div class="wc gold"><small>Ticket</small>'+ticketsLeft()+'</div>'+
    (tour?'<div class="wc gold"><small>Torneo</small>'+tour+'</div>':'')+
    '<div class="sp"></div>'+
    '<button class="wc" onclick="__app.profile()">☰ Profilo</button>';
}

/* ═══════════════════════════════════════════════════════════════
   16 · TORNEI
   Non si giocano quando vuoi: si organizzano. Il cartellone dice
   quando, ti iscrivi pagando, e all'ora esatta parte il tabellone.
   Poi vieni chiamato: turno per turno, con un minuto per presentarti
   al tavolo. Se non ti presenti, perdi a tavolino — come nella vita.
   ═══════════════════════════════════════════════════════════════ */
const TOURS={
  tp:{id:'tp',place:'parco',name:'Torneo del Parco',tableId:'tb1',
      entry:{cur:'TICKET',v:1},period:15*60e3,offset:0,size:8,
      elo:950,band:170,tc:{base:180,inc:2},prize:'COINS',
      d:'Iscrizione con un Ticket · premi in Coins'},
  tc:{id:'tc',place:'circolo',name:'Serale del Circolo',tableId:'tb5',
      entry:{cur:'ARC',v:50},period:30*60e3,offset:7*60e3,size:8,
      elo:1360,band:190,tc:{base:180,inc:2},prize:'ARC',
      d:'Buy-in 50 ◈ · montepremi 8 × 50 meno il rake'},
  ts:{id:'ts',place:'sala',name:'Gran Torneo d\'Onore',tableId:'tb9',
      entry:{cur:'ARC',v:300},period:60*60e3,offset:20*60e3,size:8,
      elo:1780,band:200,tc:{base:120,inc:1},prize:'ARC',req:{lvl:8,stake:2000},
      d:'Buy-in 300 ◈ · richiede livello 8 e stake'}
};
const nextTourStart=T=>Math.ceil((now()-T.offset)/T.period)*T.period+T.offset;
const tourCountdown=T=>nextTourStart(T)-now();
function fmtLeft(ms){
  ms=Math.max(0,ms);
  const m=Math.floor(ms/6e4),s=Math.floor(ms%6e4/1000);
  return m>0?m+'m '+String(s).padStart(2,'0')+'s':s+'s';
}
const PRIZE_BPS={1:5000,2:2500,3:1250,4:1250};
const COIN_PRIZE={1:4200,2:2100,3:1050,4:1050};

function joinTourney(id){
  const T=TOURS[id];
  if(DB.tourney&&!DB.tourney.done){toast('Sei già iscritto a un torneo');return}
  if(!hasSet()){toast('Senza un set di pezzi non puoi iscriverti');return}
  if(T.req){
    if(DB.player.level<T.req.lvl){toast('Serve il livello '+T.req.lvl);return}
    if(DB.player.stake<T.req.stake){toast('Serve uno stake di '+nf(T.req.stake)+' ◈');return}
  }
  if(T.entry.cur==='TICKET'){
    if(ticketsLeft()<T.entry.v){toast('Serve un Ticket');return}
    DB.tickets.left-=T.entry.v;
  }else{
    if(snk()<T.entry.v){toast('Servono '+nf(T.entry.v)+' ◈');return}
    post('tourney_entry',id,[[ACC.pSnk,-T.entry.v],[ACC.prize,T.entry.v]]);
    post('tourney_entry_opp',id,
      [[ACC.opp,-T.entry.v*(T.size-1)],[ACC.prize,T.entry.v*(T.size-1)]]);
    DB.stats.spent+=T.entry.v; DB.stats.wagered+=T.entry.v;
  }
  const players=[{id:'me',name:'TU',elo:DB.player.mmr,me:true,c:'#2dd4bf'}];
  for(let i=1;i<T.size;i++){
    const o=randomOpponent(T.elo,T.band);
    o.name=o.name.split(' ')[0]+' '+(POOLSURN[i%POOLSURN.length]||'');
    players.push(o);
  }
  // sorteggio: la posizione nel tabellone è casuale
  for(let i=players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
    [players[i],players[j]]=[players[j],players[i]]}
  DB.tourney={id,startsAt:nextTourStart(T),round:0,players,
    rounds:[],alive:true,done:false,place:T.place,tableId:T.tableId,
    entry:T.entry.v,cur:T.entry.cur,callAt:0,deadline:0,myMatch:-1};
  save(); closeModal(); updateWorldHud();
  toast('Iscritto: '+T.name+' fra '+fmtLeft(tourCountdown(T)));
}

const meIdx=t=>t.players.findIndex(p=>p.me);
function simWinner(a,b){
  const pa=1/(1+Math.pow(10,(b.elo-a.elo)/400));
  return Math.random()<pa?a:b;
}

/** Costruisce il turno corrente: simula le altre partite e ti chiama. */
function openRound(){
  const t=DB.tourney,T=TOURS[t.id];
  const prev=t.rounds[t.rounds.length-1];
  let field;
  if(!prev)field=t.players.slice();
  else field=prev.map(m=>m.w);
  const pairs=[];
  for(let i=0;i<field.length;i+=2)pairs.push({a:field[i],b:field[i+1],w:null});
  t.rounds.push(pairs);
  t.round=t.rounds.length;
  const mi=pairs.findIndex(p=>p.a.me||p.b.me);
  t.myMatch=mi;
  if(mi<0){                       // sei fuori: il torneo va avanti da solo
    for(const p of pairs)p.w=simWinner(p.a,p.b);
    save(); return advanceTourney();
  }
  for(let i=0;i<pairs.length;i++)if(i!==mi)pairs[i].w=simWinner(pairs[i].a,pairs[i].b);
  t.callAt=now(); t.deadline=now()+60e3;
  save(); updateWorldHud(); showCall();
}

function showCall(){
  const t=DB.tourney,el=$('#wcall'); if(!el||!t||t.myMatch<0)return;
  const T=TOURS[t.id],m=t.rounds[t.round-1][t.myMatch];
  const opp=m.a.me?m.b:m.a;
  const rn=t.rounds.length===1?'Quarti':t.rounds.length===2?'Semifinale':'FINALE';
  el.innerHTML='<div style="font-size:19px">🏆</div><div class="grow">'+
    '<b>'+rn+' · sei chiamato al tavolo</b>'+
    '<span>'+T.name+' · '+PLACES[t.place].name+' · '+
    '<i style="font-style:normal;color:var(--dan)">'+fmtLeft(t.deadline-now())+'</i></span></div>'+
    '<button class="btn sm" onclick="__app.sitTour()">VAI AL TAVOLO</button>';
  el.classList.add('on');
}
function hideCall(){const el=$('#wcall');if(el)el.classList.remove('on')}

/** Battito del torneo: fa partire l'orologio anche se sei altrove. */
function tourTick(){
  const t=DB.tourney;
  if(!t||t.done)return;
  if(!t.round&&now()>=t.startsAt){openRound();return}
  if(t.round&&t.myMatch>=0&&!t.rounds[t.round-1][t.myMatch].w){
    if(G&&!G.ended&&G.tour)return;                 // stai giocando: nessuna fretta
    if(now()>t.deadline){
      const m=t.rounds[t.round-1][t.myMatch];
      m.w=m.a.me?m.b:m.a;                          // forfait
      hideCall();
      toast('Non ti sei presentato: perso a tavolino');
      finishTourFor(false);
      return;
    }
    if($('#wcall').classList.contains('on'))showCall();
  }
}

/** Esito della tua partita di torneo → avanzamento o eliminazione. */
function tourMatchDone(win){
  const t=DB.tourney; if(!t||t.done)return;
  const m=t.rounds[t.round-1][t.myMatch];
  const me=m.a.me?m.a:m.b, opp=m.a.me?m.b:m.a;
  m.w=win?me:opp;
  hideCall();
  finishTourFor(win);
}
function finishTourFor(win){
  const t=DB.tourney;
  if(!win){
    t.alive=false;
    const place=t.rounds.length===3?2:t.rounds.length===2?3:5;
    payTourney(place);
    return;
  }
  if(t.rounds.length>=3){payTourney(1);return}
  setTimeout(()=>{if(DB.tourney&&!DB.tourney.done)openRound()},14e3);
  toast('Passi il turno! Prossima chiamata fra poco');
  save();
}
function advanceTourney(){
  const t=DB.tourney;
  if(t.rounds.length>=3){t.done=true;save();return}
  setTimeout(()=>{if(DB.tourney&&!DB.tourney.done)openRound()},1200);
}

function payTourney(place){
  const t=DB.tourney,T=TOURS[t.id];
  t.done=true; t.place=place; t.alive=place<=1;
  let got=0;
  if(t.cur==='TICKET'){
    got=COIN_PRIZE[place]||0;
    if(got)post('tourney_prize_coins',t.id,[[ACC.emis,-got],[ACC.pCoin,got]]);
  }else{
    const pool=t.entry*TOURS[t.id].size, rake=Math.round(pool*.10), dist=pool-rake;
    got=Math.round(dist*(PRIZE_BPS[place]||0)/1e4);
    const others=dist-got;
    const bRake=Math.round(rake*.4),resv=Math.round(rake*.3),
          ops=Math.round(rake*.2),cre=rake-bRake-resv-ops;
    const moves=[[ACC.prize,-pool],[ACC.pSnk,got],[ACC.opp,others],
      [ACC.burn,bRake],[ACC.resv,resv],[ACC.ops,ops],[ACC.crea,cre]];
    const sum=moves.reduce((a,m)=>a+m[1],0);
    if(Math.abs(sum)>1e-6)moves.push([ACC.burn,-sum]);
    post('tourney_settle',t.id,moves);
    DB.eco.burned+=bRake; DB.eco.sunk+=rake; DB.eco.weekSink+=rake; DB.eco.rakeTot+=rake;
    DB.stats.earned+=got;
  }
  if(place===1)DB.stats.tourneyWins++;
  addXp(place===1?260:place===2?160:place===3?110:60);
  questProgress({tour:1,tourWin:place===1?1:0});
  save(); updateWorldHud(); renderTop();
  const lbl=place===1?'HAI VINTO IL TORNEO':place===2?'Finalista':place===3?'Semifinalista':'Eliminato';
  openModal('<h4>'+TOURS[t.id].name+'</h4>'+
    '<div class="rplace" style="padding:6px 0 14px"><div class="n" style="font-size:30px;color:'+
      (place===1?'var(--gold)':'var(--dim)')+'">'+lbl+'</div>'+
      '<div class="l">'+(place===1?'Otto giocatori, un tabellone, un vincitore.':
        'Il tabellone si è chiuso senza di te.')+'</div></div>'+
    '<div class="card"><div class="kv"><span>Piazzamento</span><b>'+
      (place<=4?place+'º':'fuori dai primi 4')+'</b></div>'+
    '<div class="kv"><span>Premio</span><b class="'+(got?'pos':'')+'">'+
      (got?'+'+nf(got)+(t.cur==='TICKET'?' ●':' ◈'):'nessuno')+'</b></div></div>'+
    bracketHtml(t)+
    '<button class="btn wide" style="margin-top:12px" onclick="__app.closeM()">CHIUDI</button>',{wide:true});
}

function bracketHtml(t){
  const rn=['Quarti','Semifinali','Finale'];

    h+='<div class="brkround"><div class="muted" style="margin:0 0 5px">'+rn[i]+'</div><div class="brk">';
    for(const m of r){

/* ═══════════════════════════════════════════════════════════════
   13 · DISEGNO DELLA PARTITA
   La scacchiera è del locale, i pezzi sono i tuoi: il tuo NFT
   viaggia con te da un tavolo all'altro e si vede su ogni piano.
   ═══════════════════════════════════════════════════════════════ */
const GLYPH={1:'♟',2:'♞',3:'♝',4:'♜',5:'♛',6:'♚'};
const PFONT='"Segoe UI Symbol","Apple Symbols","DejaVu Sans","Arial Unicode MS",serif';
const cv=$('#cv'),ctx=cv.getContext('2d');
let BS=0,DPR=1;

/* Misura e ridisegno della scacchiera.
   clientWidth/Height includono il padding: va tolto, altrimenti la
   scacchiera tocca i bordi. --board-max arriva dal CSS e cambia per
   fascia. Lo snap a multipli di 8 fa perdere al massimo 7px di lato
   e in cambio rende `cell` un intero: le linee smettono di sfumare. */
function boardBox(){
  const w=$('#boardWrap'),cs=getComputedStyle(w);
  let h=w.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const gp=$('#gPlace');
  if(gp&&getComputedStyle(gp).position==='static')h-=gp.offsetHeight+8;
  const mx=parseFloat(cs.getPropertyValue('--board-max'));
  return {
    w:w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),
    h:h,
    max:(isFinite(mx)&&mx>0)?mx:99999
  };
}
function boardSize(){
  const b=boardBox();
  let s=Math.min(b.w,b.h,b.max);
  if(!isFinite(s)||s<=0)s=Math.min(window.innerWidth,window.innerHeight)-24;
  s=Math.max(120,s);
  return Math.floor(s/8)*8;
}
let rafRz=0;
function resize(immediate){
  if(!G)return;
  if(immediate){ if(rafRz){cancelAnimationFrame(rafRz);rafRz=0} return applyBoardSize() }
  if(rafRz)return;
  rafRz=requestAnimationFrame(()=>{rafRz=0;applyBoardSize()});
}
function applyBoardSize(){
  if(!G||!$('#game').classList.contains('on'))return;
  const s=boardSize(), dpr=Math.min(2,window.devicePixelRatio||1);
  const px=Math.round(s*dpr);
  if(s===BS&&dpr===DPR&&cv.width===px){drawBoard();return}
  BS=s; DPR=dpr;
  cv.width=px; cv.height=px;
  cv.style.width=s+'px'; cv.style.height=s+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBoard();
}
/* Si osserva il CONTENITORE, non solo la finestra: copre rotazione,
   passaggio colonna→pannello, split-view, tastiera software e la
   viewport di Telegram che si accorcia. */
if(window.ResizeObserver&&$('#boardWrap')){
  new ResizeObserver(()=>resize()).observe($('#boardWrap'));
}
function sqXY(sq){
  const f=sq&7,r=sq>>4;
  return G.flip?[7-f,r]:[f,7-r];
}
function xySq(x,y){
  const f=G.flip?7-x:x, r=G.flip?y:7-y;
  if(f<0||f>7||r<0||r>7)return -1;
  return r*16+f;
}

function drawPiece(p,cx,cy,cell,set){
  const t=Math.abs(p),white=p>0;
  ctx.save();
  ctx.font=Math.round(cell*0.78)+'px '+PFONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(set.glow){ctx.shadowColor=set.glow;ctx.shadowBlur=cell*0.22}
  ctx.fillStyle=white?set.lt:set.dk;
  ctx.fillText(GLYPH[t],cx,cy+cell*0.02);
  ctx.shadowBlur=0;
  ctx.lineWidth=Math.max(1,cell*0.035);
  ctx.strokeStyle=white?set.ol:'rgba(255,255,255,.30)';
  ctx.strokeText(GLYPH[t],cx,cy+cell*0.02);
  ctx.restore();
}

function drawBoard(){
  if(!G)return;
  const s=G.s,cell=BS/8,t=PLACES[G.placeKey].tbl;
  const bd={l:t.l,d:t.d,hi:'#f5c451'};
  const set=setDef();
  ctx.clearRect(0,0,BS,BS);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const sq=xySq(x,y);
    const dark=((sq>>4)+(sq&7))%2===0;
    ctx.fillStyle=dark?bd.d:bd.l;
    ctx.fillRect(x*cell,y*cell,cell+.5,cell+.5);
  }
  if(G.last){
    ctx.fillStyle=bd.hi+'55';
    for(const sq of [mFrom(G.last),mTo(G.last)]){
      const [x,y]=sqXY(sq); ctx.fillRect(x*cell,y*cell,cell,cell);
    }
  }
  if(!G.ended&&inCheck(s,s.turn)){
    const [x,y]=sqXY(s.kSq[s.turn>0?0:1]);
    const g=ctx.createRadialGradient(x*cell+cell/2,y*cell+cell/2,cell*.1,
      x*cell+cell/2,y*cell+cell/2,cell*.62);
    g.addColorStop(0,'rgba(239,90,90,.85)'); g.addColorStop(1,'rgba(239,90,90,0)');
    ctx.fillStyle=g; ctx.fillRect(x*cell,y*cell,cell,cell);
  }
  if(G.sel>=0){
    const [sx,sy]=sqXY(G.sel);
    ctx.strokeStyle=bd.hi; ctx.lineWidth=Math.max(2,cell*.06);
    ctx.strokeRect(sx*cell+ctx.lineWidth/2,sy*cell+ctx.lineWidth/2,
      cell-ctx.lineWidth,cell-ctx.lineWidth);
    for(const m of G.targets){
      const [x,y]=sqXY(mTo(m));
      ctx.beginPath();
      if(s.b[mTo(m)]||mFl(m)&FL_EP){
        ctx.lineWidth=Math.max(2,cell*.07); ctx.strokeStyle=bd.hi+'cc';
        ctx.arc(x*cell+cell/2,y*cell+cell/2,cell*.42,0,7); ctx.stroke();
      }else{
        ctx.fillStyle=bd.hi+'99';
        ctx.arc(x*cell+cell/2,y*cell+cell/2,cell*.15,0,7); ctx.fill();
      }
    }
  }
  // hover del mouse, casella sotto il pezzo trascinato, cursore da tastiera
  {const marks=[];
   if(HOVER>=0&&HOVER!==G.sel)marks.push([HOVER,'rgba(232,238,247,.12)','fill']);
   if(DRAG&&DRAG.moved&&DRAG.over>=0)marks.push([DRAG.over,bd.hi+'ee','ring']);
   if(KBD>=0)marks.push([KBD,'#38bdf8','ring']);
   for(const [msq,col,mode] of marks){
     const [mx,my]=sqXY(msq);
     if(mode==='fill'){ctx.fillStyle=col;ctx.fillRect(mx*cell,my*cell,cell,cell)}
     else{
       ctx.lineWidth=Math.max(2,cell*.075);
       ctx.strokeStyle=col;
       ctx.strokeRect(mx*cell+ctx.lineWidth/2,my*cell+ctx.lineWidth/2,
         cell-ctx.lineWidth,cell-ctx.lineWidth);
     }
   }}
  for(let sq=0;sq<128;sq++){
    if(sq&0x88){sq+=7;continue}
    const p=s.b[sq]; if(!p)continue;
    if(DRAG&&DRAG.moved&&sq===DRAG.sq)continue;   // il pezzo in mano lo disegno dopo, sopra a tutto
    const [x,y]=sqXY(sq);
    drawPiece(p,x*cell+cell/2,y*cell+cell/2,cell,set);
  }
  ctx.font=Math.round(cell*.2)+'px -apple-system,sans-serif';
  ctx.textBaseline='top'; ctx.textAlign='left';
  for(let i=0;i<8;i++){
    const dark=(i%2)===0;
    ctx.fillStyle=(dark?bd.l:bd.d)+'bb';
    ctx.fillText(G.flip?FILES[7-i]:FILES[i],i*cell+cell*.06,BS-cell*.26);
    ctx.fillText(String(G.flip?i+1:8-i),BS-cell*.16,i*cell+cell*.05);
  }
  if(DRAG&&DRAG.moved){
    const rb=cv.getBoundingClientRect();
    const fx=(DRAG.cx-rb.left)/rb.width*BS, fy=(DRAG.cy-rb.top)/rb.height*BS;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.38)';
    ctx.beginPath(); ctx.ellipse(fx,fy+cell*.34,cell*.27,cell*.10,0,0,7); ctx.fill();
    ctx.restore();
    drawPiece(DRAG.p,fx,fy-cell*.10,cell*1.14,set);   // 14% più grande: "sollevato"
  }
}

/* ── Anteprima di un set ───────────────────────────────────── */
function nftArt(el,defId){
  const d=DEFS[defId]; if(!d)return;
  const w=el.clientWidth||104,h=el.clientHeight||52,r=Math.min(2,window.devicePixelRatio||1);
  let c=el.querySelector('canvas');
  if(!c){c=document.createElement('canvas');el.innerHTML='';el.appendChild(c)}
  c.width=w*r; c.height=h*r;
  const x=c.getContext('2d'); x.setTransform(r,0,0,r,0,0);
  x.clearRect(0,0,w,h);
  const cell=Math.min(w/4,h/2);
  const ox=(w-cell*4)/2, oy=(h-cell*2)/2;
  for(let i=0;i<4;i++)for(let j=0;j<2;j++){
    x.fillStyle=(i+j)%2?'#3d4756':'#242c38';
    x.fillRect(ox+i*cell,oy+j*cell,cell+.5,cell+.5);
  }
  x.save();
  x.font=Math.round(cell*.72)+'px '+PFONT;
  x.textAlign='center'; x.textBaseline='middle';
  const row=[[K,0,1],[Q,1,1],[N,2,-1],[P,3,-1]];
  for(const [pc,i,col] of row){
    const px=ox+i*cell+cell/2, py=oy+(col>0?0.5:1.5)*cell;
    if(d.glow){x.shadowColor=d.glow;x.shadowBlur=7}
    x.fillStyle=col>0?d.lt:d.dk;
    x.fillText(GLYPH[pc],px,py);
    x.shadowBlur=0;
    x.lineWidth=1.1; x.strokeStyle=col>0?d.ol:'rgba(255,255,255,.32)';
    x.strokeText(GLYPH[pc],px,py);
  }
  x.restore();
}
function paintArt(scope){
  $$((scope||'')+' .art[data-def]').forEach(el=>nftArt(el,el.dataset.def));
}

let G=null;
let clockT=null;

const fmtClock=t=>{
  t=Math.max(0,t);
  const m=Math.floor(t/60),s=Math.floor(t%60);
  return t<20?m+':'+String(s).padStart(2,'0')+'.'+Math.floor((t*10)%10)
             :m+':'+String(s).padStart(2,'0');
};

function capturedHtml(color){
  const s=G.s,cnt={};
  const start={1:8,2:2,3:2,4:2,5:1};
  let mine=0,other=0;
  for(let sq=0;sq<128;sq++){
    if(sq&0x88){sq+=7;continue}
    const p=s.b[sq]; if(!p)continue;
    const t=Math.abs(p); if(t===K)continue;
    if((p>0)!==(color>0)){cnt[t]=(cnt[t]||0)+1;other+=VAL[t]}
    else mine+=VAL[t];
  }
  let html='';
  for(const t of [5,4,3,2,1]){
    const gone=(start[t]||0)-(cnt[t]||0);
    for(let i=0;i<gone;i++)html+=GLYPH[t];
  }
  const adv=Math.round((mine-other)/100);
  return html+(adv>0?'<em>+'+adv+'</em>':'');
}

function updateHud(){
  if(!G)return;
  const my=G.myColor,me=my>0?'w':'b',op=my>0?'b':'w';
  $('#mClk').textContent=fmtClock(G.clock[me]);
  $('#oClk').textContent=fmtClock(G.clock[op]);
  $('#mClk').classList.toggle('act',G.s.turn===my&&!G.ended);
  $('#oClk').classList.toggle('act',G.s.turn!==my&&!G.ended);
  $('#mClk').classList.toggle('low',G.clock[me]<20);
  $('#oClk').classList.toggle('low',G.clock[op]<20);
  $('#mCap').innerHTML=capturedHtml(my);
  $('#oCap').innerHTML=capturedHtml(-my);
  $('#mAv').textContent=my>0?'♙':'♟';
  $('#oAv').textContent=my>0?'♟':'♙';
  const hidden=G.blind&&!G.ended;
  $('#oName').textContent=hidden?'??? · Elo sconosciuto':G.bot.name+' · '+G.bot.elo;
  renderMoves();
}

/* Due formati per lo stesso elemento: la coda su una riga quando lo
   schermo è in verticale (identica a prima), e la lista completa a due
   colonne quando c'è il pannello laterale. Le stringhe SAN le generiamo
   noi (Cxe5+, O-O, e8=D#): nessun rischio di HTML iniettato. */
function renderMoves(){
  if(!G)return;
  const el=$('#moves'),san=G.s.san;
  if(!document.body.classList.contains('lay-side')){
    let mv='';
    for(let i=san.length-1;i>=Math.max(0,san.length-8);i--){
      const n=Math.floor(i/2)+1;
      mv=(i%2===0?'<b>'+n+'.</b> ':'')+san[i]+' '+mv;
    }
    el.innerHTML=mv; return;
  }
  const last=san.length-1;
  let h='';
  for(let i=0;i<san.length;i+=2){
    h+='<i>'+(i/2+1)+'</i>'+
       '<u'+(i===last?' class="cur"':'')+'>'+san[i]+'</u>'+
       '<u'+(i+1===last?' class="cur"':'')+'>'+(san[i+1]||'')+'</u>';
  }
  el.innerHTML=h;
  el.scrollTop=el.scrollHeight;
}

function gmsg(txt,ms){
  const e=$('#gmsg'); e.textContent=txt; e.classList.add('on');
  clearTimeout(gmsg._t); gmsg._t=setTimeout(()=>e.classList.remove('on'),ms||1400);
}

function tickClock(){
  if(!G||G.ended||!G.started)return;
  const t=now(),dt=(t-G.lastTick)/1000;
  G.lastTick=t;
  const side=G.s.turn>0?'w':'b';
  G.clock[side]-=dt;
  if(G.clock[side]<=0){
    G.clock[side]=0;
    const flagged=G.s.turn===G.myColor;
    // Regola FIDE 6.9: se chi resta non ha materiale per mattare è patta,
    // non vittoria. Senza questa regola il finale Re contro Re sarebbe
    // una lotteria pagata in token.
    const winner=-G.s.turn;
    if(!canMate(G.s,winner))endMatch('draw','tempo scaduto · materiale insufficiente');
    else endMatch(flagged?'loss':'win','tempo scaduto');
    return;
  }
  updateHud();
}

/* ═══ Input della scacchiera ═══
   Tre modi sullo stesso stato: tocca-tocca (telefono, identico a
   prima), trascinamento (mouse e dito), tastiera. Si passa al
   trascinamento solo dopo 6px di movimento reale, quindi il tocco
   secco non cambia comportamento di una virgola. */
let DRAG=null, HOVER=-1, KBD=-1, bRaf=0;
function boardPaint(){ if(bRaf)return; bRaf=requestAnimationFrame(()=>{bRaf=0;drawBoard()}) }
function myTurn(){return !!(G&&!G.ended&&G.s.turn===G.myColor&&!G.thinking)}
function evSq(ev){
  const r=cv.getBoundingClientRect();
  if(!r.width||!r.height)return -1;
  const x=Math.floor((ev.clientX-r.left)/r.width*8);   // misura reale: immune a BS stantio
  const y=Math.floor((ev.clientY-r.top)/r.height*8);
  if(x<0||x>7||y<0||y>7)return -1;
  return xySq(x,y);
}
function mineSq(sq){const p=G.s.b[sq];return !!(p&&(p>0)===(G.myColor>0))}
function selectSq(sq){
  if(mineSq(sq)){G.sel=sq;G.targets=G.legal.filter(m=>mFrom(m)===sq);return true}
  G.sel=-1;G.targets=[];return false;
}
function tryMove(to){
  if(G.sel<0)return false;
  const ms=G.targets.filter(m=>mTo(m)===to);
  if(!ms.length)return false;
  if(ms.length>1&&mPr(ms[0])){promoteDlg(ms);return true}
  KBD=-1; doMove(ms[0]); return true;
}
function isTarget(sq){return !!(G&&G.sel>=0&&sq>=0&&G.targets.some(m=>mTo(m)===sq))}
function boardCursor(sq){
  if(!myTurn()){cv.style.cursor='default';return}
  if(DRAG&&DRAG.moved){cv.style.cursor='grabbing';return}
  cv.style.cursor=(sq>=0&&mineSq(sq))?'grab':isTarget(sq)?'pointer':'default';
}
function boardDown(ev){
  if(!myTurn())return;
  if(ev.button===2||ev.button===1){G.sel=-1;G.targets=[];DRAG=null;boardPaint();return}
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  const sq=evSq(ev); if(sq<0)return;
  ev.preventDefault();
  if(G.sel>=0&&tryMove(sq))return;
  if(!mineSq(sq)){G.sel=-1;G.targets=[];boardPaint();return}
  selectSq(sq);
  DRAG={sq,p:G.s.b[sq],x:ev.clientX,y:ev.clientY,cx:ev.clientX,cy:ev.clientY,
        over:sq,moved:false,pid:ev.pointerId};
  try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  boardCursor(sq); boardPaint();
}
function boardMove(ev){
  if(DRAG&&ev.pointerId===DRAG.pid){
    if(!DRAG.moved&&Math.hypot(ev.clientX-DRAG.x,ev.clientY-DRAG.y)<6)return;
    DRAG.moved=true; DRAG.cx=ev.clientX; DRAG.cy=ev.clientY; DRAG.over=evSq(ev);
    cv.style.cursor='grabbing'; boardPaint(); return;
  }
  if(ev.pointerType!=='mouse')return;          // l'hover esiste solo col mouse
  const sq=myTurn()?evSq(ev):-1;
  boardCursor(sq);
  if(sq!==HOVER){HOVER=sq;boardPaint()}
}
function boardUp(ev){
  if(!DRAG||ev.pointerId!==DRAG.pid)return;
  const d=DRAG; DRAG=null;
  try{cv.releasePointerCapture(ev.pointerId)}catch(e){}
  if(d.moved){
    const to=evSq(ev);
    if(to>=0&&to!==d.sq)tryMove(to);           // fuori o sul posto: il pezzo torna indietro
  }
  boardCursor(evSq(ev)); boardPaint();          // dopo un tocco secco la selezione resta viva
}
function boardCancel(ev){
  if(!DRAG||(ev&&ev.pointerId!==DRAG.pid))return;
  DRAG=null; boardPaint();
}
function pickSquare(ev){boardDown(ev)}          // nome storico, usato dai test
cv.addEventListener('pointerdown',boardDown);
cv.addEventListener('pointermove',boardMove);
cv.addEventListener('pointerup',boardUp);
cv.addEventListener('pointercancel',boardCancel);
cv.addEventListener('lostpointercapture',boardCancel);
cv.addEventListener('pointerleave',()=>{if(HOVER>=0&&!DRAG){HOVER=-1;boardPaint()}});
cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(G&&!G.ended&&(G.sel>=0||DRAG)){G.sel=-1;G.targets=[];DRAG=null;boardPaint()}
});
cv.addEventListener('dragstart',e=>e.preventDefault());

function promoteDlg(ms){
  openModal('<h4>Promozione</h4><p class="muted" style="margin:4px 0 13px">'+
    'Il pedone arriva in fondo: scegli il pezzo.</p><div class="row">'+
    [Q,R,B,N].map(pr=>{
      const m=ms.find(x=>mPr(x)===pr);
      return '<button class="btn g grow" style="font-size:26px;padding:12px 0" '+
        'onclick="__app.promo('+m+')">'+GLYPH[pr]+'</button>';
    }).join('')+'</div>');
}

function doMove(m){
  const s=G.s;
  // Nessuna mossa entra in partita senza essere fra le legali: è la regola
  // del server autoritativo del §13, applicata anche al client.
  if(!m||!G.legal.includes(m)){console.warn('mossa rifiutata',m);return}
  if(mPr(m)){DB.stats.promos++;G.promos++}
  play(s,m);
  G.last=m; G.sel=-1; G.targets=[];
  const side=s.turn<0?'w':'b';        // chi ha appena mosso
  G.clock[side]+=G.inc;
  G.started=true; G.lastTick=now();
  drawBoard(); updateHud();
  const st=gameOver(s);
  if(st.over){finishByState(st);return}
  G.legal=st.moves;
  if(s.turn!==G.myColor)setTimeout(botTurn,170+Math.random()*280);
  else if(inCheck(s,s.turn))gmsg('Scacco!',900);
}

function botTurn(){
  if(!G||G.ended)return;
  G.thinking=true;
  const t0=now();
  const m=botMove(G.s,G.bot.skill,G.bot.style);
  const spent=(now()-t0)/1000;
  const side=G.s.turn>0?'w':'b';
  G.clock[side]=Math.max(.1,G.clock[side]-spent);
  G.thinking=false;
  if(!m){finishByState(gameOver(G.s));return}
  doMove(m);
}

function finishByState(st){
  if(st.res==='draw')return endMatch('draw',st.how);
  const winner=st.res==='white'?1:-1;
  endMatch(winner===G.myColor?'win':'loss',st.how);
}

/** Un colore ha materiale sufficiente per dare matto? */
function canMate(s,c){
  let minors=0;
  for(let sq=0;sq<128;sq++){
    if(sq&0x88){sq+=7;continue}
    const p=s.b[sq]; if(!p||(p>0)!==(c>0))continue;
    const t=Math.abs(p);
    if(t===P||t===R||t===Q)return true;
    if(t===N||t===B)minors++;
  }
  return minors>=2;
}

/* ── Avvio della partita ───────────────────────────────────── */
function startMatch(opts){
  opts=opts||{};
  const kind=opts.kind||'amichevole';
  const t=opts.tableId?tableById(opts.tableId):null;
  const placeKey=opts.place||(t?t.place:'parco');
  const pl=PLACES[placeKey];
  const bet=isWager(kind)?(opts.bet||0):0;

  if(!hasSet()){toast('Senza un set di pezzi non puoi giocare');return}
  if(!opts.tour){
    const chk=canSit(placeKey,kind,bet);
    if(!chk.ok){toast(chk.why);return}
  }

  // Avversario: fisso al tavolo, pescato al buio, o sorteggiato dal tabellone
  let npc;
  if(opts.tour)npc=opts.tour.opp;
  else if(t&&t.npc)npc=t.npc;
  else npc=randomOpponent(DB.player.mmr,280);

  if(isWager(kind)&&!opts.tour){
    post('match_entry',kind,[[ACC.pSnk,-bet],[ACC.prize,bet]]);
    post('match_entry_opp',kind,[[ACC.opp,-bet],[ACC.prize,bet]]);
    DB.stats.spent+=bet; DB.stats.wagered+=bet;
  }

  const tc=opts.tc||pl.tc;
  const seed=(Math.random()*4294967295)>>>0;
  const rnd=mulberry32(seed);
  const myColor=rnd()<.5?1:-1;
  const s=newGame();

  G={
    s,kind,fee:bet,seed,placeKey,tableId:opts.tableId||null,
    myColor,flip:myColor<0,blind:kind==='buio',tour:opts.tour||null,
    bot:npc,
    clock:{w:tc.base,b:tc.base}, inc:tc.inc,
    sel:-1,targets:[],legal:legalMoves(s),last:null,
    promos:0,mmr0:DB.player.mmr,
    started:false,ended:false,thinking:false,
    startedAt:now(),lastTick:now(),settled:false,
    mods:loadoutMods()
  };

  $('#mName').textContent='TU · '+DB.player.mmr;
  $('#gPlace').textContent=pl.name.toUpperCase()+' · '+KINDS[kind].name.toUpperCase()+
    (bet?' · '+nf(bet)+' ◈':'')+(opts.tour?' · '+opts.tour.label:'');
  $('#game').style.background=pl.amb;
  $('#game').classList.add('on');
  $('#res').classList.remove('on');
  closeModal();
  resize(true); updateHud();
  clearInterval(clockT); clockT=setInterval(tickClock,100);
  if(G.s.turn!==G.myColor)setTimeout(botTurn,420);
  else gmsg(G.blind?'Qualcuno si è seduto di fronte a te':'Muovi il Bianco',1400);
  save();
}

function endMatch(res,how){
  if(!G||G.ended)return;
  G.ended=true; G.endedAt=now();
  G.res=res; G.how=how;
  clearInterval(clockT);
  drawBoard(); updateHud();
  settle();
}

/**
 * Il contratto universale del §2: qualunque genere produce QUESTO.
 * Economia, classifiche e anti-cheat non sanno cosa siano gli scacchi.
 */
function finalize(){
  const mate=G.how==='matto';
  const moves=G.s.san.length;
  return {
    matchId:uid('mt'), modeKey:G.kind, simVersion:'chess-1.1.0',
    seed:String(G.seed), startedAt:G.startedAt, endedAt:G.endedAt,
    venue:G.placeKey, entry:G.fee,
    participants:[
      {playerId:'me', placement:G.res==='loss'?2:1,
       score:G.res==='win'?1:G.res==='draw'?.5:0,
       stats:{moves,checkmate:mate&&G.res==='win'?1:0,
              timeLeft:Math.round(G.clock[G.myColor>0?'w':'b']),
              promotions:G.promos}, afkTicks:0},
      {playerId:G.bot.name, placement:G.res==='loss'?1:G.res==='draw'?1:2,
       score:G.res==='loss'?1:G.res==='draw'?.5:0,
       stats:{moves,checkmate:mate&&G.res==='loss'?1:0,
              timeLeft:Math.round(G.clock[G.myColor>0?'b':'w']),
              promotions:0}, afkTicks:0}
    ],
    integrity:{
      inputLogHash:fnv(G.s.log.join(' ')),
      finalStateHash:fnv(fen(G.s)),
      serverSignature:'ed25519:'+fnv(G.seed+':'+G.s.log.length)
    }
  };
}

function verifyReplay(rep){
  const s=newGame();
  for(const u of rep.moves){
    const m=fromUci(s,u);
    if(!m)return{ok:false,want:rep.hash,got:'mossa illegale: '+u};
    play(s,m);
  }
  const got=fnv(fen(s));
  return{ok:got===rep.hash,want:rep.hash,got};
}

function settle(){
  if(!G||G.settled)return;      // idempotenza §11.1: si liquida una volta sola
  G.settled=true;

  const r=finalize(),K=KINDS[G.kind],lm=G.mods,dim=diminish();
  const res=G.res, mate=(G.how==='matto'&&res==='win');
  const base=computePayout(G.kind,G.fee,res,mate,null,G.bot.elo);
  const pay=computePayout(G.kind,G.fee,res,mate,lm,G.bot.elo);
  const baseMine=Math.round((base.result+base.mate)*dim);
  let mine=baseMine, coinPay=0, burnRes=0, oppPay=0;

  if(G.tour){
    // Nel torneo il denaro è già nel montepremi: qui non si liquida nulla,
    // si liquida alla fine del tabellone.
    mine=0;
  } else if(K.cur==='COINS'){
    coinPay=pay.result+pay.mate;
    post('match_reward_coins',G.kind,[[ACC.emis,-coinPay],[ACC.pCoin,coinPay]]);
    mine=0;
  } else {
    const pool=G.fee*PLAYERS, rake=Math.round(pool*K.rake), dist=pool-rake;
    const oppRes=res==='win'?'loss':res==='loss'?'win':'draw';
    const oppQ=computePayout(G.kind,G.fee,oppRes,G.how==='matto'&&res==='loss',null,G.bot.elo);
    oppPay=oppQ.result+oppQ.mate;
    burnRes=Math.max(0,dist-baseMine-oppPay);
    const bRake=Math.round(rake*.4),resv=Math.round(rake*.3),
          ops=Math.round(rake*.2),cre=rake-bRake-resv-ops;
    const moves=[
      [ACC.prize,-pool],[ACC.pSnk,baseMine],[ACC.opp,oppPay],
      [ACC.burn,bRake+burnRes],[ACC.resv,resv],[ACC.ops,ops],[ACC.crea,cre]
    ];
    const sum=moves.reduce((a,m)=>a+m[1],0);
    if(Math.abs(sum)>1e-6)moves.push([ACC.burn,-sum]);   // arrotondamenti → burn
    post('match_settle',G.kind,moves);
    DB.eco.burned+=bRake+burnRes; DB.eco.sunk+=rake+burnRes;
    DB.eco.weekSink+=rake+burnRes; DB.eco.rakeTot+=rake;
    DB.stats.earned+=mine;
  }

  const nMoves=G.s.san.length;
  const xp=Math.round(40+(res==='win'?90:res==='draw'?45:15)+(mate?40:0)
    +Math.min(60,nMoves)+(G.tour?60:0));
  const ups=addXp(xp);
  const expected=1/(1+Math.pow(10,(G.bot.elo-G.mmr0)/400));
  const sc=res==='win'?1:res==='draw'?.5:0;
  const kf=G.tour?28:isWager(G.kind)?24:8;
  DB.player.mmr=clamp(Math.round(G.mmr0+kf*(sc-expected)),600,2400);

  DB.stats.played++;
  if(res==='win'){DB.stats.wins++;DB.stats.streak++;
    if(DB.stats.streak>DB.stats.bestStreak)DB.stats.bestStreak=DB.stats.streak}
  else{if(res==='draw')DB.stats.draws++;else DB.stats.losses++;DB.stats.streak=0}
  if(mate)DB.stats.mates++;
  DB.risk.count++;

  // Testa a testa con l'avversario di questo tavolo
  if(G.tableId&&G.bot.id&&!G.blind){
    const rec=DB.world.rec[G.bot.id]||(DB.world.rec[G.bot.id]={w:0,d:0,l:0});
    rec[res==='win'?'w':res==='draw'?'d':'l']++;
  }

  questProgress({played:1,wins:res==='win'?1:0,draws:res==='draw'?1:0,
    mates:mate?1:0,promos:G.promos,wager:isWager(G.kind)?1:0,
    buio:G.kind==='buio'?1:0,long:nMoves>=60?1:0});
  checkAch();

  const rep={id:uid('rep'),seed:G.seed,moves:[...G.s.log],san:[...G.s.san],
    hash:r.integrity.finalStateHash,kind:G.kind,place:G.placeKey,at:now()};
  DB.replays.unshift(rep); if(DB.replays.length>12)DB.replays.pop();
  DB.matches.unshift({at:now(),kind:G.kind,place:G.placeKey,res,how:G.how,
    opp:G.bot.name,elo:G.bot.elo,moves:nMoves,
    net:K.cur==='COINS'||G.tour?0:mine-G.fee,xp,rep:rep.id});
  if(DB.matches.length>40)DB.matches.pop();

  if(!ledgerOk())console.error('LEDGER SBILANCIATO');
  save();

  showResult({r,pay,mine,coinPay,burnRes,dim,xp,ups,K,rep,res,mate,how:G.how,nMoves});
  $('#game').classList.remove('on');
  if(G.tour)setTimeout(()=>tourMatchDone(res==='win'),400);
  renderTop();
}

function resign(){
  if(!G||G.ended)return;
  endMatch('loss','abbandono');
}
function offerDraw(){
  if(!G||G.ended)return;
  const e=evaluate(G.s)*G.s.turn*(G.myColor>0?-1:1);   // + = bene per il bot
  if(e<60)endMatch('draw','patta concordata');
  else gmsg((G.blind?'L\'avversario':G.bot.name)+' rifiuta la patta',1500);
}
$('#bResign').addEventListener('click',resign);

/* ═══════════════════════════════════════════════════════════════
   CONTROLLORE DI LAYOUT — unica sorgente di verità
   Le @media del foglio di stile e queste classi usano le STESSE
   soglie (720 / 1080 / landscape<=520): non possono divergere.
   .lay-side non è una soglia di larghezza ma di rapporto d'aspetto:
   la scacchiera è quadrata, quindi quando la finestra è più larga
   che alta la larghezza avanzata diventa il pannello della partita.
   ═══════════════════════════════════════════════════════════════ */
const MQ={
  t   :matchMedia('(min-width:720px)'),
  d   :matchMedia('(min-width:1080px)'),
  land:matchMedia('(orientation:landscape) and (max-height:520px)'),
  side:matchMedia('(min-aspect-ratio:13/10)'),
  fine:matchMedia('(hover:hover) and (pointer:fine)')
};
let LAY='';
function applyLayout(){
  const c=document.body.classList;
  const d=MQ.d.matches, t=MQ.t.matches&&!d;
  c.toggle('lay-d',d);
  c.toggle('lay-t',t);
  c.toggle('lay-land',MQ.land.matches);
  c.toggle('lay-side',MQ.side.matches);
  c.toggle('lay-fine',MQ.fine.matches);
  const n=(d?'D':t?'T':'M')+(MQ.land.matches?'L':'')+(MQ.side.matches?'S':'');
  const changed=n!==LAY; LAY=n;
  return changed;
}
applyLayout();

/* Un solo punto d'ingresso per QUALSIASI cambio di viewport: la
   scacchiera si ridisegna subito (altrimenti si vede un salto), mondo
   e anteprime aspettano 90ms per non far partire una raffica di
   ricotture mentre si trascina la finestra. */
let vpT=0;
function onViewportChange(){
  const changed=applyLayout();
  if(G&&$('#game').classList.contains('on')){
    if(changed&&typeof renderMoves==='function')renderMoves();
    resize(true);
  }
  clearTimeout(vpT);
  vpT=setTimeout(()=>{
    if(WS&&$('#wcv'))worldResize();
    if(page&&page!=='play')paintArt('#p-'+page);
    if($('#modal').classList.contains('on'))paintArt('#mIn');
  },90);
}
window.addEventListener('resize',onViewportChange);
window.addEventListener('orientationchange',()=>setTimeout(onViewportChange,240));
if(window.visualViewport)visualViewport.addEventListener('resize',onViewportChange);
for(const k in MQ)MQ[k].addEventListener('change',onViewportChange);

/* ── Tastiera (computer) — il tocco resta invariato ─────────── */
function inField(e){
  const t=e.target;
  return !!t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||'')||t.isContentEditable===true);
}
const ARROWK={ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1};
/* La città risponde ai tasti solo quando è davvero la vista in primo piano:
   altrove le frecce devono restare al browser e Invio ai pulsanti a fuoco. */
function worldLive(){
  return !!(WS&&WS.raf)&&page==='play'
    &&!$('#game').classList.contains('on')
    &&!$('#res').classList.contains('on')
    &&!$('#modal').classList.contains('on');
}
addEventListener('keydown',e=>{
  if(inField(e))return;
  if(worldLive()){
    WS.keys[e.key]=1; WS.keys[e.key.toLowerCase()]=1;
    if(ARROWK[e.key])e.preventDefault();
  }
});
addEventListener('keyup',e=>{if(WS){WS.keys[e.key]=0;WS.keys[e.key.toLowerCase()]=0}});
addEventListener('blur',()=>{if(WS)WS.keys={}});
/* Comandi da tastiera sulla scacchiera: le frecce muovono un cursore,
   Invio/Spazio selezionano e poi muovono, F ribalta la vista (G.flip
   è usato solo da sqXY/xySq: è puramente visivo). */
function kbdCursor(dx,dy){
  if(KBD<0)KBD=G.sel>=0?G.sel:(G.myColor>0?0x04:0x74);   // e1 / e8
  let [x,y]=sqXY(KBD);
  x=clamp(x+dx,0,7); y=clamp(y+dy,0,7);
  KBD=xySq(x,y);
  boardPaint();
}
function boardKey(e){
  const k=e.key;
  if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){
    e.preventDefault();
    kbdCursor(k==='ArrowRight'?1:k==='ArrowLeft'?-1:0,
              k==='ArrowDown'?1:k==='ArrowUp'?-1:0);
    return;
  }
  if(k==='Enter'||k===' '){
    e.preventDefault();
    if(!myTurn())return;
    if(KBD<0){KBD=G.sel>=0?G.sel:(G.myColor>0?0x04:0x74);boardPaint();return}
    if(G.sel>=0&&tryMove(KBD))return;
    selectSq(KBD); boardPaint(); return;
  }
  if(k==='f'||k==='F'){e.preventDefault();G.flip=!G.flip;KBD=-1;boardPaint()}
}
addEventListener('keydown',e=>{
  if(inField(e))return;
  const modalOn=$('#modal').classList.contains('on');
  const resOn=$('#res').classList.contains('on');
  const gameOn=$('#game').classList.contains('on');
  if(e.key==='Escape'){
    if(modalOn){closeModal();e.preventDefault()}
    else if(!resOn&&gameOn&&G&&!G.ended&&(G.sel>=0||DRAG||KBD>=0)){
      G.sel=-1;G.targets=[];DRAG=null;KBD=-1;boardPaint();e.preventDefault()}
    return;
  }
  if(gameOn&&!modalOn&&!resOn&&G){boardKey(e);return}
  if(modalOn||resOn||gameOn)return;
  if((e.key===' '||e.key==='Enter')&&worldLive()&&WS.near){interact();e.preventDefault();return}
  const n=(e.key&&e.key.length===1)?'12345'.indexOf(e.key):-1;
  if(n>=0){go(['play','inv','mkt','sea','eco'][n]);e.preventDefault()}
});

let tapT=0,tapId=null;
function tapNft(id,ev){
  // Col mouse il doppio clic è un evento vero: si usa quello. Il cronometro
  // globale apriva il dettaglio della card B se si toccava A e subito dopo B.
  if(ev&&ev.detail>=2){tapT=0;tapId=null;nftDetail(id);return}
  const t=now();
  if(id===tapId&&t-tapT<330){tapT=0;tapId=null;nftDetail(id);return}
  tapT=t; tapId=id;
  equip(id);
}

  promo(m){closeModal();doMove(m)},
  use(id){equip(id);closeModal();renderInv()},

  buyTicket, conv:convertToCoins,
  claimQ:claimQuest, connect:connectWallet, openWallet,
  buy:buyListing, cancel:cancelListing,
  bid(lid){const v=+($('#bidAmt')||{}).value;placeBid(lid,v);closeModal()},
  doSell(id,kind){const v=+($('#sPrice')||{}).value;if(v>0){listNft(id,v,kind,24);closeModal()}},
  withdraw(){const v=+($('#wAmt')||{}).value;requestWithdraw(v);closeModal()},
  dep(v){deposit(v)},
  stars(){deposit(1500);toast('Pagamento Stars simulato: +1.500 ◈')},
  stake(v){if(v>snk()){toast('◈ insufficienti');return}
    post('stake',null,[[ACC.pSnk,-v],[ACC.treas,v]]);
    DB.player.stake+=v;save();toast('Stake attivo — la Sala d\'Onore si apre');
    openWallet();renderAll()},
  doVerify(id,btn){
    const r=DB.replays.find(x=>x.id===id);if(!r)return;
    if(btn)btn.textContent='…';
    setTimeout(()=>{
      const v=verifyReplay(r);
      const msg=v.ok
        ? '✓ Replay verificato: rigiocando le '+r.moves.length+' mosse si ottiene la stessa posizione finale ('+v.got+'). Ogni mossa era legale.'
        : '✗ Divergenza: atteso '+v.want+', ottenuto '+v.got+'.';
      const el=$('#vres');
      if(el){el.innerHTML='<span style="color:'+(v.ok?'var(--ac)':'var(--dan)')+'">'+msg+'</span>'}
      else toast(v.ok?'✓ Replay verificato':'✗ Replay divergente');
      if(btn)btn.textContent='Verifica';
    },30);
  },
  reset(ev){
    const b=ev&&ev.target;
    if(b&&!b.dataset.armed){
      b.dataset.armed='1';b.textContent='Sicuro? Tocca di nuovo per cancellare';
      setTimeout(()=>{if(b){delete b.dataset.armed;b.textContent='Azzera tutti i dati'}},3000);
      return;
    }
    try{localStorage.removeItem(KEY)}catch(e){}
    WS=null; G=null;
    genesis(); refreshQuests(); go('play'); renderAll();
    toast('Dati azzerati — si riparte da capo');
  },
  _:{DB:()=>DB,getG:()=>G,getWS:()=>WS,post,ledgerOk,newGame,legalMoves,genMoves,make,unmake,
     play,gameOver,fen,posKey,toSan,toUci,fromUci,evaluate,think,botMove,bookMove,finalize,

     randomOpponent,openTable,worldStep:()=>WS&&worldStep(.016),
     worldDraw:ts=>WS&&worldDraw(ts||0),bakeOf:()=>WS&&WS.bg,
     lay:()=>({classi:document.body.className,BS,DPR,LAY,zoom:WS&&WS.zoom,
       vwW:WS&&WS.vwW,vhW:WS&&WS.vhW,spd:WS&&WS.spd,bgS:WS&&WS.bgS}),
     applyLayout,onViewportChange,worldResize,boardSize,renderMoves,
     drag:()=>DRAG,hover:()=>HOVER,kbd:()=>KBD,boardKey,evSqAt:(x,y)=>{
       const r=cv.getBoundingClientRect();

     genesis:()=>{WS=null;genesis();refreshQuests();go('play')}}
};

function genesis(){
  DB=fresh();
  post('welcome_grant',null,[[ACC.emis,-1500],[ACC.pSnk,1500]]);
  post('welcome_coins',null,[[ACC.emis,-2000],[ACC.pCoin,2000]]);
  DB.eco.minted+=1500;
  const s=mint('st_legno','starter');
  DB.loadout.set=s.id;
  for(let i=0;i<12;i++)DB.market.listings.push(genListing());
  G=null;
  save();
}
