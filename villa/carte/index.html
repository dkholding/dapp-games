<!doctype html><html lang="it"><head><meta charset="utf-8">

<title>La Villa · Carte</title>
<style>
:root{--mare:#0d1b24;--avorio:#f4ead2;--oro:#d8b262;--testo:#efe6d2;--tenue:#b9ab8e}
*{box-sizing:border-box}

body{overflow:hidden}

button{font:inherit;color:inherit;cursor:pointer}

.chi{display:flex;align-items:center;gap:8px;min-width:0}

@media (max-width:480px){#nomeG{display:none}.luogo{font-size:14px}.tondo{min-width:40px;min-height:40px}}
.tondo{min-width:44px;min-height:44px;border-radius:22px;border:1px solid #ffffff22;background:#ffffff0d}
#schermoSala{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center}
.sala{width:100%;max-width:960px}
h1{font-family:Georgia,serif;font-weight:normal;margin:6px 0 2px;font-size:clamp(26px,5vw,36px);color:var(--avorio)}
.tag{color:var(--tenue);margin:0 0 16px}

.gioco{font-family:Georgia,serif;font-size:22px;color:var(--avorio)}
.formula,.livello{color:var(--tenue);font-size:13px}
.siediti{margin-top:10px;align-self:stretch;text-align:center;padding:11px;border-radius:10px;background:var(--oro);color:#2a1a10;font-weight:600}
.stat{margin-top:18px;color:var(--tenue);font-size:13px}
#schermoTavolo{flex:1;display:flex;flex-direction:column;min-height:0}
.testaTavolo{display:flex;align-items:center;gap:10px;padding:4px 8px}

#impronta{font-size:12px;color:var(--tenue);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.contenitoreTela{flex:1;position:relative;min-height:0;margin:0 6px 6px}
#tela{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}

.finestra{background:#16242c;border:1px solid #d8b26255;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));

@media (min-width:700px) and (min-height:500px){#velo{align-items:center}.finestra{border-radius:18px}}
@media (max-height:480px){
  #app:has(#schermoTavolo:not([hidden])) header.barra{display:none}
  .testaTavolo{padding:2px 8px}

}

.finestra h2.perso{color:#e7a397}
.finestra p{margin:6px 0}
.azioni{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

.punteggio{font-size:22px}
.nota{color:var(--tenue);font-size:13px}

#schermoMondo{flex:1;display:flex;flex-direction:column;min-height:0}

.piu{color:#9fe0a0}.meno{color:#f0a090}
.soldi{font-size:18px;font-weight:600;margin:6px 0}
.azioni button:disabled{opacity:.45}

<div id="app">

<script>globalThis.INGRESSO="carte";
// ---- motore/base.js
(function(V){'use strict';
// Costanti SHA-256 ricavate dai numeri primi, così non servono tabelle scritte a mano.
const K=[],H0=[];
{ const frac=x=>((x-Math.floor(x))*4294967296)|0; let n=2,c=0;
  while(c<64){ let primo=true; for(let f=2;f*f<=n;f++) if(n%f===0){primo=false;break}
    if(primo){ if(c<8) H0[c]=frac(Math.sqrt(n)); K[c]=frac(Math.cbrt(n)); c++; } n++; } }

// Impronta del seme: si mostra prima della partita, il seme dopo.
V.sha256=function(testo){
  const b=Array.from(new TextEncoder().encode(testo)); const bit=b.length*8;
  b.push(0x80); while(b.length%64!==56) b.push(0);
  const hi=Math.floor(bit/4294967296), lo=bit>>>0;
  b.push(hi>>>24&255,hi>>>16&255,hi>>>8&255,hi&255,lo>>>24&255,lo>>>16&255,lo>>>8&255,lo&255);
  const H=H0.slice(), w=new Array(64);
  for(let o=0;o<b.length;o+=64){
    for(let i=0;i<16;i++) w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
    for(let i=16;i<64;i++){ const x=w[i-15], y=w[i-2];
      const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
      const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const t1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&bb)^(a&c)^(bb&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0; }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+bb)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
};

// Numeri casuali ripetibili (mulberry32) a partire da un'impronta esadecimale.
V.rng=function(hex){ let s=parseInt(hex.slice(0,8),16)>>>0;
  return function(){ s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s);
    t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; };

V.mescola=function(arr,seme){ const r=V.rng(V.sha256(String(seme))), a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

V.clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
})(globalThis.V=globalThis.V||{});

// ---- motore/salvataggio.js
(function(V){'use strict';
// Salvataggi della Villa: il giocatore è uno solo, ogni zona ha la sua chiave.
// Se il browser blocca il salvataggio si continua in memoria.
V.archivio=function(storage){
  let s=storage;
  if(s===undefined){ try{ s=globalThis.localStorage||null; }catch(e){ s=null; } }
  const memoria={};
  const leggi=k=>{
    let t=null;
    try{ t=s?s.getItem(k):null; }catch(e){ t=null; }
    if(t==null) t=memoria[k]??null;
    if(t==null) return null;
    try{ return JSON.parse(t); }catch(e){ return null; }
  };
  const scrivi=(k,v)=>{
    const t=JSON.stringify(v); memoria[k]=t;
    try{ if(s) s.setItem(k,t); }catch(e){ /* resta in memoria */ }
  };
  return {
    giocatore:()=>leggi('villa.giocatore.v1')||{nome:'',aspetto:0},
    salvaGiocatore:g=>scrivi('villa.giocatore.v1',g),
    zona:id=>leggi('villa.'+id+'.v1')||{},
    salvaZona:(id,dati)=>scrivi('villa.'+id+'.v1',dati)
  };
};
})(globalThis.V=globalThis.V||{});

// ---- motore/suoni.js
(function(V){'use strict';
// Suoni sintetizzati con WebAudio (nessun file audio) e vibrazione.
let ac=null, muto=false;
V.audio={
  attiva(){ try{
    if(!ac){ const C=globalThis.AudioContext||globalThis.webkitAudioContext; if(C) ac=new C(); }
    if(ac&&ac.state==='suspended') ac.resume();
  }catch(e){} },
  muto(m){ if(m!==undefined) muto=!!m; return muto; }
};

function tono(f,dur,tipo,vol,ritardo){
  const t=ac.currentTime+ritardo, o=ac.createOscillator(), g=ac.createGain();
  o.type=tipo; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}
function fruscio(dur,vol,ritardo,freq){
  const t=ac.currentTime+ritardo, n=Math.floor(ac.sampleRate*dur);
  const b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=b; f.type='bandpass'; f.frequency.value=freq; g.gain.value=vol;
  s.connect(f).connect(g).connect(ac.destination); s.start(t);
}
const SUONI={
  carta:()=>fruscio(.09,.35,0,3000),
  presa:()=>{ fruscio(.06,.3,0,1800); fruscio(.06,.3,.07,1500); },
  scopa:()=>[523,659,784,1047].forEach((f,i)=>tono(f,.18,'triangle',.18,i*.08)),
  tic:()=>tono(1400,.05,'square',.04,0),
  clic:()=>tono(900,.04,'sine',.07,0),
  vittoria:()=>[523,659,784,1047,1319].forEach((f,i)=>tono(f,.25,'triangle',.16,i*.11)),
  sconfitta:()=>[392,349,311,262].forEach((f,i)=>tono(f,.3,'sine',.14,i*.14))
};
V.suono=function(nome){
  if(muto||!ac||ac.state!=='running') return;
  try{ if(SUONI[nome]) SUONI[nome](); }catch(e){}
};
V.vibra=function(tipo){
  try{
    const h=globalThis.Telegram&&globalThis.Telegram.WebApp&&globalThis.Telegram.WebApp.HapticFeedback;
    if(h){ if(tipo==='successo') h.notificationOccurred('success'); else h.impactOccurred(tipo==='forte'?'heavy':'light'); return; }
    if(globalThis.navigator&&navigator.vibrate) navigator.vibrate(tipo==='forte'?[30,40,60]:tipo==='successo'?[20,30,20]:12);
  }catch(e){}
};
})(globalThis.V=globalThis.V||{});

// ---- motore/geometria.js
(function(V){'use strict';
// Geometria del mondo: muri, urti e percorsi. Niente DOM: si prova in node.
const SPESSORE=16;

// Muro lungo un asse con aperture [[da,a],...] misurate sullo stesso asse.
V.muro=function(x1,y1,x2,y2,aperture){
  const orizz=y1===y2, a0=orizz?Math.min(x1,x2):Math.min(y1,y2), a1=orizz?Math.max(x1,x2):Math.max(y1,y2);
  const buchi=(aperture||[]).map(([p,q])=>[Math.min(p,q),Math.max(p,q)]).sort((p,q)=>p[0]-q[0]);
  const pezzi=[]; let da=a0;
  for(const [p,q] of buchi){ if(p>da) pezzi.push([da,p]); da=Math.max(da,q); }
  if(da<a1) pezzi.push([da,a1]);
  return pezzi.map(([p,q])=>orizz
    ?{x:p,y:y1-SPESSORE/2,w:q-p,h:SPESSORE}
    :{x:x1-SPESSORE/2,y:p,w:SPESSORE,h:q-p});
};

// Spinta per far uscire un cerchio da un rettangolo (null se non si toccano).
V.urtoRett=function(cx,cy,r,q){
  const nx=V.clamp(cx,q.x,q.x+q.w), ny=V.clamp(cy,q.y,q.y+q.h), dx=cx-nx, dy=cy-ny, d2=dx*dx+dy*dy;
  if(d2>=r*r) return null;
  if(d2===0){
    const l=cx-q.x, rr=q.x+q.w-cx, t=cy-q.y, b=q.y+q.h-cy, m=Math.min(l,rr,t,b);
    if(m===l) return {x:-(l+r),y:0}; if(m===rr) return {x:rr+r,y:0};
    if(m===t) return {x:0,y:-(t+r)}; return {x:0,y:b+r};
  }
  const d=Math.sqrt(d2); return {x:dx/d*(r-d),y:dy/d*(r-d)};
};
V.urtoCerchio=function(cx,cy,r,c){
  const dx=cx-c.x, dy=cy-c.y, d=Math.hypot(dx,dy), min=r+c.r;
  if(d>=min) return null;
  if(d===0) return {x:min,y:0};
  return {x:dx/d*(min-d),y:dy/d*(min-d)};
};

// Mappa camminabile: ostacoli = {rett:[...], cerchi:[...]}.
V.Griglia=class{
  constructor(larghezza,altezza,ostacoli,raggio,cella=20){
    this.c=cella; this.nx=Math.ceil(larghezza/cella); this.ny=Math.ceil(altezza/cella);
    this.ost=ostacoli; this.r=raggio;
    this.bloccata=new Uint8Array(this.nx*this.ny);
    for(let j=0;j<this.ny;j++) for(let i=0;i<this.nx;i++)
      this.bloccata[j*this.nx+i]=this.libero((i+0.5)*cella,(j+0.5)*cella)?0:1;
  }
  libero(x,y,r=this.r){
    for(const q of this.ost.rett) if(V.urtoRett(x,y,r,q)) return false;
    for(const c of this.ost.cerchi) if(V.urtoCerchio(x,y,r,c)) return false;
    return true;
  }
  cellaDi(x,y){ return [V.clamp(Math.floor(x/this.c),0,this.nx-1),V.clamp(Math.floor(y/this.c),0,this.ny-1)]; }
  aperta(i,j){ return i>=0&&j>=0&&i<this.nx&&j<this.ny&&!this.bloccata[j*this.nx+i]; }
  vicinaLibera(i,j){
    if(this.aperta(i,j)) return [i,j];
    for(let raggio=1;raggio<12;raggio++)
      for(let dj=-raggio;dj<=raggio;dj++) for(let di=-raggio;di<=raggio;di++)
        if(Math.max(Math.abs(di),Math.abs(dj))===raggio&&this.aperta(i+di,j+dj)) return [i+di,j+dj];
    return null;
  }
  // Tratto percorribile: campiona ogni mezza cella.
  visibile(ax,ay,bx,by){
    const d=Math.hypot(bx-ax,by-ay), n=Math.ceil(d/(this.c/2));
    for(let k=1;k<n;k++){ const t=k/n, [i,j]=this.cellaDi(ax+(bx-ax)*t,ay+(by-ay)*t); if(!this.aperta(i,j)) return false; }
    return true;
  }
  // A* a 8 direzioni senza tagliare gli spigoli, poi il percorso si stira.
  percorso(ax,ay,bx,by){
    const s=this.vicinaLibera(...this.cellaDi(ax,ay)), g=this.vicinaLibera(...this.cellaDi(bx,by));

      const d=Math.hypot(this.p.x-c.x,this.p.y-c.y)||1, raggio=obj.tipo==='tavolo'?obj.ogg.r+40:Math.max(obj.ogg.w,obj.ogg.h)/2+34;
      this.vaiA(c.x+(this.p.x-c.x)/d*raggio,c.y+(this.p.y-c.y)/d*raggio); this.azioneInSospeso=obj;
    } else { this.azioneInSospeso=null; this.vaiA(w.x,w.y); }
  }
  tasto(e,giu){
    if(this.pausa||e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const k=e.key.toLowerCase();
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
      if(giu){ this.tasti.add(k); this.percorso=null; this.meta=null; this.azioneInSospeso=null; } else this.tasti.delete(k);
      e.preventDefault(); return;
    }
    if(giu&&(k==='enter'||k===' '||k==='e')&&this.vicino){ e.preventDefault(); this.attiva(this.vicino); }
  }
  vaiA(x,y){
    const p=this.griglia.percorso(this.p.x,this.p.y,x,y);
    this.percorso=p&&p.length?p:null; this.meta=this.percorso?this.percorso[this.percorso.length-1]:null;
  }
  attiva(obj){ this.azioneInSospeso=null; this.percorso=null; this.meta=null; if(this.op.alAttiva) this.op.alAttiva(obj); }

  // ---- movimento ---------------------------------------------------------
  muovi(ent,dx,dy,dt,vel){
    const len=Math.hypot(dx,dy); if(len<0.001) return false;
    const passo=Math.min(vel*dt,len);
    ent.x+=dx/len*passo; ent.y+=dy/len*passo; ent.dir=Math.atan2(dy,dx); ent.passo+=passo;
    for(let giro=0;giro<3;giro++){
      let spinto=false;
      for(const q of this.ost.rett){ const s=V.urtoRett(ent.x,ent.y,RAGGIO,q); if(s){ ent.x+=s.x; ent.y+=s.y; spinto=true; } }
      for(const c of this.ost.cerchi){ const s=V.urtoCerchio(ent.x,ent.y,RAGGIO,c); if(s){ ent.x+=s.x; ent.y+=s.y; spinto=true; } }
      if(!spinto) break;
    }
    return true;
  }
  seguiPercorso(ent,dt,vel){
    if(!ent.percorso||!ent.percorso.length) return false;
    const q=ent.percorso[0], dx=q.x-ent.x, dy=q.y-ent.y;
    if(Math.hypot(dx,dy)<6){ ent.percorso.shift(); return ent.percorso.length>0; }
    this.muovi(ent,dx,dy,dt,vel); return true;
  }

  fotogramma(t){
    const tot=Math.min(0.3,Math.max(0,(t-this.t)/1000)); this.t=t;
    const passi=Math.max(1,Math.ceil(tot/0.034));
    for(let k=0;k<passi;k++) this.aggiorna(tot/passi,t);
    this.disegna(t);
  }

  aggiorna(dt,t){
    // giocatore
    let dx=0, dy=0;
    if(this.tasti.has('a')||this.tasti.has('arrowleft')) dx--;
    if(this.tasti.has('d')||this.tasti.has('arrowright')) dx++;
    if(this.tasti.has('w')||this.tasti.has('arrowup')) dy--;
    if(this.tasti.has('s')||this.tasti.has('arrowdown')) dy++;
    if(this.joy&&this.tocco){ const jx=this.tocco.x-this.joy.cx, jy=this.tocco.y-this.joy.cy, l=Math.hypot(jx,jy);
      if(l>8){ dx=jx/l*Math.min(1,l/50); dy=jy/l*Math.min(1,l/50); } }
    if(dx||dy) this.muovi(this.p,dx,dy,dt,VELOCITA*Math.min(1,Math.hypot(dx,dy)));
    else if(this.percorso){ this.p.percorso=this.percorso; if(!this.seguiPercorso(this.p,dt,VELOCITA)){ this.percorso=null; this.meta=null; } }

    // avventori
    for(const a of this.avventori){
      if(a.attesa>0){ a.attesa-=dt; continue; }
      if(!this.seguiPercorso(a,dt,85)){
        const stanze=this.m.stanze.filter(s=>!s.esterna&&!s.livelloMin), s=stanze[Math.floor(a.r()*stanze.length)], p=this.puntoLibero(s,a.r);
        a.percorso=this.griglia.percorso(a.x,a.y,p.x,p.y); a.attesa=2+a.r()*5;
      }
    }

    // cosa c'è vicino
    let vic=null, best=Infinity;
    for(const k of this.m.tavoli){ const d=Math.hypot(this.p.x-k.x,this.p.y-k.y)-k.r; if(d<VICINO&&d<best){ best=d; vic={tipo:'tavolo',ogg:k}; } }
    for(const a of this.m.arredi||[]){ if(!a.azione) continue;
      const nx=V.clamp(this.p.x,a.x,a.x+a.w), ny=V.clamp(this.p.y,a.y,a.y+a.h), d=Math.hypot(this.p.x-nx,this.p.y-ny);
      if(d<VICINO&&d<best){ best=d; vic={tipo:'arredo',ogg:a}; } }
    for(const c of this.cancelli){ if(c.aperto) continue;
      const nx=V.clamp(this.p.x,c.x,c.x+c.w), ny=V.clamp(this.p.y,c.y,c.y+c.h);
      if(Math.hypot(this.p.x-nx,this.p.y-ny)<VICINO&&!vic) vic={tipo:'cancello',ogg:c}; }
    if((vic&&vic.ogg)!==(this.vicino&&this.vicino.ogg)){ this.vicino=vic; if(this.op.alVicino) this.op.alVicino(vic); }
    if(this.azioneInSospeso&&!this.percorso&&vic&&vic.ogg===this.azioneInSospeso.ogg) this.attiva(vic);

    // porte verso altre zone
    for(const p of this.porte){
      if(this.p.x>p.x&&this.p.x<p.x+p.w&&this.p.y>p.y&&this.p.y<p.y+p.h){ if(this.op.alPorta){ this.ferma(); this.op.alPorta(p); } break; }
    }
    // stanza
    const st=this.stanzaIn(this.p.x,this.p.y);
    if(st!==this.stanza){ this.stanza=st; if(st){ this.scritta={testo:st.nome,sotto:st.tag||'',da:t}; if(this.op.alStanza) this.op.alStanza(st); } }
  }

  // ---- disegno -----------------------------------------------------------
  disegna(t){
    const c=this.ctx, cam=this.camera(), m=this.m, s=cam.s;
    c.setTransform(this.dpr,0,0,this.dpr,0,0);
    c.fillStyle='#0b2533'; c.fillRect(0,0,this.W,this.H);
    c.setTransform(this.dpr*s,0,0,this.dpr*s,-cam.x*s*this.dpr,-cam.y*s*this.dpr);
    const vis={x:cam.x-50,y:cam.y-50,w:this.W/s+100,h:this.H/s+100};

    if(m.mare) this.disegnaMare(c,vis,t);
    for(const st of m.stanze){ c.fillStyle=motivo(c,st.pavimento); c.fillRect(st.x,st.y,st.w,st.h); }
    for(const a of m.arredi||[]) if(a.pavimento) this.disegnaArredo(c,a,t);
    for(const a of m.arredi||[]) if(!a.pavimento) this.disegnaArredo(c,a,t);
    for(const k of m.tavoli) this.disegnaTavolo(c,k,t);

    const gente=[...this.avventori.map(a=>({...a,proprio:false})),{...this.p,proprio:true}].sort((a,b)=>a.y-b.y);
    for(const g of gente) this.disegnaPersona(c,g,t);

    for(const w of m.muri){ c.fillStyle='#3b2c22'; c.fillRect(w.x,w.y,w.w,w.h); c.fillStyle='#6d5543'; c.fillRect(w.x,w.y,w.w,Math.min(4,w.h)); }
    for(const w of m.vetrate||[]){ c.fillStyle='rgba(170,220,240,.35)'; c.fillRect(w.x,w.y,w.w,w.h);
      c.strokeStyle='#e8dcc0'; c.lineWidth=2; c.strokeRect(w.x,w.y,w.w,w.h);
      c.beginPath(); for(let x=w.x;x<w.x+w.w;x+=60){ c.moveTo(x,w.y); c.lineTo(x,w.y+w.h); } c.stroke(); }
    for(const q of this.ost.rett) if(q.chiusa){ c.fillStyle='#3b2c22'; c.fillRect(q.x,q.y,q.w,q.h); }
    for(const p of this.porte){ c.fillStyle='rgba(216,178,98,.25)'; c.fillRect(p.x,p.y,p.w,p.h); }
    for(const k of this.cancelli) if(!k.aperto){ c.fillStyle='#8a6a2a'; c.fillRect(k.x,k.y,k.w,k.h);
      c.strokeStyle='#e0b75a'; c.lineWidth=2; c.beginPath(); const lungo=k.w>k.h;
      for(let i=6;i<(lungo?k.w:k.h);i+=10){ if(lungo){ c.moveTo(k.x+i,k.y); c.lineTo(k.x+i,k.y+k.h); } else { c.moveTo(k.x,k.y+i); c.lineTo(k.x+k.w,k.y+i); } } c.stroke(); }

    if(this.meta){ const a=0.5+0.5*Math.sin(t/150); c.strokeStyle=`rgba(255,214,107,${a})`; c.lineWidth=3; c.beginPath(); c.arc(this.meta.x,this.meta.y,12,0,7); c.stroke(); }
    if(this.vicino&&this.vicino.tipo==='tavolo'){ const k=this.vicino.ogg; c.strokeStyle='#ffd66b'; c.lineWidth=4; c.setLineDash([10,8]); c.lineDashOffset=-t/40;
      c.beginPath(); c.arc(k.x,k.y,k.r+24,0,7); c.stroke(); c.setLineDash([]); }

    // luce del giorno
    c.setTransform(this.dpr,0,0,this.dpr,0,0);
    const ora=new Date().getHours()+new Date().getMinutes()/60;
    const tinta=ora>=21||ora<6?'rgba(10,20,60,.28)':ora>=18?'rgba(255,120,40,.10)':ora<8?'rgba(255,190,120,.08)':null;
    if(tinta){ c.fillStyle=tinta; c.fillRect(0,0,this.W,this.H); }
    this.disegnaInterfaccia(c,t);
  }

  disegnaMare(c,vis,t){
    const m=this.m, y0=m.mare.y;
    const g=c.createLinearGradient(0,vis.y,0,y0); g.addColorStop(0,'#0d3b5a'); g.addColorStop(1,'#1d6f8f');
    c.fillStyle=g; c.fillRect(vis.x,Math.min(vis.y,y0-10),vis.w,y0-Math.min(vis.y,y0-10));
    c.strokeStyle='rgba(255,255,255,.18)'; c.lineWidth=2;
    for(let row=0,y=y0-30;y>vis.y&&row<40;y-=38,row++){
      c.beginPath();
      for(let x=vis.x-40;x<vis.x+vis.w+40;x+=12){ const yy=y+Math.sin(x/60+t/900+row)*4; if(x===vis.x-40) c.moveTo(x,yy); else c.lineTo(x,yy); }
      c.stroke();
    }
    // scogliera
    c.fillStyle='#6b5a48'; c.beginPath(); c.moveTo(vis.x,y0);
    for(let x=Math.floor(vis.x/30)*30;x<vis.x+vis.w+30;x+=30) c.lineTo(x,y0-8-((x*7919)%17));
    c.lineTo(vis.x+vis.w,y0+30); c.lineTo(vis.x,y0+30); c.closePath(); c.fill();
    c.fillStyle='rgba(255,255,255,.35)';
    for(let x=Math.floor(vis.x/45)*45;x<vis.x+vis.w;x+=45){ const a=0.5+0.5*Math.sin(t/500+x); c.globalAlpha=a*0.6; c.fillRect(x,y0-14-((x*31)%9),18,3); }
    c.globalAlpha=1;
  }

  disegnaArredo(c,a,t){
    c.save();
    const tondo=(x,y,w,h,r)=>{ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); };
    const ombra=()=>{ c.fillStyle='rgba(0,0,0,.25)'; tondo(a.x+5,a.y+7,a.w,a.h,8); c.fill(); };
    switch(a.tipo){
      case 'tappeto': c.fillStyle=a.colore||'#7a1f2b'; tondo(a.x,a.y,a.w,a.h,6); c.fill(); c.strokeStyle='#d8b26288'; c.lineWidth=4; tondo(a.x+10,a.y+10,a.w-20,a.h-20,4); c.stroke(); break;
      case 'bancone': ombra(); c.fillStyle='#5a3920'; tondo(a.x,a.y,a.w,a.h,10); c.fill(); c.fillStyle='#8a5a35'; tondo(a.x+6,a.y+6,a.w-12,a.h-12,6); c.fill();
        for(let y=a.y+30;y<a.y+a.h-20;y+=46){ c.fillStyle='#d8e8e0'; c.beginPath(); c.arc(a.x+a.w/2,y,6,0,7); c.fill(); } break;
      case 'divano': ombra(); c.fillStyle=a.colore||'#6b1e2b'; tondo(a.x,a.y,a.w,a.h,14); c.fill(); c.fillStyle='rgba(255,255,255,.12)'; tondo(a.x+8,a.y+8,a.w-16,a.h-16,10); c.fill(); break;
      case 'libreria': ombra(); c.fillStyle='#4a2e1a'; c.fillRect(a.x,a.y,a.w,a.h);
        { const col=['#a33','#36a','#393','#b83','#636','#aa6']; let k=0; const lungo=a.w>a.h;
          for(let i=4;i<(lungo?a.w:a.h)-4;i+=9){ c.fillStyle=col[k++%col.length]; if(lungo) c.fillRect(a.x+i,a.y+4,6,a.h-8); else c.fillRect(a.x+4,a.y+i,a.w-8,6); } } break;
      case 'pianta': c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.arc(a.x+a.w/2+4,a.y+a.h/2+6,a.w/2,0,7); c.fill();
        c.fillStyle='#7a4a2a'; c.beginPath(); c.arc(a.x+a.w/2,a.y+a.h/2,a.w/2*0.55,0,7); c.fill();
        for(let i=0;i<7;i++){ const ang=i/7*6.28+Math.sin(t/1200+i)*0.05; c.fillStyle=i%2?'#3f7a36':'#4f9244'; c.beginPath(); c.ellipse(a.x+a.w/2+Math.cos(ang)*a.w*0.25,a.y+a.h/2+Math.sin(ang)*a.h*0.25,a.w*0.28,a.w*0.12,ang,0,7); c.fill(); } break;
      case 'statua': c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.arc(a.x+a.w/2+5,a.y+a.h/2+7,a.w/2,0,7); c.fill();
        c.fillStyle='#d9d4c7'; c.fillRect(a.x,a.y,a.w,a.h); c.fillStyle='#f2efe7'; c.beginPath(); c.arc(a.x+a.w/2,a.y+a.h/2,a.w*0.3,0,7); c.fill(); break;
      case 'fontana': c.fillStyle='#bdb6a6'; c.beginPath(); c.arc(a.x+a.w/2,a.y+a.h/2,a.w/2,0,7); c.fill();
        c.fillStyle='#3a8fb0'; c.beginPath(); c.arc(a.x+a.w/2,a.y+a.h/2,a.w/2-10,0,7); c.fill();
        c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=2; for(let k=0;k<3;k++){ const r=((t/30+k*20)%(a.w/2-12)); c.beginPath(); c.arc(a.x+a.w/2,a.y+a.h/2,r,0,7); c.stroke(); } break;
      case 'cipresso': c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(a.x+a.w/2+8,a.y+a.h/2+10,a.w/2,a.h/2,0,0,7); c.fill();
        c.fillStyle='#24452a'; c.beginPath(); c.ellipse(a.x+a.w/2,a.y+a.h/2,a.w/2,a.h/2,0,0,7); c.fill(); c.fillStyle='#2f5a36'; c.beginPath(); c.ellipse(a.x+a.w/2-4,a.y+a.h/2-4,a.w/3,a.h/3,0,0,7); c.fill(); break;
      case 'ringhiera': c.fillStyle='#e8e1d0'; c.fillRect(a.x,a.y,a.w,a.h); c.fillStyle='#b8ad96'; for(let x=a.x;x<a.x+a.w;x+=18) c.fillRect(x,a.y,6,a.h); break;
      case 'bacheca': case 'banco': case 'portineria': {
        ombra(); c.fillStyle=a.tipo==='bacheca'?'#2a3b2e':a.tipo==='banco'?'#5a3920':'#34404a'; tondo(a.x,a.y,a.w,a.h,8); c.fill();
        c.strokeStyle='#d8b262'; c.lineWidth=3; c.stroke();
        const pulsa=0.6+0.4*Math.sin(t/400);
        c.fillStyle=`rgba(255,214,107,${pulsa})`; c.font='700 22px Georgia,serif'; c.textAlign='center'; c.textBaseline='middle';
        c.fillText(a.icona||'★',a.x+a.w/2,a.y+a.h/2+1);
        break; }
      default: ombra(); c.fillStyle=a.colore||'#555'; tondo(a.x,a.y,a.w,a.h,8); c.fill();
    }
    c.restore();
  }

  disegnaTavolo(c,k,t){
    const posti=k.giocatori||2, colTav=k.panno||'#1f6a45';
    for(let i=0;i<posti;i++){ const ang=Math.PI/2+i*2*Math.PI/posti, x=k.x+Math.cos(ang)*(k.r+16), y=k.y+Math.sin(ang)*(k.r+16);
      c.fillStyle='#4a2e1a'; c.beginPath(); c.arc(x,y,11,0,7); c.fill(); }
    c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.arc(k.x+6,k.y+9,k.r+6,0,7); c.fill();
    c.fillStyle='#6b4226'; c.beginPath(); if(k.forma==='quadrato') c.rect(k.x-k.r-6,k.y-k.r-6,2*k.r+12,2*k.r+12); else c.arc(k.x,k.y,k.r+6,0,7); c.fill();
    c.fillStyle=colTav; c.beginPath(); if(k.forma==='quadrato') c.rect(k.x-k.r,k.y-k.r,2*k.r,2*k.r); else c.arc(k.x,k.y,k.r,0,7); c.fill();
    if(this.op.disegnaSulTavolo) this.op.disegnaSulTavolo(c,k,t);
    // i giocatori del tavolo seduti (tutti tranne il posto libero, in basso)
    for(let i=1;i<posti;i++){ const ang=Math.PI/2+i*2*Math.PI/posti, x=k.x+Math.cos(ang)*(k.r+16), y=k.y+Math.sin(ang)*(k.r+16);
      this.disegnaPersona(c,{x,y,dir:ang+Math.PI,passo:0,colore:V.COLORI_ABITO[(k.x+k.y+i)%V.COLORI_ABITO.length],pelle:PELLE[(k.x+i)%PELLE.length],seduto:true},t); }
    if(k.etichetta){ c.font='600 15px system-ui,sans-serif'; c.textAlign='center'; c.textBaseline='middle';
      const w=c.measureText(k.etichetta).width+18, y=k.y-k.r-44;
      c.fillStyle='rgba(11,26,18,.8)'; c.beginPath(); c.roundRect?c.roundRect(k.x-w/2,y-13,w,26,13):c.rect(k.x-w/2,y-13,w,26); c.fill();
      c.fillStyle='#f4ead2'; c.fillText(k.etichetta,k.x,y+1); }
  }

  disegnaPersona(c,g,t){
    const oscilla=g.seduto?0:Math.sin(g.passo/7)*3;
    c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(g.x+3,g.y+8,RAGGIO,RAGGIO*0.6,0,0,7); c.fill();
    c.save(); c.translate(g.x,g.y); c.rotate(g.dir||0);
    c.fillStyle=g.colore; c.beginPath(); c.ellipse(0,oscilla*0.3,RAGGIO*0.8,RAGGIO,0,0,7); c.fill();
    c.fillStyle='rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(-3,0,RAGGIO*0.5,RAGGIO*0.8,0,0,7); c.fill();
    c.fillStyle=g.pelle||PELLE[0]; c.beginPath(); c.arc(4,0,RAGGIO*0.55,0,7); c.fill();
    c.restore();
    if(g.proprio){
      c.strokeStyle='#ffd66b'; c.lineWidth=2.5; c.beginPath(); c.arc(g.x,g.y,RAGGIO+5,0,7); c.stroke();
      const nome=this.op.nome||''; if(nome){ c.font='700 13px system-ui,sans-serif'; c.textAlign='center'; c.textBaseline='middle';
        c.lineWidth=4; c.strokeStyle='rgba(0,0,0,.6)'; c.strokeText(nome,g.x,g.y-RAGGIO-14); c.fillStyle='#fff'; c.fillText(nome,g.x,g.y-RAGGIO-14); }
    }
  }

  disegnaInterfaccia(c,t){
    if(this.joy&&this.tocco){ c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=3; c.beginPath(); c.arc(this.joy.cx,this.joy.cy,50,0,7); c.stroke();
      const jx=this.tocco.x-this.joy.cx, jy=this.tocco.y-this.joy.cy, l=Math.hypot(jx,jy)||1, k=Math.min(1,50/l);
      c.fillStyle='rgba(255,214,107,.7)'; c.beginPath(); c.arc(this.joy.cx+jx*k,this.joy.cy+jy*k,20,0,7); c.fill(); }
    if(this.scritta){ const f=(t-this.scritta.da)/2600;
      if(f>=1) this.scritta=null;

  let righeSoldi='';
  if(s.posta){
    if(e.vinto){ const v=eco.vincitaPerGiocatore(s.posta,s.def.giocatori); eco.incassa(v,`Vincita · ${nomeGioco(st.gioco)}`); righeSoldi=`<p class="soldi piu">+${soldi(v)}</p>`; }
    else righeSoldi=`<p class="soldi meno">−${soldi(s.posta)}</p>`;
  }
  let torneoHtml='', azioni;
  if(s.torneo){
    const T=V.tornei, tab=s.torneo.tab, fase=T.nomeFase(tab.turni[tab.fase].length);
    T.avanza(tab,e.vinto,V.rng(V.sha256(s.torneo.id+':'+tab.fase)));
    eco.d.tornei.iscritti[s.torneo.id]={stato:'in corso',tab}; eco.salva();
    if(tab.posizione){
      const premio=T.premio(tab.posizione,s.torneo.iscrizione);
      if(premio) eco.incassa(premio,`Torneo · ${tab.posizione}° posto`);
      eco.d.tornei.iscritti[s.torneo.id]={stato:'finito',posizione:tab.posizione};
      eco.d.tornei.storico.unshift({id:s.torneo.id,gioco:st.gioco,posizione:tab.posizione,premio,t:adesso()}); eco.salva();
      torneoHtml=`<p class="soldi ${premio?'piu':''}">${tab.posizione===1?'🏆 Hai vinto il torneo!':`Torneo finito: ${tab.posizione===2?'secondo posto':tab.posizione===3?'semifinale':'fuori ai quarti'}`}${premio?` · +${soldi(premio)}`:''}</p>`;
      azioni=[{testo:"Torna nella Sala d'Onore",primario:true,fn:tornaAlMondo}];
    } else {
      const avv=T.avversario(tab);
      torneoHtml=`<p class="soldi piu">${esc(fase)} superata. Prossimo turno: ${esc(T.nomeFase(tab.turni[tab.fase].length))} contro ${esc(avv.nome)} (livello ${avv.livello}).</p>`;
      azioni=[{testo:'Gioca il prossimo turno',primario:true,fn:()=>giocaTorneo(s.torneo.id)},{testo:'Più tardi',fn:tornaAlMondo}];
    }
  }
  const ok=V.sha256(e.seme)===e.impronta;
  const svelato=s.buio?`<p class="nota">Il tuo avversario era <b>${esc(s.nomi[0])}</b>, livello ${s.def.livelli[0]}.</p>`:'';
  const livello=esito.salito?`<p class="soldi piu">Sei salito al livello ${esito.livello}!${esito.livello===5?" Si apre la Sala d'Onore.":''}</p>`:`<p class="nota">+${esito.xp} esperienza</p>`;
  const titolo=e.patta?'Patta':e.vinto?'Hai vinto!':'Hai perso';
  const et=st.n===4?['Noi','Loro']:['Tu',...s.nomi.slice(0,st.n-1)];
  finestra(`<h2 data-obbligatoria class="${e.vinto?'vinto':'perso'}">${titolo}</h2>
    ${st.punti&&st.punti.length===et.length?`<p class="punteggio">${et.map((n,i)=>`${esc(n)} ${esc(st.punti[i])}`).join(' – ')}</p>`:''}
    ${righeSoldi}${torneoHtml}${livello}${svelato}
    ${e.abbandono?'<p class="nota">Partita chiusa per abbandono.</p>':tabella(G,st)}
    <details class="verifica"><summary>Verifica la mescolata ${ok?'✔':'✖'}</summary>
      <p>Prima della partita il mazzo era sigillato con questa impronta:</p><code>${e.impronta}</code>
      <p>Il seme, rivelato adesso:</p><code id="semeRivelato">${e.seme}</code>
      <button class="copia" data-copia="${e.seme}" data-sorgente="semeRivelato">Copia il seme</button>
      <p class="nota">SHA-256 del seme ${ok?'corrisponde':'NON corrisponde'} all'impronta. La smazzata numero n si mescola con il seme seguito da «:n».</p>
    </details>`,
    azioni||[{testo:'Rivincita',primario:true,fn:()=>{ tornaAlMondo(); apriTavolo(s.def); }},{testo:'Alzati dal tavolo',fn:tornaAlMondo}]);
  aggiornaTesta();
}

// ---- tornei --------------------------------------------------------------
function statoTorneo(t){
  const isc=eco.d.tornei.iscritti[t.id], ora=adesso();
  if(isc&&isc.stato==='finito') return 'finito';
  if(ora<t.inizio) return isc?'iscritto':'aperto';
  if(ora<t.inizio+15*60*1000) return isc?'in corso':'chiuso';
  return isc&&isc.stato==='in corso'?'in corso':isc?'saltato':'chiuso';
}
function pannelloTornei(){
  const conf=zona.tornei, prog=V.tornei.programma(adesso(),conf.giochi,3,conf.iscrizione), liv=eco.livello();
  const righe=prog.map(t=>{
    const s=statoTorneo(t);
    const bottone=s==='aperto'?`<button data-iscrivi="${t.id}" ${liv<5?'disabled':''}>Iscriviti · ${soldi(t.iscrizione)}</button>`
      :s==='in corso'?`<button class="primario" data-gioca="${t.id}">Gioca</button>`
      :s==='iscritto'?'<span class="stato">Iscritto ✓</span>':s==='finito'?'<span class="stato">Concluso</span>':'<span class="stato">Chiuso</span>';
    return `<div class="riga-torneo"><div><b>${ore(t.inizio)}</b> · ${esc(nomeGioco(t.gioco))}<br><small>8 giocatori · premi ${soldi(t.iscrizione*4)} / ${soldi(t.iscrizione*2)} / ${soldi(t.iscrizione)}</small></div>${bottone}</div>`;
  }).join('');
  const storico=eco.d.tornei.storico.slice(0,5).map(x=>`<li>${esc(nomeGioco(x.gioco))}: ${x.posizione}°${x.premio?' · +'+soldi(x.premio):''}</li>`).join('');
  finestra(`<h2>Bacheca dei tornei</h2><p class="nota">Un torneo ogni mezz'ora. Iscriviti prima dell'orario e gioca al Tavolo d'Onore entro 15 minuti dall'inizio.${liv<5?' Serve il livello 5.':''}</p>
    ${righe}${storico?`<h3>I tuoi ultimi tornei</h3><ul>${storico}</ul>`:''}`,[{testo:'Chiudi',primario:true}],
    {alClic:e=>{
      const i=e.target.closest('[data-iscrivi]'), g=e.target.closest('[data-gioca]');
      if(i&&!i.disabled){ const t=prog.find(x=>x.id===i.dataset.iscrivi);
        if(!eco.paga(t.iscrizione,`Iscrizione torneo · ${nomeGioco(t.gioco)}`)) return avviso('Non hai abbastanza '+moneta().nome);
        eco.d.tornei.iscritti[t.id]={stato:'iscritto',gioco:t.gioco,inizio:t.inizio,iscrizione:t.iscrizione}; eco.salva();
        V.suono('clic'); aggiornaTesta(); pannelloTornei(); }
      if(g){ chiudiFinestra(); giocaTorneo(g.dataset.gioca); }
    }});
}
function giocaTorneo(id){
  const prog=V.tornei.programma(adesso()-60*60*1000,zona.tornei.giochi,6,zona.tornei.iscrizione), t=prog.find(x=>x.id===id);
  const isc=eco.d.tornei.iscritti[id]; if(!t||!isc) return;
  const tab=isc.tab||V.tornei.tabellone(t,V.NOMI_BOT);
  isc.stato='in corso'; isc.tab=tab; eco.salva();
  const avv=V.tornei.avversario(tab);
  if(!classeTavolo(t.gioco)) return avviso('Il tavolo di '+nomeGioco(t.gioco)+' è in allestimento');
  const def={id:'torneo-'+id,gioco:t.gioco,giocatori:2,tipo:'torneo',livelli:[avv.livello],secondi:/scala|burraco/.test(t.gioco)?20:8,breve:true};
  siediti(def,{posta:0,nomi:[avv.nome],torneo:{id,tab,iscrizione:t.iscrizione}});
}
// Rimborso dei tornei non giocati; avviso quando uno inizia.
function controllaTornei(){
  if(!eco) return;
  for(const [id,isc] of Object.entries(eco.d.tornei.iscritti)){
    if(isc.stato==='iscritto'&&adesso()>=isc.inizio&&adesso()<isc.inizio+15*60*1000&&!isc.avvisato){
      isc.avvisato=true; eco.salva(); avviso(`Il torneo di ${nomeGioco(isc.gioco)} è iniziato: vai al Tavolo d'Onore`,6000);
    }
    if(isc.stato==='iscritto'&&adesso()>=isc.inizio+15*60*1000){
      isc.stato='finito'; eco.incassa(isc.iscrizione,'Torneo saltato: iscrizione restituita'); eco.salva(); aggiornaTesta();
      avviso('Torneo saltato: iscrizione restituita');
    }
  }
}
setInterval(controllaTornei,5000);

// ---- negozio e portineria ------------------------------------------------
function apriArredo(azione){ if(azione==='tornei') pannelloTornei(); else if(azione==='negozio') pannelloNegozio(); else pannelloProfilo(); }
function pannelloNegozio(){
  const righe=eco.catalogo().map(o=>{
    const ha=eco.possiede(o.id), usa=eco.d.nft.equip===o.id;
    const b=usa?'<span class="stato">In uso</span>':ha?`<button data-usa="${o.id}">Usa</button>`:`<button data-compra="${o.id}" ${eco.saldo()<o.prezzo?'disabled':''}>Compra · ${soldi(o.prezzo)}</button>`;
    return `<div class="riga-torneo"><div class="campione" style="background:${o.dorso};border-color:${o.filo}"></div><div class="cresci"><b>${esc(o.nome)}</b><br><small>Dorso delle carte</small></div>${b}</div>`;
  }).join('');
  finestra(`<h2>Banco del negozio</h2><p class="nota">NFT di prova: pochi oggetti per provare l'impianto. Il catalogo vero arriverà più avanti.</p>${righe}
    ${eco.d.nft.equip?'<p><button data-usa="">Torna al mazzo classico</button></p>':''}`,[{testo:'Chiudi',primario:true}],
    {alClic:e=>{
      const c=e.target.closest('[data-compra]'), u=e.target.closest('[data-usa]');
      if(c&&!c.disabled){ if(eco.compra(c.dataset.compra)){ V.suono('vittoria'); aggiornaTesta(); pannelloNegozio(); } }
      if(u){ eco.equipaggia(u.dataset.usa||null); V.suono('clic'); aggiornaTesta(); pannelloNegozio(); }
    }});
}
function pannelloProfilo(){
  const g=A.giocatore(), av=eco.avanzamento(), d=eco.d;
  const giochi=Object.entries(d.perGioco).map(([k,v])=>`<tr><td>${esc(nomeGioco(k))}</td><td>${v.giocate}</td><td>${v.vinte}</td></tr>`).join('');
  const mov=d.movimenti.slice(0,8).map(m=>`<li><span class="${m.n>0?'piu':'meno'}">${m.n>0?'+':''}${nf(m.n)}</span> ${esc(m.causale)}</li>`).join('');
  finestra(`<h2>Portineria</h2>
    <p><b>${esc(g.nome)}</b> · livello ${av.livello}</p>
    <div class="barra-xp"><span style="width:${Math.round(av.frazione*100)}%"></span></div>
    <p class="nota">${av.xp} esperienza · prossimo livello a ${av.a}</p>
    <p>Colore dell'abito:</p><div class="scelte">${V.COLORI_ABITO.map((c,i)=>`<button class="colore ${i===(g.aspetto||0)?'scelto':''}" data-colore="${i}" style="background:${c}" aria-label="Colore ${i+1}"></button>`).join('')}</div>
    <p>${esc(moneta().nome)}: <b>${soldi(eco.saldo())}</b> · partite ${d.giocate} · vinte ${d.vinte}${d.scope?` · scope ${d.scope}`:''}</p>
    ${giochi?`<table class="conti"><tr><th>Gioco</th><th>Partite</th><th>Vinte</th></tr>${giochi}</table>`:''}
    <h3>Wallet TON</h3>
    ${g.wallet?`<code id="indirizzoWallet">${esc(g.wallet)}</code><button class="copia" data-copia="${esc(g.wallet)}" data-sorgente="indirizzoWallet">Copia l'indirizzo</button>`
      :'<p><button data-wallet="1">Collega un wallet di prova</button></p>'}
    <p class="nota">Di prova: serve solo come identità, nessuna transazione.</p>
    ${mov?`<h3>Ultimi movimenti</h3><ul class="movimenti">${mov}</ul>`:''}`,
    [{testo:'Cambia nome',fn:()=>chiediNome()},{testo:'Chiudi',primario:true}],
    {alClic:e=>{
      const c=e.target.closest('[data-colore]'), w=e.target.closest('[data-wallet]');
      if(c){ const gg=A.giocatore(); gg.aspetto=+c.dataset.colore; A.salvaGiocatore(gg); if(mondo) mondo.p.colore=V.COLORI_ABITO[gg.aspetto]; V.suono('clic'); pannelloProfilo(); }
      if(w){ const cs='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-', b=new Uint8Array(46); crypto.getRandomValues(b);
        const gg=A.giocatore(); gg.wallet='EQ'+Array.from(b,x=>cs[x%cs.length]).join(''); A.salvaGiocatore(gg); V.suono('clic'); pannelloProfilo(); }
    }});
}

// ---- menu ----------------------------------------------------------------
$('menu').onclick=()=>{ V.audio.attiva(); V.suono('clic');
  finestra('<h2>La Villa</h2>',[{testo:'Portineria',fn:pannelloProfilo},{testo:'Bacheca dei tornei',fn:pannelloTornei},{testo:'Negozio',fn:pannelloNegozio},{testo:'Chiudi',primario:true}]); };
$('audio').onclick=()=>{ V.audio.attiva(); const g=A.giocatore(); g.muto=!g.muto; A.salvaGiocatore(g); aggiornaTesta(); V.suono('clic'); };
$('esci').onclick=()=>{ V.suono('clic'); lasciaTavolo(); };

// Maniglia per i collaudi automatici nel browser.
globalThis.__villa={ tavolo:()=>tavolo, mondo:()=>mondo, economia:()=>eco, spostaOra:ms=>{ spostamentoOra+=ms; controllaTornei(); } };

// ---- partenza ------------------------------------------------------------
eco=new V.Economia(A,zona.salvataggio,zona.economia);
// Chi aveva giocato alla prima versione: tiene le statistiche.
if(eco.d.giocate&&!eco.d.perGioco.scopa){ eco.d.perGioco.scopa={giocate:eco.d.giocate,vinte:eco.d.vinte}; eco.salva(); }
aggiornaTesta();
avviaMondo();
const regalo=eco.regalo(oggi());
if(!A.giocatore().nome) chiediNome(()=>{ if(regalo) avviso(`Regalo del giorno: +${soldi(regalo)}`); });
else if(regalo) avviso(`Regalo del giorno: +${soldi(regalo)}`);
aggiornaTesta();
})(globalThis.V=globalThis.V||{});

</script></body></html>
